#port
port=9717

#Maximum Connections
maxConnections = 1000

#Max channels
maxQueues=10

#Max Idle Milliseconds to Wait
idleMS=10

# Fixed-record runs fail after this continuous interval without a positive batch.
# The value must be greater than the logger reporting interval.
idleTimeoutSeconds=600

#Maximum SBP latency record size in MiB
maxRecordSizeMB=16

#Max Latency Array Size
maxArraySizeMB=128

#Max latency HashMap Size
maxHashMapSizeMB=512

#Total Window Max latency HashMap Size
totalMaxHashMapSizeMB=1024

# Exact nanosecond values per hybrid page: 2^8 = 256.
exactLatencyPageBits=8

# Keep low-occupancy nanosecond pages compact; promote on the next exact value.
exactLatencySparsePageEntries=32

# Use HDR Histogram for latencies if the maxHashMapSizeMB is full
histogram=false

# Default benchmark action: r, w, wr, wro, rw, or rwo
defaultAction=r
