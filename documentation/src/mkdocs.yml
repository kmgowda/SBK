site_name: 'Storage Benchmark Kit'
site_url: 'https://kmgowda.github.io/SBK/'
site_description: 'Documentation for SBK'

repo_url: 'https://github.com/kmgowda/SBK'


# Extensions
markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
  - footnotes
  - meta
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - SBK: 'https://github.com/kmgowda/SBK/blob/master/README.md'
  - Documentation Index: 'https://github.com/kmgowda/SBK/blob/master/docs/README.md'
  - Architecture: 'https://github.com/kmgowda/SBK/blob/master/docs/ARCHITECTURE.md'
  - PerL: 'https://github.com/kmgowda/SBK/blob/master/perl/README.md'
  - SBK Web Console: 'https://github.com/kmgowda/SBK/blob/master/sbk-web-console/README.md'
  - SBM: 'https://github.com/kmgowda/SBK/blob/master/sbm/README.md'
  - SBK YAL: 'https://github.com/kmgowda/SBK/blob/master/sbk-yal/README.md'
  - SBK GEM: 'https://github.com/kmgowda/SBK/blob/master/sbk-gem/README.md'
  - SBK GEM YAL: 'https://github.com/kmgowda/SBK/blob/master/sbk-gem-yal/README.md'
