# Aider configuration for the Storage Benchmark Kit repository.
# Repository-wide engineering rules live in AGENTS.md; do not duplicate them
# here. A contributor can override model choice and personal UI preferences in
# a later-loaded user or current-directory config.

input-history-file: .aider.input.history
chat-history-file: .aider.chat.history.md

# Keep the authoritative repository guide in every session. Use /drop followed
# by /add AGENTS.md only when the task explicitly edits that file.
read:
  - AGENTS.md

# A normal coding request does not imply permission to create commits. Let the
# user review and commit the resulting patch explicitly.
auto-commits: false
dirty-commits: false

# Preserve Aider's repository awareness without pinning a provider-specific
# model or an obsolete model name.
git: true
gitignore: true
map-tokens: 2048
suggest-shell-commands: true
