# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: SBK Java CI with Gradle

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  affected-check:
    name: Affected-module checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - name: Set up Gradle caching
      uses: gradle/actions/setup-gradle@v4
    - name: Run affected-module checks
      run: ./gradle/affected-check.sh "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - name: Set up Gradle caching
      uses: gradle/actions/setup-gradle@v4
    - name: Check and build the complete SBK distribution
      run: ./gradlew check :build
    - name: Upload distribution artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sbk-distribution
        path: build/install/sbk/
        retention-days: 90

  gem-local-docker:
    name: SBK-GEM two-node functional test
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '25'
    - name: Set up Gradle caching
      uses: gradle/actions/setup-gradle@v4
    - name: Run Docker-backed SBK-GEM functional coverage
      run: ./gradlew releasePreflight releaseFunctionalTest -Pprofile=local-docker --no-daemon --rerun-tasks
    - name: Upload functional evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sbk-gem-local-docker-results
        path: |
          build/reports/release-qualification/
          build/reports/tests/releaseFunctionalTest/
          build/test-results/releaseFunctionalTest/
        if-no-files-found: warn
        retention-days: 30
