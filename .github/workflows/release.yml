name: SBK Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SBK version from gradle.properties (for example, 10.5)
        required: true
        type: string
      dry_run:
        description: Build release assets and containers without tags, uploads, releases, or registry pushes
        required: true
        default: true
        type: boolean
      prerelease:
        description: Mark the GitHub Release as a prerelease and do not update stable container aliases
        required: true
        default: false
        type: boolean
      resume:
        description: Resume an exact-commit draft release after a partial publication failure
        required: true
        default: false
        type: boolean

concurrency:
  group: sbk-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_ASSET_ARTIFACT: sbk-release-assets-${{ github.run_id }}
  RELEASE_CONTAINER_ARTIFACT: sbk-release-container-${{ github.run_id }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      major: ${{ steps.release.outputs.major }}
      stable: ${{ steps.release.outputs.stable }}
      runtime-image: ${{ steps.release.outputs.runtime_image }}
      build-date: ${{ steps.release.outputs.build_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Validate immutable release identity
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          configured_version=$(sed -n 's/^sbkVersion=//p' gradle.properties)
          if [[ -z "$configured_version" || "$REQUESTED_VERSION" != "$configured_version" ]]; then
            echo "Requested version '$REQUESTED_VERSION' does not match sbkVersion '$configured_version'" >&2
            exit 1
          fi
          if [[ "$DRY_RUN" != "true" && "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "Publication must run from master, not $GITHUB_REF" >&2
            exit 1
          fi
          stable=true
          if [[ "$PRERELEASE" == "true" || "$REQUESTED_VERSION" == *-* ]]; then
            stable=false
          fi
          runtime_image=$(sed -n 's/^runtimeContainerImage=//p' gradle.properties)
          if [[ -z "$runtime_image" ]]; then
            echo "runtimeContainerImage is not configured" >&2
            exit 1
          fi
          echo "version=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "major=${REQUESTED_VERSION%%.*}" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "runtime_image=$runtime_image" >> "$GITHUB_OUTPUT"
          echo "build_date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

  prepare-assets:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build complete release artifacts
        run: ./gradlew clean releasePublicationAssets --no-daemon --rerun-tasks
      - name: Preserve executable container context
        run: tar -cf build/sbk-release-container-context.tar -C build/release-container .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.RELEASE_ASSET_ARTIFACT }}
          path: build/release-assets/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.RELEASE_CONTAINER_ARTIFACT }}
          path: build/sbk-release-container-context.tar
          if-no-files-found: error
          retention-days: 30

  validate-container:
    needs: [preflight, prepare-assets]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ env.RELEASE_CONTAINER_ARTIFACT }}
          path: build
      - name: Restore container context
        run: |
          mkdir -p build/release-container
          tar -xf build/sbk-release-container-context.tar -C build/release-container
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build runnable native image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: build/release-container
          load: true
          platforms: ${{ matrix.platform }}
          tags: sbk-release:${{ matrix.suffix }}
          build-args: |
            RUNTIME_IMAGE=${{ needs.preflight.outputs.runtime-image }}
            APPLICATION_VERSION=${{ needs.preflight.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ needs.preflight.outputs.build-date }}
          cache-from: type=gha,scope=sbk-release-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=sbk-release-${{ matrix.suffix }},ignore-error=true
      - name: Validate launcher and real file benchmark
        env:
          IMAGE: sbk-release:${{ matrix.suffix }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          version_output=$(docker run --rm "$IMAGE" -version)
          grep -F "SBK Version: $VERSION" <<< "$version_output"
          benchmark_output=$(docker run --rm --tmpfs /data:rw,uid=1001,gid=0 "$IMAGE" \
            -class file -file /data/sbk.dat -writers 1 -size 100 -records 1000 -out SystemLogger)
          grep -F "Total File Writing" <<< "$benchmark_output"
      - name: Enforce container vulnerability policy
        if: matrix.platform == 'linux/amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sbk-release:amd64
          version: v0.74.0
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  publish-container:
    if: ${{ !inputs.dry_run }}
    needs: [preflight, prepare-assets, validate-container]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.publish-image.outputs.digest }}
    env:
      GITHUB_USER: ${{ secrets.RELEASE_GITHUB_USER || vars.GITHUB_USER || github.actor }}
      GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      DOCKER_USER: ${{ secrets.DOCKERHUB_USER || secrets.DOCKERHUB_USERNAME || secrets.RELEASE_DOCKER_USER }}
      DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN || secrets.RELEASE_DOCKER_TOKEN }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ env.RELEASE_CONTAINER_ARTIFACT }}
          path: build
      - name: Restore container context
        run: |
          mkdir -p build/release-container
          tar -xf build/sbk-release-container-context.tar -C build/release-container
      - name: Require publication credentials
        run: |
          test -n "$GITHUB_USER" && test -n "$GITHUB_TOKEN"
          test -n "$DOCKER_USER" && test -n "$DOCKER_TOKEN"
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ env.DOCKER_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ env.GITHUB_USER }}
          password: ${{ env.GITHUB_TOKEN }}
      - name: Generate OCI metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            kmgowda/sbk
            ghcr.io/kmgowda/sbk
          tags: |
            type=raw,value=${{ needs.preflight.outputs.version }}
            type=raw,value=${{ needs.preflight.outputs.major }},enable=${{ needs.preflight.outputs.stable }}
            type=raw,value=latest,enable=${{ needs.preflight.outputs.stable }}
          labels: |
            org.opencontainers.image.created=${{ needs.preflight.outputs.build-date }}
      - name: Publish multi-architecture image to both registries
        id: publish-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: build/release-container
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          build-args: |
            RUNTIME_IMAGE=${{ needs.preflight.outputs.runtime-image }}
            APPLICATION_VERSION=${{ needs.preflight.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ needs.preflight.outputs.build-date }}
          cache-from: |
            type=gha,scope=sbk-release-amd64
            type=gha,scope=sbk-release-arm64
          provenance: mode=max
          sbom: true
      - name: Verify both registries expose the published digest
        env:
          DIGEST: ${{ steps.publish-image.outputs.digest }}
          VERSION: ${{ needs.preflight.outputs.version }}
          STABLE: ${{ needs.preflight.outputs.stable }}
          MAJOR: ${{ needs.preflight.outputs.major }}
        run: |
          set -euo pipefail
          for image in kmgowda/sbk ghcr.io/kmgowda/sbk; do
            docker buildx imagetools inspect "$image@$DIGEST"
            version_raw=$(docker buildx imagetools inspect --raw "$image:$VERSION" | sha256sum | cut -d ' ' -f 1)
            test "sha256:$version_raw" = "$DIGEST"
            if [[ "$STABLE" == "true" ]]; then
              latest_raw=$(docker buildx imagetools inspect --raw "$image:latest" | sha256sum | cut -d ' ' -f 1)
              major_raw=$(docker buildx imagetools inspect --raw "$image:$MAJOR" | sha256sum | cut -d ' ' -f 1)
              test "$version_raw" = "$latest_raw"
              test "$version_raw" = "$major_raw"
            fi
          done
      - name: Sign immutable image digests with GitHub OIDC
        env:
          DIGEST: ${{ steps.publish-image.outputs.digest }}
        run: cosign sign --yes "kmgowda/sbk@$DIGEST" "ghcr.io/kmgowda/sbk@$DIGEST"

  publish-packages:
    if: ${{ !inputs.dry_run }}
    needs: [preflight, prepare-assets, validate-container]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      SBK_RELEASE_WORKFLOW: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Publish consumable modules to GitHub Packages
        env:
          GITHUB_USER: ${{ secrets.RELEASE_GITHUB_USER || vars.GITHUB_USER || github.actor }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew releasePublishCoreToGitHubPackages --no-daemon

  publish-release:
    if: ${{ !inputs.dry_run }}
    needs: [preflight, prepare-assets, validate-container, publish-container, publish-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GITHUB_USER: ${{ secrets.RELEASE_GITHUB_USER || vars.GITHUB_USER || github.actor }}
      GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      CONTAINER_DIGEST: ${{ needs.publish-container.outputs.digest }}
      PRERELEASE: ${{ inputs.prerelease }}
      RESUME: ${{ inputs.resume }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ env.RELEASE_ASSET_ARTIFACT }}
          path: build/release-assets
      - name: Bind the release manifest to the container digest
        run: |
          ./gradlew finalizeReleaseManifest \
            "-PreleaseContainerDigest=$CONTAINER_DIGEST" \
            "-PreleaseAssetsDir=$PWD/build/release-assets" --no-daemon
      - name: Create or validate the annotated release tag
        run: |
          set -euo pipefail
          test -n "$GITHUB_USER" && test -n "$GITHUB_TOKEN"
          git fetch --tags origin
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            tag_commit=$(git rev-list -n 1 "$RELEASE_TAG")
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "$RELEASE_TAG already points to $tag_commit, not $GITHUB_SHA" >&2
              exit 1
            fi
          else
            git config user.name "$GITHUB_USER"
            git config user.email "$GITHUB_USER@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "SBK $RELEASE_VERSION"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - name: Create or resume a draft GitHub Release
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$RESUME" != "true" ]]; then
              echo "Release $RELEASE_TAG already exists; inspect it and rerun with resume=true" >&2
              exit 1
            fi
            is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
            test "$is_draft" = "true"
          else
            notes_file=".github/release-notes/$RELEASE_VERSION.md"
            test -s "$notes_file"
            options=(--verify-tag --draft --notes-file "$notes_file" --title "SBK $RELEASE_VERSION")
            if [[ "$PRERELEASE" == "true" ]]; then
              options+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${options[@]}"
          fi
      - name: Upload the complete, checksum-verified asset contract
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/existing-release-assets"
          missing=()
          while IFS= read -r -d '' asset; do
            name=$(basename "$asset")
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              gh release download "$RELEASE_TAG" --pattern "$name" \
                --dir "$RUNNER_TEMP/existing-release-assets"
              cmp "$asset" "$RUNNER_TEMP/existing-release-assets/$name"
            else
              missing+=("$asset")
            fi
          done < <(find build/release-assets -maxdepth 1 -type f -print0 | sort -z)
          if (( ${#missing[@]} > 0 )); then
            gh release upload "$RELEASE_TAG" "${missing[@]}"
          fi
      - name: Publish the complete GitHub Release
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi

  dry-run-result:
    if: ${{ inputs.dry_run }}
    needs: [preflight, prepare-assets, validate-container]
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm the non-publishing boundary
        run: |
          echo "SBK ${{ needs.preflight.outputs.version }} release dry run passed."
          echo "Both native container architectures and every contracted release asset were validated."
          echo "No tag, GitHub Release, Maven package, Docker Hub image, or GHCR image was published."
