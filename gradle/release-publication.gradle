// Keep release archives byte-for-byte reproducible across independent builds.
releaseApplicationProjects.each { applicationProject ->
    applicationProject.tasks.withType(AbstractArchiveTask).configureEach {
        reproducibleFileOrder = true
        preserveFileTimestamps = false
