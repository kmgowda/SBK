def verifyReleasePublicationScope = tasks.register('verifyReleasePublicationScope') {
    group = 'verification'
    description = 'Proves that standalone release publication is restricted to core modules.'
    doLast {
        def configuredPaths = releaseMavenProjects.collect { it.path } as Set
        if (configuredPaths != expectedReleaseMavenProjectPaths) {
            throw new GradleException("Unexpected Maven release project set: ${configuredPaths}")
        }
        def publishableDriverProjects = rootProject.allprojects.findAll {
            it.path.startsWith(':drivers:') && it.pluginManager.hasPlugin('maven-publish')
        }
        if (!publishableDriverProjects.isEmpty()) {
            throw new GradleException('Drivers must not apply maven-publish: '
                    + publishableDriverProjects.collect { it.path }.join(', '))
        }
        def gradleMavenSigningTasks = releaseMavenProjects.collectMany { publicationProject ->
            publicationProject.tasks.matching {
                it.name == 'signMavenJavaPublication'
            }.toList()
        }
        if (!gradleMavenSigningTasks.isEmpty()) {
            throw new GradleException('JReleaser must be the sole Maven publication signer: '
                    + gradleMavenSigningTasks.collect { it.path }.join(', '))
        }
    }
}

