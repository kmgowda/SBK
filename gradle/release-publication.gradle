def collectReleaseAssets = tasks.register('collectReleaseAssets', Sync) {
    group = 'distribution'
    description = 'Collects distributions, documentation, and core-module SBOMs for a release.'
    dependsOn tasks.named('releasePackaging')
    dependsOn releaseAgentDocs
    dependsOn releaseCoreSboms
    into releaseAssetsDirectory

    releaseApplicationProjects.each { applicationProject ->
        from(applicationProject.layout.buildDirectory.dir('distributions')) {
            include '*.zip', '*.tar'
        }
    }
    from(releaseAgentDocs.flatMap { it.archiveFile })
    releaseMavenProjects.each { publicationProject ->
        from(publicationProject.layout.buildDirectory.dir('reports/cyclonedx-direct')) {
            include 'bom.json'
            rename { "${publicationProject.name}-${sbkVersion}-sbom.cdx.json" }
        }
        from(publicationProject.layout.buildDirectory.dir('reports/cyclonedx-direct')) {
            include 'bom.xml'
            rename { "${publicationProject.name}-${sbkVersion}-sbom.cdx.xml" }
        }
    }
}

def generateReleaseManifest = tasks.register('generateReleaseManifest') {
    group = 'distribution'
    description = 'Generates the checksum and immutable metadata contract for an SBK release.'
    dependsOn collectReleaseAssets
    outputs.files(
            releaseAssetsDirectory.map { it.file('SHA256SUMS') },
            releaseAssetsDirectory.map { it.file('release-manifest.json') })
    outputs.upToDateWhen { false }

    doLast {
        def assetsDirectory = releaseAssetsDirectory.get().asFile
        def currentCommit = providers.exec {
            commandLine 'git', 'rev-parse', 'HEAD'
        }.standardOutput.asText.get().trim()

        def requiredAssets = [
                "sbk-${sbkVersion}.zip",
                "sbk-${sbkVersion}.tar",
                "sbm-${sbkVersion}.zip",
                "sbm-${sbkVersion}.tar",
                "sbk-web-console-${sbkVersion}.zip",
                "sbk-web-console-${sbkVersion}.tar",
                'sbk-agent-docs.tar.gz'
        ] + releaseMavenProjects.collectMany { publicationProject ->
            ["${publicationProject.name}-${sbkVersion}-sbom.cdx.json",
             "${publicationProject.name}-${sbkVersion}-sbom.cdx.xml"]
        }
        def missingAssets = requiredAssets.findAll {
            def artifact = new File(assetsDirectory, it)
            !artifact.isFile() || artifact.length() == 0L
        }
        if (!missingAssets.isEmpty()) {
            throw new GradleException('Missing contracted release assets:\n' + missingAssets.join('\n'))
        }

        def payloadFiles = assetsDirectory.listFiles().findAll {
            it.isFile() && !(it.name in ['SHA256SUMS', 'release-manifest.json'])
        }.sort { left, right -> left.name <=> right.name }
        def artifacts = payloadFiles.collect { artifact ->
            [name: artifact.name, size: artifact.length(), sha256: sha256File(artifact)]
        }

        def configuredContainerDigest = findProperty('releaseContainerDigest')?.toString()?.trim()
        def manifest = [
                schemaVersion: 1,
                product: 'SBK',
                version: sbkVersion.toString(),
                tag: "v${sbkVersion}",
                commit: currentCommit,
                artifacts: artifacts,
                containers: [
                        status: configuredContainerDigest ? 'published' : 'dry-run',
                        images: releaseImageNames,
                        platforms: releasePlatforms,
                        digest: configuredContainerDigest ?: null
                ]
        ]
        def manifestFile = new File(assetsDirectory, 'release-manifest.json')
        manifestFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + System.lineSeparator()
        writeReleaseChecksums(assetsDirectory)
    }
}

tasks.register('finalizeReleaseManifest') {
    group = 'distribution'
    description = 'Binds an already-built release manifest to the published container digest.'
    outputs.upToDateWhen { false }
    doLast {
        def configuredContainerDigest = findProperty('releaseContainerDigest')?.toString()?.trim()
        if (configuredContainerDigest == null || !(configuredContainerDigest ==~ /sha256:[0-9a-f]{64}/)) {
            throw new GradleException(
                    'finalizeReleaseManifest requires -PreleaseContainerDigest=sha256:<64 hex characters>')
        }
        def assetsDirectoryProperty = findProperty('releaseAssetsDir')?.toString()?.trim()
        def assetsDirectory = assetsDirectoryProperty
                ? file(assetsDirectoryProperty) : releaseAssetsDirectory.get().asFile
        def manifestFile = new File(assetsDirectory, 'release-manifest.json')
        if (!manifestFile.isFile()) {
            throw new GradleException("Release manifest does not exist: ${manifestFile}")
        }
        def manifest = new JsonSlurper().parse(manifestFile)
        if (manifest.version != sbkVersion.toString() || manifest.tag != "v${sbkVersion}") {
            throw new GradleException('Release manifest version does not match the SBK build version')
        }
        manifest.containers.status = 'published'
        manifest.containers.digest = configuredContainerDigest
        manifestFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + System.lineSeparator()
        writeReleaseChecksums(assetsDirectory)
    }
}

