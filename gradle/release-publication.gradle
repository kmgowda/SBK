def verifyDockerHubPublication = tasks.register('verifyDockerHubPublication') {
    group = 'verification'
    description = 'Validates the confirmation and local Docker Hub credentials before publication.'
    doLast {
        def expectedConfirmation = "RELEASE-${sbkVersion}"
        def suppliedConfirmation = findProperty('releaseConfirm')?.toString()?.trim()
        if (suppliedConfirmation != expectedConfirmation) {
            throw new GradleException(
                    "Docker Hub publication requires -PreleaseConfirm=${expectedConfirmation}")
        }
        if (!System.getenv('DOCKER_USERNAME')?.trim() || !System.getenv('DOCKER_PASSWORD')) {
            throw new GradleException(
                    'Docker Hub publication requires DOCKER_USERNAME and DOCKER_PASSWORD')
        }
    }
}

def publishDockerHub = tasks.register('publishDockerHub') {
    group = 'publishing'
    description = 'Publishes the multi-architecture SBK image to Docker Hub using local credentials.'
    dependsOn verifyDockerHubPublication
    dependsOn prepareReleaseContainer
    outputs.file releaseDockerHubDigestFile
    outputs.file releaseDockerHubMetadataFile
    outputs.upToDateWhen { false }
    doLast {
        def dockerUsername = System.getenv('DOCKER_USERNAME')?.trim()
        def dockerPassword = System.getenv('DOCKER_PASSWORD')

        def prerelease = releaseBooleanProperty('releasePrerelease') == 'true'
                || sbkVersion.toString().contains('-')
        def majorVersion = sbkVersion.toString().tokenize('.').first()
        def buildDate = readReleaseCommand(['git', 'show', '-s', '--format=%cI', 'HEAD'])
        def commit = readReleaseCommand(['git', 'rev-parse', 'HEAD'])
        def metadataFile = releaseDockerHubMetadataFile.get().asFile
        metadataFile.parentFile.mkdirs()
        def digestFile = releaseDockerHubDigestFile.get().asFile
        digestFile.parentFile.mkdirs()
        def dockerConfigDirectory = Files.createTempDirectory('sbk-docker-config-').toFile()
        def environment = ['DOCKER_CONFIG': dockerConfigDirectory.absolutePath]

        try {
            runReleaseCommand(['docker', 'buildx', 'version'], environment)
            runReleaseCommand(
                    ['docker', 'login', '--username', dockerUsername, '--password-stdin'],
                    environment, dockerPassword)

            def command = [
                    'docker', 'buildx', 'build',
                    '--platform', releasePlatforms.join(','),
                    '--push',
                    '--provenance=mode=max',
                    '--sbom=true',
                    '--build-arg', "RUNTIME_IMAGE=${runtimeContainerImage}",
                    '--build-arg', "APPLICATION_VERSION=${sbkVersion}",
                    '--build-arg', "VCS_REF=${commit}",
                    '--build-arg', "BUILD_DATE=${buildDate}",
                    '--label', "org.opencontainers.image.created=${buildDate}",
                    '--label', "org.opencontainers.image.revision=${commit}",
                    '--label', "org.opencontainers.image.version=${sbkVersion}",
                    '--metadata-file', metadataFile.absolutePath,
                    '--tag', "kmgowda/sbk:${sbkVersion}"
            ]
            if (!prerelease) {
                command.addAll([
                        '--tag', "kmgowda/sbk:${majorVersion}",
                        '--tag', 'kmgowda/sbk:latest'
                ])
            }
            command.add(releaseContainerDirectory.get().asFile.absolutePath)
            runReleaseCommand(command, environment)

            def metadata = new JsonSlurper().parse(metadataFile)
            def digest = metadata['containerimage.digest']?.toString()?.trim()
            if (!(digest ==~ /sha256:[0-9a-f]{64}/)) {
                throw new GradleException(
                        "Docker Buildx did not report a valid image digest: ${digest}")
            }
            runReleaseCommand(
                    ['docker', 'buildx', 'imagetools', 'inspect', "kmgowda/sbk@${digest}"],
                    environment)
            digestFile.text = digest + System.lineSeparator()
            logger.lifecycle("Docker Hub image published: kmgowda/sbk@${digest}")
        } finally {
            delete dockerConfigDirectory
        }
    }
}

prepareReleaseContainer.configure {
    mustRunAfter verifyDockerHubPublication
}

def verifyReleaseDispatch = tasks.register('verifyReleaseDispatch') {
    group = 'verification'
    description = 'Validates GitHub dispatch credentials before any release publication occurs.'
    doLast {
        def expectedConfirmation = "RELEASE-${sbkVersion}"
        def suppliedConfirmation = findProperty('releaseConfirm')?.toString()?.trim()
        if (suppliedConfirmation != expectedConfirmation) {
            throw new GradleException(
                    "Actual publication requires -PreleaseConfirm=${expectedConfirmation}")
        }
        def githubToken = findProperty('github.token')?.toString()?.trim()
                ?: System.getenv('GITHUB_TOKEN')?.trim()
        if (githubToken == null) {
            throw new GradleException(
                    'GitHub Actions dispatch requires -Pgithub.token or GITHUB_TOKEN')
        }
    }
}

publishDockerHub.configure {
    mustRunAfter verifyReleaseDispatch
}

tasks.register('publish') {
    group = 'publishing'
    description = 'Publishes Docker Hub locally and dispatches the GitHub release workflow.'
    dependsOn verifyReleaseDispatch
    dependsOn publishDockerHub
    doLast {
        def expectedConfirmation = "RELEASE-${sbkVersion}"
        def suppliedConfirmation = findProperty('releaseConfirm')?.toString()?.trim()
        if (suppliedConfirmation != expectedConfirmation) {
            throw new GradleException(
                    "Actual publication requires -PreleaseConfirm=${expectedConfirmation}")
        }

        def githubToken = findProperty('github.token')?.toString()?.trim()
                ?: System.getenv('GITHUB_TOKEN')?.trim()
        if (githubToken == null) {
            throw new GradleException(
                    'GitHub Actions dispatch requires -Pgithub.token or GITHUB_TOKEN')
        }

        def prerelease = releaseBooleanProperty('releasePrerelease')
        def resume = releaseBooleanProperty('releaseResume')
        def dockerHubDigest = releaseDockerHubDigestFile.get().asFile.text.trim()
        if (!(dockerHubDigest ==~ /sha256:[0-9a-f]{64}/)) {
            throw new GradleException(
                    "Invalid locally published Docker Hub digest: ${dockerHubDigest}")
        }
        def repository = releaseGitHubRepository.toString().trim()
        def workflow = releaseWorkflowFile.toString().trim()
        def workflowRef = releaseWorkflowRef.toString().trim()
        def apiUrl = releaseGitHubApiUrl.toString().replaceAll('/+$', '')
        def requestPath = "${apiUrl}/repos/${repository}/actions/workflows/" +
                "${workflow}/dispatches"
        def requestUri = URI.create(requestPath)
        def requestPayload = JsonOutput.toJson([
                ref: workflowRef,
                inputs: [
                        version: sbkVersion.toString(),
                        dry_run: 'false',
                        prerelease: prerelease,
                        resume: resume,
                        dockerhub_digest: dockerHubDigest
                ]
        ])
        def timeout = Duration.ofSeconds(releaseDispatchTimeoutSeconds.toString().toLong())
        def httpClient = HttpClient.newBuilder().connectTimeout(timeout).build()
        def request = HttpRequest.newBuilder(requestUri)
                .timeout(timeout)
                .header('Accept', 'application/vnd.github+json')
                .header('Authorization', "Bearer ${githubToken}")
                .header('X-GitHub-Api-Version', releaseGitHubApiVersion.toString())
                .POST(HttpRequest.BodyPublishers.ofString(requestPayload))
                .build()
        def response = httpClient.send(request, HttpResponse.BodyHandlers.ofString())
        if (response.statusCode() != 204) {
            throw new GradleException(
                    "GitHub release workflow dispatch failed with HTTP ${response.statusCode()}: "
                            + response.body())
        }

        logger.lifecycle("SBK ${sbkVersion} release workflow dispatched from ${workflowRef}.")
        def webUrl = releaseGitHubWebUrl.toString().replaceAll('/+$', '')
        logger.lifecycle("Monitor: ${webUrl}/${repository}/actions/workflows/${workflow}")
    }
}

def releasePublicationTaskNames = [
        'releaseCoreSboms', 'verifyReleasePublicationScope',
        'releaseStageCorePublications', 'releasePublishCoreToGitHubPackages',
        'verifyCorePublicationStaging', 'verifyExistingCoreGitHubPackages',
        'releaseAgentDocs', 'collectReleaseAssets', 'generateReleaseManifest',
        'finalizeReleaseManifest', 'prepareReleaseContainer',
        'releasePublicationAssets', 'releasePublicationDryRun',
        'verifyDockerHubPublication', 'publishDockerHub',
        'verifyReleaseDispatch', 'publish'
] as Set

// Publication reads credentials, remote state, the live Git commit, and
// external command results during execution. Those operations deliberately
// remain outside the configuration-cache contract used by routine builds.
tasks.configureEach { task ->
    if (task.name in releasePublicationTaskNames) {
        task.notCompatibleWithConfigurationCache(
                'Release publication uses live credentials, Git, and remote service state')
    }
}

gradle.projectsEvaluated {
    if (rootReleasePublishRequested) {
        releaseMavenProjects.each { publicationProject ->
            publicationProject.tasks.named('publish').configure {
                setDependsOn([])
                enabled = false
            }
        }
    }
    tasks.named('jreleaserConfig').configure { mustRunAfter releaseStageCorePublications }
    tasks.named('jreleaserDeploy').configure { mustRunAfter releaseStageCorePublications }
}

gradle.taskGraph.whenReady { graph ->
    if (project.hasProperty('github')) {
        throw new GradleException(
                '-Pgithub has been removed; use the root publish task for a complete release')
    }
    if (graph.hasTask(releasePublishCoreToGitHubPackages.get())
            && System.getenv('SBK_RELEASE_WORKFLOW') != 'true') {
        throw new GradleException(
                'releasePublishCoreToGitHubPackages is restricted to the guarded release workflow')
    }
}
