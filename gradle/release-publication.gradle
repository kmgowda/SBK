import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.net.URI
import java.net.http.HttpClient
import java.net.http.HttpRequest
import java.net.http.HttpResponse
import java.security.MessageDigest
import java.time.Duration
import org.gradle.api.tasks.bundling.Compression

def releaseAssetsDirectory = layout.buildDirectory.dir('release-assets')
def releaseIntermediateDirectory = layout.buildDirectory.dir('release-intermediates')
def releaseContainerDirectory = layout.buildDirectory.dir('release-container')
def qualificationDirectory = layout.buildDirectory.dir('reports/release-qualification')
def releaseMavenStagingDirectory = mavenStagingRepositoryDirectory.toString()
def releaseApplicationProjects = [project, project(':sbm'), project(':sbk-web-console')]
def releaseMavenProjects = [
        project(':perl'), project(':sbk-web-console'), project(':sbk-api'), project(':sbm'),
        project(':sbk-yal'), project(':sbk-gem'), project(':sbk-gem-yal')
]
def expectedReleaseMavenProjectPaths = [
        ':perl', ':sbk-web-console', ':sbk-api', ':sbm', ':sbk-yal', ':sbk-gem', ':sbk-gem-yal'
] as Set
def releaseImageNames = ['kmgowda/sbk', 'ghcr.io/kmgowda/sbk']
def releasePlatforms = ['linux/amd64', 'linux/arm64']
def rootReleasePublishRequested = gradle.startParameter.taskNames.any {
    it == 'publish' || it == ':publish'
}
def releaseBooleanProperty = { String propertyName ->
    def value = findProperty(propertyName)?.toString()?.trim()?.toLowerCase() ?: 'false'
    if (!(value in ['true', 'false'])) {
        throw new GradleException("${propertyName} must be true or false")
    }
    value
}

def configuredJreleaserFile = findProperty('jreleaser.configFile')?.toString()?.trim()
def environmentJreleaserFile = System.getenv('JRELEASER_CONFIG_FILE')?.trim()
def defaultJreleaserFile = file(
        "${System.getProperty('user.home')}/.jreleaser/config.toml").absolutePath
def jreleaserConfigFile = configuredJreleaserFile
        ?: environmentJreleaserFile
        ?: defaultJreleaserFile

// JReleaser is the sole signing and Maven Central deployment authority. Keep
// all core staging repositories in one root configuration so newly extracted
// modules cannot be omitted by per-project configuration order.
jreleaser {
    environment {
        variables = jreleaserConfigFile
    }

    release {
        github {
            enabled = true
            skipRelease = true
            skipTag = true
            overwrite = false
        }
    }

    upload {
        active = 'ALWAYS'
        enabled = true
    }

    signing {
        active = 'ALWAYS'
        armored = true
    }

    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = 'ALWAYS'
                    stage = 'UPLOAD'
                    url = mavenCentralPublisherUrl
                    releaseMavenProjects.each { publicationProject ->
                        stagingRepository(publicationProject.layout.buildDirectory
                                .dir(releaseMavenStagingDirectory).get().toString())
                    }
                    setAuthorization('Basic')
                    sign = true
                    checksums = true
                    sourceJar = true
                    javadocJar = true
                    applyMavenCentralRules = true
                }
            }
        }
    }
}
def sha256File = { File artifact ->
    def digest = MessageDigest.getInstance('SHA-256')
    artifact.withInputStream { input ->
        byte[] buffer = new byte[8192]
        int count
        while ((count = input.read(buffer)) > 0) {
            digest.update(buffer, 0, count)
        }
    }
    digest.digest().encodeHex().toString()
}
def writeReleaseChecksums = { File assetsDirectory ->
    def checksumFiles = assetsDirectory.listFiles().findAll {
        it.isFile() && it.name != 'SHA256SUMS'
    }.sort { left, right -> left.name <=> right.name }
    def checksumLines = checksumFiles.collect { artifact ->
        "${sha256File(artifact)}  ${artifact.name}"
    }
    new File(assetsDirectory, 'SHA256SUMS').text =
            checksumLines.join(System.lineSeparator()) + System.lineSeparator()
}

releaseMavenProjects.each { publicationProject ->
    publicationProject.apply plugin: 'org.cyclonedx.bom'
    publicationProject.tasks.named('cyclonedxDirectBom').configure {
        includeConfigs = ['runtimeClasspath']
        skipConfigs = ['(?i).*test.*']
        testConfigs = []
    }
}

def releaseCoreSboms = tasks.register('releaseCoreSboms') {
    group = 'distribution'
    description = 'Generates direct CycloneDX SBOMs for publishable core modules only.'
    dependsOn releaseMavenProjects.collect { it.tasks.named('cyclonedxDirectBom') }
}

def verifyReleasePublicationScope = tasks.register('verifyReleasePublicationScope') {
    group = 'verification'
    description = 'Proves that standalone release publication is restricted to core modules.'
    doLast {
        def configuredPaths = releaseMavenProjects.collect { it.path } as Set
        if (configuredPaths != expectedReleaseMavenProjectPaths) {
            throw new GradleException("Unexpected Maven release project set: ${configuredPaths}")
        }
        def publishableDriverProjects = rootProject.allprojects.findAll {
            it.path.startsWith(':drivers:') && it.pluginManager.hasPlugin('maven-publish')
        }
        if (!publishableDriverProjects.isEmpty()) {
            throw new GradleException('Drivers must not apply maven-publish: '
                    + publishableDriverProjects.collect { it.path }.join(', '))
        }
        def gradleMavenSigningTasks = releaseMavenProjects.collectMany { publicationProject ->
            publicationProject.tasks.matching {
                it.name == 'signMavenJavaPublication'
            }.toList()
        }
        if (!gradleMavenSigningTasks.isEmpty()) {
            throw new GradleException('JReleaser must be the sole Maven publication signer: '
                    + gradleMavenSigningTasks.collect { it.path }.join(', '))
        }
    }
}

def releaseStageCorePublications = tasks.register('releaseStageCorePublications') {
    group = 'publishing'
    description = 'Stages only core SBK module publications locally for JReleaser.'
    dependsOn verifyReleasePublicationScope
    dependsOn releaseMavenProjects.collect { "${it.path}:publish" }
}

def releasePublishCoreToGitHubPackages = tasks.register('releasePublishCoreToGitHubPackages') {
    group = 'publishing'
    description = 'Internal workflow task that publishes only core SBK modules to GitHub Packages.'
    dependsOn verifyReleasePublicationScope
    dependsOn releaseMavenProjects.collect { "${it.path}:publish" }
}

def verifyCorePublicationStaging = tasks.register('verifyCorePublicationStaging') {
    group = 'verification'
    description = 'Validates the core Maven artifacts staged for JReleaser deployment.'
    dependsOn releaseStageCorePublications
    doLast {
        releaseMavenProjects.each { publicationProject ->
            def artifactDirectory = publicationProject.layout.buildDirectory.dir(
                    "${releaseMavenStagingDirectory}/${sbkGroup.replace('.', '/')}/" +
                            "${publicationProject.name}/${sbkVersion}")
                    .get().asFile
            def requiredFiles = [
                    "${publicationProject.name}-${sbkVersion}.pom",
                    "${publicationProject.name}-${sbkVersion}.jar",
                    "${publicationProject.name}-${sbkVersion}-sources.jar",
                    "${publicationProject.name}-${sbkVersion}-javadoc.jar",
                    "${publicationProject.name}-${sbkVersion}-docs.jar"
            ]
            def missingFiles = requiredFiles.findAll {
                def artifact = new File(artifactDirectory, it)
                !artifact.isFile() || artifact.length() == 0L
            }
            if (!missingFiles.isEmpty()) {
                throw new GradleException("Missing staged artifacts for ${publicationProject.path}: "
                        + missingFiles.join(', '))
            }
        }
    }
}

def releaseAgentDocs = tasks.register('releaseAgentDocs', Tar) {
    group = 'distribution'
    description = 'Creates the complete SBK agent and engineering documentation archive.'
    archiveFileName = 'sbk-agent-docs.tar.gz'
    destinationDirectory = releaseIntermediateDirectory
    compression = Compression.GZIP
    reproducibleFileOrder = true
    preserveFileTimestamps = false

    from('AGENTS.md')
    from('INSTRUCTIONS.md')
    from('README.md')
    from('.cursorrules')
    from('.aider.conf.yml')
    from('.cursor') {
        into '.cursor'
    }
    from('.devin/skills') {
        into '.devin/skills'
    }
    from('docs') {
        into 'docs'
    }
}

def collectReleaseAssets = tasks.register('collectReleaseAssets', Sync) {
    group = 'distribution'
    description = 'Collects qualified distributions, reports, documentation, and core-module SBOMs.'
    dependsOn tasks.named('releasePackaging')
    dependsOn releaseAgentDocs
    dependsOn releaseCoreSboms
    mustRunAfter tasks.named('releasecheck')
    into releaseAssetsDirectory

    releaseApplicationProjects.each { applicationProject ->
        from(applicationProject.layout.buildDirectory.dir('distributions')) {
            include '*.zip', '*.tar'
        }
    }
    from(releaseAgentDocs.flatMap { it.archiveFile })
    from(qualificationDirectory) {
        include 'qualification.json', 'functional-summary.json', 'functional-results.tsv'
    }
    releaseMavenProjects.each { publicationProject ->
        from(publicationProject.layout.buildDirectory.dir('reports/cyclonedx-direct')) {
            include 'bom.json'
            rename { "${publicationProject.name}-${sbkVersion}-sbom.cdx.json" }
        }
        from(publicationProject.layout.buildDirectory.dir('reports/cyclonedx-direct')) {
            include 'bom.xml'
            rename { "${publicationProject.name}-${sbkVersion}-sbom.cdx.xml" }
        }
    }
}

def generateReleaseManifest = tasks.register('generateReleaseManifest') {
    group = 'distribution'
    description = 'Generates the checksum and immutable metadata contract for an SBK release.'
    dependsOn collectReleaseAssets
    outputs.files(
            releaseAssetsDirectory.map { it.file('SHA256SUMS') },
            releaseAssetsDirectory.map { it.file('release-manifest.json') })
    outputs.upToDateWhen { false }

    doLast {
        def assetsDirectory = releaseAssetsDirectory.get().asFile
        def qualificationFile = new File(assetsDirectory, 'qualification.json')
        if (!qualificationFile.isFile()) {
            throw new GradleException('qualification.json is missing; run releasecheck before packaging a release')
        }
        def qualification = new JsonSlurper().parse(qualificationFile)
        if (qualification.status != 'QUALIFIED' || qualification.version != sbkVersion.toString()) {
            throw new GradleException('Release assets require a matching QUALIFIED qualification.json')
        }

        def requiredAssets = [
                "sbk-${sbkVersion}.zip",
                "sbk-${sbkVersion}.tar",
                "sbm-${sbkVersion}.zip",
                "sbm-${sbkVersion}.tar",
                "sbk-web-console-${sbkVersion}.zip",
                "sbk-web-console-${sbkVersion}.tar",
                'sbk-agent-docs.tar.gz',
                'qualification.json',
                'functional-summary.json',
                'functional-results.tsv'
        ] + releaseMavenProjects.collectMany { publicationProject ->
            ["${publicationProject.name}-${sbkVersion}-sbom.cdx.json",
             "${publicationProject.name}-${sbkVersion}-sbom.cdx.xml"]
        }
        def missingAssets = requiredAssets.findAll {
            def artifact = new File(assetsDirectory, it)
            !artifact.isFile() || artifact.length() == 0L
        }
        if (!missingAssets.isEmpty()) {
            throw new GradleException('Missing contracted release assets:\n' + missingAssets.join('\n'))
        }

        def payloadFiles = assetsDirectory.listFiles().findAll {
            it.isFile() && !(it.name in ['SHA256SUMS', 'release-manifest.json'])
        }.sort { left, right -> left.name <=> right.name }
        def artifacts = payloadFiles.collect { artifact ->
            [name: artifact.name, size: artifact.length(), sha256: sha256File(artifact)]
        }

        def configuredContainerDigest = findProperty('releaseContainerDigest')?.toString()?.trim()
        def manifest = [
                schemaVersion: 1,
                product: 'SBK',
                version: sbkVersion.toString(),
                tag: "v${sbkVersion}",
                commit: qualification.commit,
                qualificationProfile: qualification.profile,
                artifacts: artifacts,
                containers: [
                        status: configuredContainerDigest ? 'published' : 'dry-run',
                        images: releaseImageNames,
                        platforms: releasePlatforms,
                        digest: configuredContainerDigest ?: null
                ]
        ]
        def manifestFile = new File(assetsDirectory, 'release-manifest.json')
        manifestFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + System.lineSeparator()
        writeReleaseChecksums(assetsDirectory)
    }
}

tasks.register('finalizeReleaseManifest') {
    group = 'distribution'
    description = 'Binds an already-built release manifest to the published container digest.'
    outputs.upToDateWhen { false }
    doLast {
        def configuredContainerDigest = findProperty('releaseContainerDigest')?.toString()?.trim()
        if (configuredContainerDigest == null || !(configuredContainerDigest ==~ /sha256:[0-9a-f]{64}/)) {
            throw new GradleException(
                    'finalizeReleaseManifest requires -PreleaseContainerDigest=sha256:<64 hex characters>')
        }
        def assetsDirectoryProperty = findProperty('releaseAssetsDir')?.toString()?.trim()
        def assetsDirectory = assetsDirectoryProperty
                ? file(assetsDirectoryProperty) : releaseAssetsDirectory.get().asFile
        def manifestFile = new File(assetsDirectory, 'release-manifest.json')
        if (!manifestFile.isFile()) {
            throw new GradleException("Release manifest does not exist: ${manifestFile}")
        }
        def manifest = new JsonSlurper().parse(manifestFile)
        if (manifest.version != sbkVersion.toString() || manifest.tag != "v${sbkVersion}") {
            throw new GradleException('Release manifest version does not match the SBK build version')
        }
        manifest.containers.status = 'published'
        manifest.containers.digest = configuredContainerDigest
        manifestFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + System.lineSeparator()
        writeReleaseChecksums(assetsDirectory)
    }
}

def prepareReleaseContainer = tasks.register('prepareReleaseContainer', Sync) {
    group = 'distribution'
    description = 'Creates the minimal Docker build context from the installed SBK distribution.'
    dependsOn tasks.named('installDist')
    into releaseContainerDirectory
    from('Dockerfile') {
        filter { line -> line.replace('SBK_RUNTIME_IMAGE', runtimeContainerImage.toString()) }
    }
    from(layout.buildDirectory.dir('install/sbk')) {
        into 'sbk'
    }
}

def releasePublicationDryRun = tasks.register('releasePublicationDryRun') {
    group = 'verification'
    description = 'Runs qualification and prepares every release asset without publishing or creating a tag.'
    dependsOn tasks.named('releasecheck')
    dependsOn generateReleaseManifest
    dependsOn prepareReleaseContainer
    dependsOn verifyCorePublicationStaging
    doLast {
        logger.lifecycle('SBK release publication dry run: PASSED')
        logger.lifecycle("Assets: ${releaseAssetsDirectory.get().asFile}")
        logger.lifecycle('No Git tag, GitHub Release, Maven package, or container image was published.')
    }
}

tasks.register('publish') {
    group = 'publishing'
    description = 'Dispatches the guarded GitHub Actions workflow to publish an actual SBK release.'
    doLast {
        def requestedProfile = findProperty('profile')?.toString()?.trim()
        if (requestedProfile != 'release') {
            throw new GradleException('publish requires -Pprofile=release')
        }

        def expectedConfirmation = "RELEASE-${sbkVersion}"
        def suppliedConfirmation = findProperty('releaseConfirm')?.toString()?.trim()
        if (suppliedConfirmation != expectedConfirmation) {
            throw new GradleException(
                    "Actual publication requires -PreleaseConfirm=${expectedConfirmation}")
        }

        def githubToken = findProperty('github.token')?.toString()?.trim()
                ?: System.getenv('GITHUB_TOKEN')?.trim()
        if (githubToken == null) {
            throw new GradleException(
                    'GitHub Actions dispatch requires -Pgithub.token or GITHUB_TOKEN')
        }

        def prerelease = releaseBooleanProperty('releasePrerelease')
        def resume = releaseBooleanProperty('releaseResume')
        def repository = releaseGitHubRepository.toString().trim()
        def workflow = releaseWorkflowFile.toString().trim()
        def workflowRef = releaseWorkflowRef.toString().trim()
        def apiUrl = releaseGitHubApiUrl.toString().replaceAll('/+$', '')
        def requestPath = "${apiUrl}/repos/${repository}/actions/workflows/" +
                "${workflow}/dispatches"
        def requestUri = URI.create(requestPath)
        def requestPayload = JsonOutput.toJson([
                ref: workflowRef,
                inputs: [
                        version: sbkVersion.toString(),
                        profile: 'release',
                        dry_run: 'false',
                        prerelease: prerelease,
                        resume: resume
                ]
        ])
        def timeout = Duration.ofSeconds(releaseDispatchTimeoutSeconds.toString().toLong())
        def httpClient = HttpClient.newBuilder().connectTimeout(timeout).build()
        def request = HttpRequest.newBuilder(requestUri)
                .timeout(timeout)
                .header('Accept', 'application/vnd.github+json')
                .header('Authorization', "Bearer ${githubToken}")
                .header('X-GitHub-Api-Version', releaseGitHubApiVersion.toString())
                .POST(HttpRequest.BodyPublishers.ofString(requestPayload))
                .build()
        def response = httpClient.send(request, HttpResponse.BodyHandlers.ofString())
        if (response.statusCode() != 204) {
            throw new GradleException(
                    "GitHub release workflow dispatch failed with HTTP ${response.statusCode()}: "
                            + response.body())
        }

        logger.lifecycle("SBK ${sbkVersion} release workflow dispatched from ${workflowRef}.")
        def webUrl = releaseGitHubWebUrl.toString().replaceAll('/+$', '')
        logger.lifecycle("Monitor: ${webUrl}/${repository}/actions/workflows/${workflow}")
    }
}

gradle.projectsEvaluated {
    if (rootReleasePublishRequested) {
        releaseMavenProjects.each { publicationProject ->
            publicationProject.tasks.named('publish').configure {
                setDependsOn([])
                enabled = false
            }
        }
    }
    releaseMavenProjects.each { publicationProject ->
        publicationProject.tasks.named('publish').configure {
            mustRunAfter rootProject.tasks.named('releasecheck')
        }
    }
    tasks.named('jreleaserConfig').configure { mustRunAfter releaseStageCorePublications }
    tasks.named('jreleaserDeploy').configure { mustRunAfter releaseStageCorePublications }
}

gradle.taskGraph.whenReady { graph ->
    if (project.hasProperty('github')) {
        throw new GradleException(
                '-Pgithub has been removed; use the root publish task for a complete release')
    }
    if (graph.hasTask(releasePublishCoreToGitHubPackages.get())
            && System.getenv('SBK_RELEASE_WORKFLOW') != 'true') {
        throw new GradleException(
                'releasePublishCoreToGitHubPackages is restricted to the guarded release workflow')
    }
}
