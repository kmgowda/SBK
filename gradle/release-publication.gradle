def releaseBooleanProperty = { String propertyName ->
    def value = findProperty(propertyName)?.toString()?.trim()?.toLowerCase() ?: 'false'
    if (!(value in ['true', 'false'])) {
        throw new GradleException("${propertyName} must be true or false")
    }
    value
}

def runReleaseCommand = { List<String> command, Map<String, String> environment,
                          String standardInput = null ->
    def processBuilder = new ProcessBuilder(command.collect { it.toString() })
            .directory(rootDir)
            .redirectError(ProcessBuilder.Redirect.INHERIT)
            .redirectOutput(ProcessBuilder.Redirect.INHERIT)
    processBuilder.environment().putAll(environment)
    def process = processBuilder.start()
    if (standardInput == null) {
        process.outputStream.close()
    } else {
        process.outputStream.withWriter('UTF-8') { writer ->
            writer.write(standardInput)
            writer.write(System.lineSeparator())
        }
    }
    def exitCode = process.waitFor()
    if (exitCode != 0) {
        throw new GradleException(
                "Release command '${command.first()}' failed with exit code ${exitCode}")
    }
}

def readReleaseCommand = { List<String> command ->
    def process = new ProcessBuilder(command.collect { it.toString() })
            .directory(rootDir)
            .redirectErrorStream(true)
            .start()
    process.outputStream.close()
    def output = process.inputStream.getText('UTF-8').trim()
    def exitCode = process.waitFor()
    if (exitCode != 0) {
        throw new GradleException(
                "Release command '${command.first()}' failed with exit code ${exitCode}: ${output}")
    }
    output
}

def configuredJreleaserFile = findProperty('jreleaser.configFile')?.toString()?.trim()
def environmentJreleaserFile = System.getenv('JRELEASER_CONFIG_FILE')?.trim()
def defaultJreleaserFile = file(
        "${System.getProperty('user.home')}/.jreleaser/config.toml").absolutePath
def jreleaserConfigFile = configuredJreleaserFile
        ?: environmentJreleaserFile
        ?: defaultJreleaserFile

// JReleaser is the sole signing and Maven Central deployment authority. Keep
// all core staging repositories in one root configuration so newly extracted
// modules cannot be omitted by per-project configuration order.
jreleaser {
    environment {
        variables = jreleaserConfigFile
    }

    release {
        github {
            enabled = true
            skipRelease = true
            skipTag = true
            overwrite = false
        }
    }

    upload {
        active = 'ALWAYS'
        enabled = true
    }

    signing {
        active = 'ALWAYS'
        armored = true
    }

    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = 'ALWAYS'
                    stage = 'UPLOAD'
                    url = mavenCentralPublisherUrl
                    releaseMavenProjects.each { publicationProject ->
                        stagingRepository(publicationProject.layout.buildDirectory
                                .dir(releaseMavenStagingDirectory).get().toString())
                    }
                    setAuthorization('Basic')
                    sign = true
                    checksums = true
                    sourceJar = true
                    javadocJar = true
                    applyMavenCentralRules = true
                }
            }
        }
    }
}
def sha256File = { File artifact ->
    def digest = MessageDigest.getInstance('SHA-256')
    artifact.withInputStream { input ->
        byte[] buffer = new byte[8192]
        int count
        while ((count = input.read(buffer)) > 0) {
            digest.update(buffer, 0, count)
        }
    }
    digest.digest().encodeHex().toString()
}
def writeReleaseChecksums = { File assetsDirectory ->
    def checksumFiles = assetsDirectory.listFiles().findAll {
        it.isFile() && it.name != 'SHA256SUMS'
    }.sort { left, right -> left.name <=> right.name }
    def checksumLines = checksumFiles.collect { artifact ->
        "${sha256File(artifact)}  ${artifact.name}"
    }
    new File(assetsDirectory, 'SHA256SUMS').text =
            checksumLines.join(System.lineSeparator()) + System.lineSeparator()
}

