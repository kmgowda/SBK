import groovy.json.JsonOutput
import groovy.io.FileType
import java.security.MessageDigest
import org.gradle.api.tasks.testing.Test

def qualificationDefaults = new Properties()
file('gradle/release-qualification.properties').withInputStream {
    qualificationDefaults.load(it)
}

def qualificationValue = { String name ->
    def camelCaseName = 'release' + name.substring(0, 1).toUpperCase() + name.substring(1)
    def projectValue = (findProperty(camelCaseName) ?: findProperty("release.${name}"))
            ?.toString()?.trim()
    projectValue ?: qualificationDefaults.getProperty("qualification.${name}")
}

def obsoleteProfileProperty = ['releaseProfile', 'release.profile'].find {
    findProperty(it) != null
}
if (obsoleteProfileProperty) {
    throw new GradleException("Gradle property '${obsoleteProfileProperty}' was renamed to 'profile'; "
            + "use -Pprofile=<local|local-docker|ci|release>")
}

def qualificationProfile = findProperty('profile')?.toString()?.trim()
        ?: qualificationDefaults.getProperty('qualification.profile')
if (!(qualificationProfile in ['local', 'local-docker', 'ci', 'release'])) {
    throw new GradleException("Invalid release qualification profile '${qualificationProfile}'; "
            + "expected local, local-docker, ci, or release")
}

def qualificationReportDir = layout.buildDirectory.dir('reports/release-qualification')
def applicationProjects = [
        project,
        project(':sbm'),
        project(':sbk-web-console')
]
def applicationDistributionDirectories = applicationProjects.collect { applicationProject ->
    applicationProject.layout.buildDirectory.dir('distributions').get().asFile.absolutePath
}.asImmutable()

sourceSets {
    releaseFunctionalTest {
        java.srcDir 'src/releaseFunctionalTest/java'
        resources.srcDir 'src/releaseFunctionalTest/resources'
    }
}

dependencies {
    releaseFunctionalTestImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    releaseFunctionalTestRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    releaseFunctionalTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('releasePreflight') {
    group = 'verification'
    description = 'Validates the source tree and infrastructure required by the selected release profile.'
    inputs.file('gradle/release-qualification.properties')
    doLast {
        if (JavaVersion.current().majorVersion != rootProject.ext.sbkJavaMajorVersion.toString()) {
            throw new GradleException("Release qualification requires Java "
                    + rootProject.ext.sbkJavaMajorVersion)
        }

        if (qualificationValue('requireCleanTree').toBoolean()) {
            def includeUntrackedFiles = qualificationProfile in ['ci', 'release']
            def statusOutput = providers.exec {
                commandLine 'git', 'status', '--porcelain',
                        "--untracked-files=${includeUntrackedFiles ? 'all' : 'no'}"
                ignoreExitValue = true
            }
            def result = statusOutput.result.get()
            def output = statusOutput.standardOutput.asText.get()
            def error = statusOutput.standardError.asText.get()
            if (result.exitValue != 0 || !output.trim().isEmpty()) {
                def requirement = includeUntrackedFiles
                        ? 'a clean Git tree'
                        : 'no uncommitted tracked changes'
                throw new GradleException("Release qualification requires ${requirement}.\n"
                        + output + error)
            }
        }

        if (qualificationProfile == 'release') {
            def inventoryName = findProperty('releaseInventory')?.toString()?.trim()
            if (!inventoryName) {
                throw new GradleException('The release profile requires '
                        + '-PreleaseInventory=<private properties file>')
            }
            def inventory = file(inventoryName)
            if (!inventory.isFile()) {
                throw new GradleException("Release inventory does not exist: ${inventory}")
            }
            def values = new Properties()
            inventory.withInputStream { values.load(it) }
            ['gem.nodes', 'gem.user', 'gem.knownHosts'].each { key ->
                if (!values.getProperty(key)?.trim()) {
                    throw new GradleException("Release inventory is missing mandatory value '${key}'")
                }
            }
            def knownHosts = file(values.getProperty('gem.knownHosts').trim())
            if (!knownHosts.isFile()) {
                throw new GradleException("Release known-hosts file does not exist: ${knownHosts}")
            }
        }
        if (qualificationProfile == 'local-docker') {
            def pathDirectories = (System.getenv('PATH') ?: '').split(File.pathSeparator)
            def executableSuffixes = System.getProperty('os.name').toLowerCase().contains('windows')
                    ? ['', '.exe', '.cmd', '.bat'] : ['']
            ['docker', 'ssh-keygen'].each { command ->
                def executableFound = pathDirectories.any { directory ->
                    executableSuffixes.any { suffix ->
                        new File(directory, command + suffix).isFile()
                    }
                }
                if (!executableFound) {
                    throw new GradleException("The local-docker profile requires '${command}' on PATH")
                }
            }
            def dockerInfo = providers.exec {
                commandLine 'docker', 'info'
                ignoreExitValue = true
            }
            def dockerResult = dockerInfo.result.get()
            if (dockerResult.exitValue != 0) {
                throw new GradleException('The local-docker profile requires an accessible Docker daemon.\n'
                        + dockerInfo.standardError.asText.get())
            }
        }
        logger.lifecycle("SBK release qualification preflight: PASSED (${qualificationProfile} profile)")
    }
}

tasks.register('releaseBuild') {
    group = 'verification'
    description = 'Runs compilation, static analysis, unit tests, and all enabled driver checks.'
    dependsOn allprojects.findAll { it.path != ':drivers' }.collect {
        it.path == ':' ? ':check' : "${it.path}:check"
    }
}

tasks.register('releaseConcurrency') {
    group = 'verification'
    description = 'Runs PerL reclamation, Lincheck, and JCStress verification.'
    dependsOn ':perl:concurrencyCheck'
}

tasks.register('releasePerformance') {
    group = 'verification'
    description = 'Runs latency-sensitive PerL and gRPC JMH qualification gates.'
    if (qualificationProfile == 'release') {
        dependsOn ':perl:timeStampQueuePerformanceTest'
        dependsOn ':perl:latencyMapPerformanceTest'
        dependsOn ':perl:cqueuePerformanceTest'
        dependsOn ':perl:periodicRecorderPerformanceTest'
        dependsOn ':sbk-api:coreHotPathPerformanceTest'
        dependsOn ':sbk-api:grpcLoggerPerformanceTest'
    } else {
        doLast {
            logger.lifecycle("Performance qualification is reserved for the release profile")
        }
    }
}

tasks.register('releasePackaging') {
    group = 'verification'
    description = 'Builds the SBK suite plus standalone SBM and Web Console distributions.'
    dependsOn applicationProjects.collectMany { appProject ->
        ['installDist', 'distZip', 'distTar'].collect { taskName ->
            appProject.path == ':' ? ":${taskName}" : "${appProject.path}:${taskName}"
        }
    }
}

tasks.register('releaseFunctionalTest', Test) {
    group = 'verification'
    description = 'Runs black-box launcher, logger, YAL, SBM, Web Console, and profile-gated GEM tests.'
    dependsOn tasks.named('releasePackaging')
    testClassesDirs = sourceSets.releaseFunctionalTest.output.classesDirs
    classpath = sourceSets.releaseFunctionalTest.runtimeClasspath
    filter {
        includeTestsMatching 'io.sbk.release.ReleaseFunctionalTest'
        failOnNoMatchingTests = true
    }
    testLogging.showStandardStreams = true
    systemProperty 'sbk.release.root', rootDir.absolutePath
    systemProperty 'sbk.release.profile', qualificationProfile
    systemProperty 'sbk.release.version', sbkVersion.toString()
    ['records', 'recordSize', 'totalThroughputMBPerSec', 'processTimeoutSeconds',
     'startupTimeoutSeconds', 'webTimeoutMinutes', 'killGraceSeconds',
     'shutdownPollSeconds', 'eofRecords', 'eofBenchmarkSeconds', 'eofMaximumSeconds',
     'smokeBenchmarkSeconds', 'sbmSettleSeconds', 'dockerNodeCount',
     'dockerSshReadyAttempts', 'socketConnectTimeoutMillis', 'sshPort',
     'dockerSshUser', 'dockerJdkImage'].each { name ->
        systemProperty "sbk.release.${name}", qualificationValue(name)
    }
    systemProperty 'sbk.release.reportDir', qualificationReportDir.get().asFile.absolutePath
    def inventoryName = findProperty('releaseInventory')?.toString()?.trim()
    if (inventoryName) {
        systemProperty 'sbk.release.inventory', file(inventoryName).absolutePath
    }
    outputs.upToDateWhen { false }
}

def releaseDocumentationModules = [
        project(':perl'), project(':sbk-api'), project(':sbk-web-console'), project(':sbm'),
        project(':sbk-yal'), project(':sbk-gem'), project(':sbk-gem-yal')
].collect { appProject ->
    [path: appProject.path, directory: appProject.file('javadoc')].asImmutable()
}.asImmutable()
def releaseDocumentationVersion = sbkVersion.toString()
def releaseDocumentationLimit = qualificationValue('staleDocumentLimit').toInteger()
def releaseRepositoryDirectory = rootDir
def releaseRepositoryPath = releaseRepositoryDirectory.absolutePath
def releaseQualificationReportFile = layout.buildDirectory.file(
        'reports/release-qualification/qualification.json')
def releaseArtifactBufferBytes = qualificationValue('artifactBufferBytes').toInteger()
def releaseQualificationVersion = sbkVersion.toString()
def releaseCommit = providers.exec {
    workingDir releaseRepositoryDirectory
    commandLine 'git', 'rev-parse', 'HEAD'
}.standardOutput.asText.map { it.trim() }

def releaseDocsWhitespaceCheck = tasks.register('releaseDocsWhitespaceCheck', Exec) {
    group = 'verification'
    description = 'Rejects malformed repository whitespace outside generated Javadocs.'
    workingDir releaseRepositoryDirectory
    commandLine 'git', 'diff', '--check', '--', '.',
            ':(exclude)perl/javadoc/**',
            ':(exclude)sbk-api/javadoc/**',
            ':(exclude)sbk-web-console/javadoc/**',
            ':(exclude)sbm/javadoc/**',
            ':(exclude)sbk-yal/javadoc/**',
            ':(exclude)sbk-gem/javadoc/**',
            ':(exclude)sbk-gem-yal/javadoc/**'
}

tasks.register('releaseDocsCheck') {
    group = 'verification'
    description = 'Rejects stale generated API documentation and malformed repository whitespace.'
    dependsOn releaseDocsWhitespaceCheck
    dependsOn applicationProjects.findAll { it != project }.collect { appProject ->
        "${appProject.path}:javadoc"
    }
    dependsOn ':perl:javadoc'
    dependsOn ':sbk-api:javadoc'
    doLast {
        def stalePages = []
        releaseDocumentationModules.each { module ->
            def docs = module.directory
            if (!docs.isDirectory()) {
                stalePages << "${module.path}: missing tracked javadoc directory"
                return
            }
            docs.eachFileRecurse(FileType.FILES) { page ->
                if (!(page.name == 'index.html'
                        || page.name.endsWith('Logger.html')
                        || page.name.endsWith('Main.html'))) {
                    return
                }
                def text = page.getText('UTF-8')
                def matcher = text =~ /<title>[^<]+ ([0-9]+\.[0-9]+) API<\/title>/
                if (matcher.find() && matcher.group(1) != releaseDocumentationVersion) {
                    def relativePage = releaseRepositoryDirectory.toPath().relativize(page.toPath())
                    stalePages << "${relativePage}: ${matcher.group(1)}"
                }
            }
        }
        if (!stalePages.isEmpty()) {
            throw new GradleException('Stale generated Javadocs; run ./gradlew updateDocs:\n'
                    + stalePages.take(releaseDocumentationLimit).join('\n'))
        }
    }
}

tasks.register('releasePublicationTest') {
    group = 'verification'
    description = 'Generates Maven metadata and verifies publication artifacts without external credentials.'
    doLast {
        if (!(qualificationProfile in ['ci', 'release'])) {
            logger.lifecycle('Publication qualification is reserved for the ci and release profiles')
            return
        }

        def missingArtifacts = []
        allprojects.findAll {
            it.tasks.findByName('generatePomFileForMavenJavaPublication') != null
        }.each { publicationProject ->
            def artifactPrefix = "${publicationProject.name}-${publicationProject.version}"
            ["${artifactPrefix}.jar", "${artifactPrefix}-sources.jar",
             "${artifactPrefix}-javadoc.jar"].each { artifactName ->
                if (!publicationProject.layout.buildDirectory.file("libs/${artifactName}").get().asFile.isFile()) {
                    missingArtifacts << "${publicationProject.path}:build/libs/${artifactName}"
                }
            }
            if (!publicationProject.layout.buildDirectory
                    .file('publications/mavenJava/pom-default.xml').get().asFile.isFile()) {
                missingArtifacts << "${publicationProject.path}:build/publications/mavenJava/pom-default.xml"
            }
        }
        if (!missingArtifacts.isEmpty()) {
            throw new GradleException('Missing Maven publication artifacts:\n'
                    + missingArtifacts.join('\n'))
        }
    }
}

gradle.projectsEvaluated {
    if (qualificationProfile in ['ci', 'release']) {
        tasks.named('releasePublicationTest').configure {
            def publicationProjects = allprojects.findAll {
                it.tasks.findByName('generatePomFileForMavenJavaPublication') != null
            }
            dependsOn publicationProjects.collectMany { publicationProject ->
                ['jar', 'sourcesJar', 'javadocJar', 'generatePomFileForMavenJavaPublication']
                        .collect { publicationProject.tasks.named(it) }
            }
        }
    }
}

tasks.register('releasecheck') {
    group = 'verification'
    description = 'Runs the authoritative one-command SBK release qualification gate.'
    dependsOn tasks.named('releasePreflight')
    dependsOn tasks.named('releaseBuild')
    dependsOn tasks.named('releaseConcurrency')
    dependsOn tasks.named('releasePerformance')
    dependsOn tasks.named('releaseFunctionalTest')
    dependsOn tasks.named('releaseDocsCheck')
    dependsOn tasks.named('releasePublicationTest')
    inputs.files(applicationDistributionDirectories)
            .withPropertyName('applicationDistributions')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.property('releaseCommit', releaseCommit)
    outputs.file(releaseQualificationReportFile)
    // Qualification is authoritative for the current environment; always
    // regenerate its report after every dependency gate has completed.
    outputs.upToDateWhen { false }
    doLast {
        def reportFile = releaseQualificationReportFile.get().asFile
        def reportDirectory = reportFile.parentFile
        reportDirectory.mkdirs()
        def digest = MessageDigest.getInstance('SHA-256')
        def artifacts = []
        applicationDistributionDirectories.each { distributionDirectory ->
            def directory = new File(distributionDirectory)
            def distributionArtifacts = directory.listFiles()?.findAll { artifact ->
                artifact.isFile()
                        && (artifact.name.endsWith('.zip') || artifact.name.endsWith('.tar'))
            }?.sort { left, right -> left.name <=> right.name } ?: []
            distributionArtifacts.each { artifact ->
                digest.reset()
                artifact.withInputStream { stream ->
                    byte[] buffer = new byte[releaseArtifactBufferBytes]
                    int count
                    while ((count = stream.read(buffer)) > 0) {
                        digest.update(buffer, 0, count)
                    }
                }
                def relativeArtifact = new File(releaseRepositoryPath).toPath()
                        .relativize(artifact.toPath()).toString().replace(File.separatorChar, '/' as char)
                artifacts << [path: relativeArtifact,
                              sha256: digest.digest().encodeHex().toString()]
            }
        }
        def report = [
                status: 'QUALIFIED',
                version: releaseQualificationVersion,
                commit: releaseCommit.get(),
                profile: qualificationProfile,
                javaVersion: System.getProperty('java.runtime.version'),
                artifacts: artifacts
        ]
        reportFile.text =
                JsonOutput.prettyPrint(JsonOutput.toJson(report)) + System.lineSeparator()
        logger.lifecycle("SBK ${releaseQualificationVersion} release qualification: QUALIFIED")
        logger.lifecycle("Report: ${reportFile}")
    }
}

def releaseQualificationTaskNames = [
        'releasePreflight', 'releaseBuild', 'releaseConcurrency', 'releasePerformance',
        'releasePackaging', 'releaseFunctionalTest',
        'releasePublicationTest', 'releasecheck'
] as Set

// Release qualification intentionally inspects the live Git tree, private
// inventory, task graph, and generated publication state at execution time.
// Keep that authoritative behavior while allowing routine check/build tasks
// to use the configuration cache.
tasks.configureEach { task ->
    if (task.name in releaseQualificationTaskNames) {
        task.notCompatibleWithConfigurationCache(
                'Release qualification validates live repository and publication state')
    }
}

[
        'releaseBuild', 'releaseConcurrency', 'releasePerformance', 'releasePackaging',
        'releaseFunctionalTest', 'releaseDocsCheck', 'releasePublicationTest', 'releasecheck'
].each { taskName ->
    tasks.named(taskName).configure {
        mustRunAfter tasks.named('releasePreflight')
    }
}

tasks.named('releaseConcurrency').configure {
    mustRunAfter tasks.named('releaseBuild')
}
tasks.named('releasePerformance').configure {
    mustRunAfter tasks.named('releaseConcurrency')
}
tasks.named('releasePackaging').configure {
    mustRunAfter tasks.named('releaseBuild')
}
tasks.named('releaseFunctionalTest').configure {
    mustRunAfter tasks.named('releaseBuild')
    mustRunAfter tasks.named('releaseConcurrency')
    mustRunAfter tasks.named('releasePerformance')
}
