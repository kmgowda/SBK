# Safe defaults for the deterministic SBK release qualification harness.
# Application runtime defaults remain owned by their module properties files.
qualification.profile=release
qualification.requireCleanTree=true
qualification.records=10000
qualification.recordSize=4096
qualification.totalThroughputMBPerSec=100
qualification.processTimeoutSeconds=180
qualification.startupTimeoutSeconds=30
qualification.webTimeoutMinutes=1
qualification.killGraceSeconds=10
qualification.shutdownPollSeconds=1
qualification.eofRecords=1000
qualification.eofBenchmarkSeconds=120
qualification.eofMaximumSeconds=30
qualification.smokeBenchmarkSeconds=8
qualification.sbmSettleSeconds=2
qualification.dockerNodeCount=2
qualification.dockerSshReadyAttempts=60
qualification.artifactBufferBytes=8192
qualification.staleDocumentLimit=50
