// Standalone, opt-in Docker build preparation. These tasks are deliberately not
// dependencies of releasecheck, publish, or any release-publication task.
def containerOutputDirectory = layout.buildDirectory.dir('generated/sbk-containers')
def containerSourceDirectory = file('containers')
def containerDriversProperty = providers.gradleProperty('containerDrivers').orElse('minio')
def containerRepositoryProperty = providers.gradleProperty('containerRepository').orElse('sbk-local')
def containerRuntimeImageProperty = providers.gradleProperty('containerRuntimeImage')
        .orElse(runtimeContainerImage.toString())
def containerVersion = sbkVersion.toString()
def containerRevision = providers.exec {
    commandLine 'git', 'rev-parse', '--verify', 'HEAD'
}.standardOutput.asText.map { it.trim() }.orElse('unknown')
def containerInstallDirectory = layout.buildDirectory.dir('install/sbk')
def containerDriverRuntimeDirectory = layout.buildDirectory.dir('generated/sbk-driver-runtimes')
def containerEnabledDrivers = subprojects.findAll {
    it.parent != null && it.parent.name == 'drivers'
}.collect { it.name }.sort { it.toLowerCase(Locale.ROOT) }
def roleProjects = [
        'sbk-yal'    : project(':sbk-yal'),
        'sbm'        : project(':sbm'),
        'sbk-gem-yal': project(':sbk-gem-yal')
]
def rolePathingJars = roleProjects.collectEntries { role, roleProject ->
    [(role): roleProject.tasks.named('pathingJar', Jar).flatMap { it.archiveFile }]
}
def remoteAgentJar = project(':sbk-gem').tasks.named('remoteAgentJar', Jar).flatMap { it.archiveFile }
def sbmScriptsDirectory = project(':sbm').layout.buildDirectory.dir('scripts')

def selectedContainerDrivers = containerDriversProperty.map { configured ->
    def requested = configured.split(',').collect { it.trim() }.findAll { !it.isEmpty() }
    if (requested.isEmpty()) {
        throw new GradleException('containerDrivers must select at least one enabled driver or all')
    }
    if (requested == ['all']) {
        return containerEnabledDrivers
    }
    def canonical = requested.collect { requestedName ->
        containerEnabledDrivers.find { it.equalsIgnoreCase(requestedName) }
    }
    def unknown = requested.findAll { requestedName ->
        !containerEnabledDrivers.any { it.equalsIgnoreCase(requestedName) }
    }
    if (!unknown.isEmpty()) {
        throw new GradleException("Unknown container driver(s): ${unknown.join(', ')}. Enabled drivers: "
                + containerEnabledDrivers.join(', '))
    }
    canonical.unique().sort { it.toLowerCase(Locale.ROOT) }
}

def createPathingJar = { File output, Collection<String> classpath ->
    output.parentFile.mkdirs()
    def manifest = new java.util.jar.Manifest()
    manifest.mainAttributes.put(java.util.jar.Attributes.Name.MANIFEST_VERSION, '1.0')
    manifest.mainAttributes.put(java.util.jar.Attributes.Name.CLASS_PATH,
            classpath.toSet().toList().sort().join(' '))
    output.withOutputStream { stream ->
        new java.util.jar.JarOutputStream(stream).withCloseable { jar ->
            def manifestDirectory = new java.util.jar.JarEntry('META-INF/')
            manifestDirectory.setTime(0L)
            jar.putNextEntry(manifestDirectory)
            jar.closeEntry()
            def manifestEntry = new java.util.jar.JarEntry('META-INF/MANIFEST.MF')
            manifestEntry.setTime(0L)
            jar.putNextEntry(manifestEntry)
            manifest.write(jar)
            jar.closeEntry()
        }
    }
}
def readPathingClasspath = { File pathingJar ->
    new java.util.jar.JarFile(pathingJar).withCloseable { jar ->
        def value = jar.manifest?.mainAttributes?.getValue(java.util.jar.Attributes.Name.CLASS_PATH)
        if (value == null || value.isBlank()) {
            throw new GradleException("Pathing JAR has no Class-Path manifest: ${pathingJar}")
        }
        value.trim().split(/\s+/).toList()
    }
}
def copyNamedFiles = { File sourceDirectory, Collection<String> names, File destinationDirectory ->
    destinationDirectory.mkdirs()
    names.each { name ->
        def source = new File(sourceDirectory, name)
        if (!source.isFile()) {
            throw new GradleException("Container runtime dependency is missing: ${source}")
        }
        java.nio.file.Files.copy(source.toPath(), new File(destinationDirectory, name).toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}
def writeText = { File output, String value ->
    output.parentFile.mkdirs()
    output.setText(value, 'UTF-8')
}

def prepareContainerBuild = tasks.register('prepareContainerBuild') {
    group = 'distribution'
    description = 'Prepares driver-scoped SBK Docker contexts and a Buildx Bake plan without building images.'
    dependsOn tasks.named('installDist'), tasks.named('verifySbkDriverRuntimes'),
            roleProjects.values().collect { it.tasks.named('pathingJar') }, remoteAgentJar
    inputs.property('containerDrivers', selectedContainerDrivers)
    inputs.property('containerRepository', containerRepositoryProperty)
    inputs.property('containerRuntimeImage', containerRuntimeImageProperty)
    inputs.property('containerVersion', containerVersion)
    inputs.property('containerRevision', containerRevision)
    inputs.files(containerSourceDirectory)
            .withPropertyName('containerSources')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(rolePathingJars.values())
            .withPropertyName('rolePathingJars')
            .withPathSensitivity(PathSensitivity.NAME_ONLY)
    inputs.file(remoteAgentJar)
            .withPropertyName('remoteAgentJar')
            .withPathSensitivity(PathSensitivity.NAME_ONLY)
    inputs.dir(containerDriverRuntimeDirectory)
            .withPropertyName('driverRuntimes')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.dir(containerOutputDirectory)
    outputs.cacheIf('Container contexts are reproducible from installed driver and role runtimes') { true }

    doLast {
        def output = containerOutputDirectory.get().asFile
        def install = containerInstallDirectory.get().asFile
        def installLib = new File(install, 'lib')
        def driverRuntime = containerDriverRuntimeDirectory.get().asFile
        def selectedDrivers = selectedContainerDrivers.get()
        output.deleteDir()
        output.mkdirs()

        ['Dockerfile', 'container-entrypoint.sh'].each { name ->
            java.nio.file.Files.copy(new File(containerSourceDirectory, name).toPath(),
                    new File(output, name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }

        def allDriverFiles = containerEnabledDrivers.collect { driver ->
            def properties = new Properties()
            new File(driverRuntime, "${driver}.properties").withInputStream { properties.load(it) }
            properties.getProperty('runtime.files').split(',').toList()
        }
        def commonFiles = allDriverFiles.tail().inject(new LinkedHashSet(allDriverFiles.head())) { common, files ->
            common.retainAll(files)
            common
        }.toList().sort()
        copyNamedFiles(installLib, commonFiles, new File(output, 'common/lib'))
        copyNamedFiles(new File(install, 'bin'),
                ['jmx-config.yml', 'sbk-java-bootstrap.properties', 'sbk-java-bootstrap.sh'],
                new File(output, 'common/bin'))

        def roleClasspaths = rolePathingJars.collectEntries { role, provider ->
            [(role): readPathingClasspath(provider.get().asFile)]
        }
        def roleLaunchers = ['sbk', 'sbk-yal', 'sbk-gem-yal']
        roleLaunchers.each { role ->
            copyNamedFiles(new File(install, 'bin'), [role], new File(output, "roles/${role}/bin"))
        }
        copyNamedFiles(sbmScriptsDirectory.get().asFile, ['sbm'], new File(output, 'roles/sbm/bin'))
        roleClasspaths.each { role, files ->
            copyNamedFiles(installLib, files.findAll { !commonFiles.contains(it) },
                    new File(output, "roles/${role}/lib"))
        }
        // GEM launches a small Java agent before the selected remote SBK runtime.
        copyNamedFiles(installLib, [remoteAgentJar.get().asFile.name],
                new File(output, 'roles/sbk-gem-yal/lib'))

        new File(output, 'drivers/none').mkdirs()
        new File(output, 'launchers/sbm/none/lib').mkdirs()
        createPathingJar(new File(output, "launchers/sbm/none/lib/sbm-pathing-${containerVersion}.jar"),
                roleClasspaths.sbm)

        def targets = []
        selectedDrivers.each { driver ->
            def driverSlug = driver.toLowerCase(Locale.ROOT)
            def propertiesFile = new File(driverRuntime, "${driver}.properties")
            def properties = new Properties()
            propertiesFile.withInputStream { properties.load(it) }
            def driverFiles = properties.getProperty('runtime.files').split(',').toList()
            copyNamedFiles(installLib, driverFiles.findAll { !commonFiles.contains(it) },
                    new File(output, "drivers/${driverSlug}/lib"))
            copyNamedFiles(driverRuntime,
                    [propertiesFile.name, properties.getProperty('runtime.pathing'), 'java-runtime.properties'],
                    new File(output, "drivers/${driverSlug}/worker-runtime"))

            ['sbk', 'sbk-yal', 'sbk-gem-yal'].each { role ->
                def classpath = role == 'sbk'
                        ? driverFiles
                        : (driverFiles + roleClasspaths.get(role)).toSet().toList()
                // The root distribution's sbk, sbk-yal, and sbk-gem-yal launchers
                // intentionally share the root sbk-pathing filename.
                def pathingName = "sbk-pathing-${containerVersion}.jar"
                createPathingJar(new File(output,
                        "launchers/${role}/${driverSlug}/lib/${pathingName}"), classpath)
                targets << [name: "${role}-${driverSlug}", role: role, driver: driverSlug,
                            tag: "${containerRepositoryProperty.get()}/${role}:${containerVersion}-${driverSlug}"]
            }
        }
        targets << [name: 'sbm', role: 'sbm', driver: 'none',
                    tag: "${containerRepositoryProperty.get()}/sbm:${containerVersion}"]

        def bake = new StringBuilder('group "selected" {\n  targets = [')
        bake.append(targets.collect { "\"${it.name}\"" }.join(', ')).append(']\n}\n\n')
        targets.each { target ->
            bake.append("target \"${target.name}\" {\n")
                    .append("  context = \"build/generated/sbk-containers\"\n")
                    .append("  dockerfile = \"Dockerfile\"\n")
                    .append("  args = {\n")
                    .append("    SBK_ROLE = \"${target.role}\"\n")
                    .append("    SBK_DRIVER = \"${target.driver}\"\n")
                    .append("    SBK_VERSION = \"${containerVersion}\"\n")
                    .append("    SBK_REVISION = \"${containerRevision.get()}\"\n")
                    .append("    SBK_RUNTIME_IMAGE = \"${containerRuntimeImageProperty.get()}\"\n")
                    .append("  }\n  tags = [\"${target.tag}\"]\n}\n\n")
        }
        writeText(new File(output, 'docker-bake.hcl'), bake.toString())
        writeText(new File(output, 'container-plan.properties'),
                "format.version=1\nsbk.version=${containerVersion}\nrevision=${containerRevision.get()}\n"
                        + "drivers=${selectedDrivers.join(',')}\ntargets=${targets.collect { it.name }.join(',')}\n"
                        + "release.integration=false\n")
    }
}

tasks.register('verifyContainerBuild') {
    group = 'verification'
    description = 'Verifies prepared driver-scoped Docker contexts without creating an image.'
    dependsOn prepareContainerBuild
    inputs.dir(containerOutputDirectory)
    def marker = layout.buildDirectory.file('verification/sbk-containers.verified')
    outputs.file(marker)
    outputs.cacheIf('Container context verification is reproducible') { true }

    doLast {
        def output = containerOutputDirectory.get().asFile
        def plan = new Properties()
        new File(output, 'container-plan.properties').withInputStream { plan.load(it) }
        if (plan.getProperty('release.integration') != 'false') {
            throw new GradleException('Driver container builds must remain outside release publication')
        }
        def targets = plan.getProperty('targets').split(',').toList()
        targets.each { target ->
            def separator = target.lastIndexOf('-')
            def role = target == 'sbm' ? 'sbm' : target.substring(0, separator)
            def driver = target == 'sbm' ? 'none' : target.substring(separator + 1)
            def launcher = new File(output, "roles/${role}/bin/${role}")
            if (!launcher.isFile()) {
                throw new GradleException("Missing container launcher ${launcher}")
            }
            def pathingName = role == 'sbm' ? "sbm-pathing-${containerVersion}.jar"
                    : "sbk-pathing-${containerVersion}.jar"
            def pathing = new File(output, "launchers/${role}/${driver}/lib/${pathingName}")
            def classpath = readPathingClasspath(pathing)
            classpath.each { fileName ->
                def candidates = [new File(output, "common/lib/${fileName}"),
                                  new File(output, "roles/${role}/lib/${fileName}"),
                                  new File(output, "drivers/${driver}/lib/${fileName}")]
                if (!candidates.any { it.isFile() }) {
                    throw new GradleException("${target} pathing dependency is absent: ${fileName}")
                }
            }
        }
        def verificationMarker = marker.get().asFile
        verificationMarker.parentFile.mkdirs()
        verificationMarker.setText("verified ${targets.size()} container target(s)\n", 'UTF-8')
    }
}
