# Versioned build contract for the Java runtime used by compact remote deployments.
# Keep this list conservative because SBK drivers and vendor libraries use reflection,
# ServiceLoader providers, JMX, TLS, JNI, and other dependencies that jdeps cannot
# discover reliably from bytecode alone.
format.version=1
java.modules=java.base,java.desktop,java.instrument,java.management.rmi,java.naming,java.net.http,java.scripting,java.security.jgss,java.security.sasl,java.sql,jdk.charsets,jdk.crypto.ec,jdk.httpserver,jdk.localedata,jdk.management,jdk.naming.dns,jdk.sctp,jdk.security.auth,jdk.security.jgss,jdk.unsupported,jdk.zipfs
# Do not use --bind-services here. It expands the image with development tools such
# as javac, javadoc, and jlink. Required runtime providers are named explicitly above.
jlink.options=--strip-debug,--no-header-files,--no-man-pages,--compress=zip-6
