plugins.withId('maven-publish') {
    def localRepoDir = "sbk-repo"
    def buildRepoDir = "build" + File.separator + localRepoDir
    group = sbkGroup
    setVersion(sbkVersion)

    java {
        withJavadocJar()
        withSourcesJar()
    }

    // Create a documentation JAR containing agent documentation
    tasks.register('docsJar', Jar) {
        archiveBaseName = project.name
        archiveClassifier = 'docs'
        from(rootProject.file('AGENTS.md')) {
            into 'docs'
        }
        from(rootProject.file('INSTRUCTIONS.md')) {
            into 'docs'
        }
        from(rootProject.file('README.md')) {
            into 'docs'
            rename { 'PROJECT_README.md' }
        }
        from(rootProject.file('docs')) {
            include 'README.md'
            include 'AGENT_RECIPES.md'
            include 'DRIVER_SPECIFICATION.md'
            include 'AGENT_TOOLKIT.md'
            include 'AGENT_DOCUMENTATION_DISTRIBUTION.md'
            include 'sbk-internals.md'
            include 'ARCHITECTURE.md'
            include 'REPOSITORY_MAP.md'
            include 'DRIVER_GUIDE.md'
            include 'DOCUMENTATION_GUIDE.md'
            include 'RELEASE_QUALIFICATION.md'
            include 'RELEASE_PUBLICATION.md'
            include 'PROMETHEUS_LOGGER.md'
            include 'WEB_LOGGER.md'
            into 'docs'
        }
        from(rootProject.file('.devin/skills')) {
            into 'devin-skills'
        }
        from(rootProject.file('.cursorrules')) {
            into 'agent-configs'
        }
        from(rootProject.file('.aider.conf.yml')) {
            into 'agent-configs'
        }
        from(rootProject.file('.cursor/rules')) {
            include '*.mdc'
            into 'agent-configs/cursor/rules'
        }
    }

    /*
      ./gradlew publish stages artifacts locally for JReleaser.
      ./gradlew publish -Pgithub publishes the same consumable coordinates to GitHub Packages.
      Sonatype Central publication is performed by JReleaser, not by a Gradle Maven repository.
     */
    publishing {
        repositories {
            if (project.hasProperty("github")) {
                maven {
                    name = "SBK-GitHub"
                    url = uri(githubPackagesRepositoryUrl)
                    credentials {
                        username = project.findProperty("github.username")
                                ?: System.getenv("GITHUB_USER")
                                ?: System.getenv("GITHUB_USERNAME")
                        password = project.findProperty("github.token") ?: System.getenv("GITHUB_TOKEN")
                    }
                }
            } else {
                maven {
                    name = "SBK-Local-Staging"
                    url = layout.buildDirectory.dir(localRepoDir)
                }
            }
        }

        publications {
            mavenJava(MavenPublication) {
                from(components.java)
                artifact(tasks.docsJar)

                pom {
                    groupId = group
                    name = publicationName
                    url = publicationProjectUrl
                    description = publicationDescription
                    scm {
                        url = publicationScmUrl
                        connection = publicationScmConnection
                        developerConnection = publicationScmDeveloperConnection
                    }
                    licenses {
                        license {
                            name = publicationLicenseName
                            url = publicationLicenseUrl
                        }
                    }
                    developers {
                        developer {
                            id = publicationDeveloperId
                            name = publicationDeveloperName
                            email = publicationDeveloperEmail
                        }
                    }
                }
            }
        }

        if (!project.property("signing.keyId")) {
            project.setProperty("signing.keyId", System.getenv("SIGNING_KEYID"))
        }

        if (!project.property("signing.password")) {
            project.setProperty("signing.password", System.getenv("SIGNING_PASSWORD"))
        }

        if (!project.property("signing.secretKeyRingFile")) {
            def secretKeyPath = project.file("${System.getProperty("user.home")}/.gnupg/secring.gpg").absolutePath
            project.setProperty("signing.secretKeyRingFile", secretKeyPath)
        }

        def signingKeyRing = project.file(project.property("signing.secretKeyRingFile"))
        if (project.property("signing.keyId") && project.property("signing.password")
                && signingKeyRing.isFile()) {
            signing {
                sign publications.mavenJava
            }
        }
    }



    def configuredJreleaserFile = project.findProperty('jreleaser.configFile')?.toString()?.trim()
    def environmentJreleaserFile = System.getenv('JRELEASER_CONFIG_FILE')?.trim()
    def defaultJreleaserFile = project.file(
            "${System.getProperty('user.home')}/.jreleaser/config.toml").absolutePath
    def jreleaserConfigFile = configuredJreleaserFile
            ?: environmentJreleaserFile
            ?: defaultJreleaserFile
    jreleaser {
        environment {
            // Each key must be prefixed with JRELEASER_ and match
            // the environment variable it overrides.
            variables = jreleaserConfigFile
        }

        release {
            github {
                // GitHub Actions owns the immutable tag, release assets, and container release.
                // JReleaser remains responsible only for Maven Central staging/deployment.
                enabled = true
                skipRelease = true
                skipTag = true
                overwrite = false
            }
        }

        upload {
            active = 'ALWAYS'
            enabled = true
        }

        signing {
            active = 'ALWAYS'
            armored = true
        }

        deploy {
            maven {
                mavenCentral {
                    sonatype {
                        active = 'ALWAYS'
                        stage = "UPLOAD"     // only upload, no release
                        url = mavenCentralPublisherUrl
                        stagingRepository(layout.buildDirectory.dir(localRepoDir).get().toString())
                        setAuthorization("Basic")
                        sign = true
                        checksums = true
                        sourceJar = true
                        javadocJar = true
                        applyMavenCentralRules = true
                    }
                }
            }
        }
    }

}


/*
Publish SBK packages through Sonatype Central with JReleaser:

1) Verify configuration: ./gradlew jreleaserConfig
2) Stage every Maven publication locally: ./gradlew clean publish
3) Upload for portal inspection: ./gradlew jreleaserDeploy
4) Or explicitly upload and publish in one guarded release operation:
   JRELEASER_MAVENCENTRAL_STAGE=FULL ./gradlew jreleaserDeploy

The source default is UPLOAD. GitHub Packages use the independent
./gradlew publish -Pgithub path with the same Maven coordinates.
*/
