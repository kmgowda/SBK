plugins.withId('maven-publish') {
    def localRepoDir = mavenStagingRepositoryDirectory.toString()
    def requestedTaskNames = gradle.startParameter.taskNames
    def githubPackagesRequested = requestedTaskNames.any {
        it.tokenize(':').last() == 'releasePublishCoreToGitHubPackages'
    }
    group = sbkGroup
    setVersion(sbkVersion)

    java {
        withJavadocJar()
        withSourcesJar()
    }

    // Create a documentation JAR containing agent documentation
    tasks.register('docsJar', Jar) {
        archiveBaseName = project.name
        archiveClassifier = 'docs'
        from(rootProject.file('AGENTS.md')) {
            into 'docs'
        }
        from(rootProject.file('INSTRUCTIONS.md')) {
            into 'docs'
        }
        from(rootProject.file('README.md')) {
            into 'docs'
            rename { 'PROJECT_README.md' }
        }
        from(rootProject.file('docs')) {
            include 'README.md'
            include 'AGENT_RECIPES.md'
            include 'DRIVER_SPECIFICATION.md'
            include 'AGENT_TOOLKIT.md'
            include 'AGENT_DOCUMENTATION_DISTRIBUTION.md'
            include 'sbk-internals.md'
            include 'ARCHITECTURE.md'
            include 'REPOSITORY_MAP.md'
            include 'DRIVER_GUIDE.md'
            include 'DOCUMENTATION_GUIDE.md'
            include 'RELEASE_QUALIFICATION.md'
            include 'RELEASE_PUBLICATION.md'
            include 'PROMETHEUS_LOGGER.md'
            include 'WEB_LOGGER.md'
            include 'ECS_OBS_BENCHMARK_RUNBOOK.md'
            include 'ECS_OBS_AGENT_RUNBOOK.md'
            include 'MINIO_DRIVER_IMPLEMENTATION.md'
            into 'docs'
        }
        from(rootProject.file('drivers/minio')) {
            include 'README.md'
            into 'drivers/minio'
        }
        from(rootProject.file('.devin/skills')) {
            into 'devin-skills'
        }
        from(rootProject.file('.cursorrules')) {
            into 'agent-configs'
        }
        from(rootProject.file('.aider.conf.yml')) {
            into 'agent-configs'
        }
        from(rootProject.file('.cursor/rules')) {
            include '*.mdc'
            into 'agent-configs/cursor/rules'
        }
    }

    // Core artifacts stage locally for JReleaser unless the guarded workflow
    // invokes the internal GitHub Packages publication task.
    publishing {
        repositories {
            if (githubPackagesRequested) {
                maven {
                    name = "SBK-GitHub"
                    url = uri(githubPackagesRepositoryUrl)
                    credentials {
                        username = project.findProperty("github.username")
                                ?: System.getenv("GITHUB_USER")
                                ?: System.getenv("GITHUB_USERNAME")
                        password = project.findProperty("github.token") ?: System.getenv("GITHUB_TOKEN")
                    }
                }
            } else {
                maven {
                    name = "SBK-Local-Staging"
                    url = layout.buildDirectory.dir(localRepoDir)
                }
            }
        }

        publications {
            mavenJava(MavenPublication) {
                from(components.java)
                artifact(tasks.docsJar)

                pom {
                    groupId = group
                    name = publicationName
                    url = publicationProjectUrl
                    description = publicationDescription
                    scm {
                        url = publicationScmUrl
                        connection = publicationScmConnection
                        developerConnection = publicationScmDeveloperConnection
                    }
                    licenses {
                        license {
                            name = publicationLicenseName
                            url = publicationLicenseUrl
                        }
                    }
                    developers {
                        developer {
                            id = publicationDeveloperId
                            name = publicationDeveloperName
                            email = publicationDeveloperEmail
                        }
                    }
                }
            }
        }

    }
}


/*
Publish SBK packages through Sonatype Central with JReleaser:

1) Verify configuration: ./gradlew jreleaserConfig
2) Stage every Maven publication locally: ./gradlew verifyCorePublicationStaging
3) Upload for portal inspection: ./gradlew jreleaserDeploy
4) Or explicitly upload and publish in one guarded release operation:
   JRELEASER_MAVENCENTRAL_STAGE=FULL ./gradlew jreleaserDeploy

The source default is UPLOAD. The guarded release workflow publishes the same
core coordinates to GitHub Packages through releasePublishCoreToGitHubPackages.
*/
