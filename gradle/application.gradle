plugins.withId('application') {
    afterEvaluate {
        configurations.archives.artifacts.removeAll {
            it.hasProperty('archiveTask') && (it.archiveTask == distZip || it.archiveTask == distTar)
        }
        application.applicationDefaultJvmArgs =
                ((application.applicationDefaultJvmArgs ?: []) + rootProject.ext.sbkRuntimeJvmArgs).unique()
    }

    tasks.register('pathingJar', Jar) {
        archiveAppendix = 'pathing'

        // The manifest is the runtime dependency graph. Declaring the classpath
        // as an input prevents Gradle from reusing a stale pathing JAR after a
        // dependency is added, removed, or changed.
        inputs.files(configurations.runtimeClasspath)
                .withPropertyName('runtimeClasspath')
                .withPathSensitivity(PathSensitivity.NAME_ONLY)

        // Delay configuring the manifest to avoid resolving the configuration
        doFirst {
            manifest {
                attributes("Class-Path":
                        configurations.runtimeClasspath.collect { it.name }.join(' ') + " " + jar.archiveFileName.get()
                )
            }
        }
    }

    // Configure every standard and custom start script to use the same JVM options.
    // Repository-owned templates supply the shared SBK Java bootstrap contract.
    tasks.withType(CreateStartScripts).configureEach {
        doFirst {
            defaultJvmOpts = ((defaultJvmOpts ?: []) + rootProject.ext.sbkRuntimeJvmArgs).unique()
        }
    }

    def verifySbkJavaHomeStartScripts = tasks.register('verifySbkJavaHomeStartScripts') {
        dependsOn tasks.withType(CreateStartScripts)
        doLast {
            tasks.withType(CreateStartScripts).each { scriptTask ->
                def pathingJarName = tasks.named('pathingJar').get().archiveFileName.get()
                def jarName = tasks.named('jar').get().archiveFileName.get()
                def expectedUnixClasspath =
                        "CLASSPATH=\$APP_HOME/lib/${pathingJarName}:\$APP_HOME/lib/${jarName}"
                def expectedWindowsClasspath =
                        "set CLASSPATH=%APP_HOME%\\lib\\${pathingJarName};%APP_HOME%\\lib\\${jarName}"
                if (!scriptTask.unixScript.text.contains('sbk-java-bootstrap.sh')) {
                    throw new GradleException("${scriptTask.path} Unix launcher does not use the SBK JDK resolver")
                }
                if (!scriptTask.windowsScript.text.contains('sbk-java-bootstrap.bat')) {
                    throw new GradleException("${scriptTask.path} Windows launcher does not use the SBK JDK resolver")
                }
                if (!scriptTask.unixScript.text.contains(
                        'SBK_JAVA_INSTALL=${SBK_JAVA_INSTALL:-false}')) {
                    throw new GradleException(
                            "${scriptTask.path} Unix launcher does not preserve the SBK_JAVA_INSTALL opt-in")
                }
                if (!scriptTask.windowsScript.text.contains(
                        'if not defined SBK_JAVA_INSTALL set "SBK_JAVA_INSTALL=false"')) {
                    throw new GradleException(
                            "${scriptTask.path} Windows launcher does not default SBK_JAVA_INSTALL safely")
                }
                if (!scriptTask.windowsScript.text.contains(
                        'sbk-java-bootstrap.bat" "%SBK_JAVA_INSTALL%"')) {
                    throw new GradleException(
                            "${scriptTask.path} Windows launcher does not forward the SBK_JAVA_INSTALL opt-in")
                }
                if (!scriptTask.unixScript.text.contains('"-Dsbk.appHome=$APP_HOME"')) {
                    throw new GradleException(
                            "${scriptTask.path} Unix launcher does not set the SBK application home")
                }
                if (!scriptTask.windowsScript.text.contains('"-Dsbk.appHome=%APP_HOME%"')) {
                    throw new GradleException(
                            "${scriptTask.path} Windows launcher does not set the SBK application home")
                }
                if (scriptTask.unixScript.text.contains('@SBK_UNIX_JMX_ARGUMENTS@')
                        || scriptTask.windowsScript.text.contains('@SBK_WINDOWS_JMX_ARGUMENTS@')) {
                    throw new GradleException(
                            "${scriptTask.path} launcher contains an unresolved SBK template token")
                }
                if (!scriptTask.unixScript.text.contains(expectedUnixClasspath)) {
                    throw new GradleException(
                            "${scriptTask.path} Unix launcher does not use only the pathing and application JARs")
                }
                if (!scriptTask.windowsScript.text.contains(expectedWindowsClasspath)) {
                    throw new GradleException(
                            "${scriptTask.path} Windows launcher does not use only the pathing and application JARs")
                }
                if (scriptTask.unixScript.text.contains('# Determine the Java command to use to start the JVM.')
                        || scriptTask.windowsScript.text.contains('@rem Find java.exe')) {
                    throw new GradleException(
                            "${scriptTask.path} launcher still contains Gradle's default Java resolver")
                }
                def expectedJmxOption = '-Dsbk.jmxExport=' + jmxExport.toString().toBoolean()
                if (!scriptTask.unixScript.text.contains(expectedJmxOption)
                        || !scriptTask.windowsScript.text.contains(expectedJmxOption)) {
                    throw new GradleException(
                            "${scriptTask.path} launcher does not contain the configured JMX export mode")
                }
                if (jmxExport.toString().toBoolean()
                        && (!scriptTask.unixScript.text.contains('-javaagent:')
                        || !scriptTask.windowsScript.text.contains('-javaagent:'))) {
                    throw new GradleException(
                            "${scriptTask.path} launcher is missing the configured JMX Java agent")
                }
                rootProject.ext.sbkRuntimeJvmArgs.each { option ->
                    if (!scriptTask.unixScript.text.contains(option)) {
                        throw new GradleException(
                                "${scriptTask.path} Unix launcher is missing runtime JVM option ${option}")
                    }
                    if (!scriptTask.windowsScript.text.contains(option)) {
                        throw new GradleException(
                                "${scriptTask.path} Windows launcher is missing runtime JVM option ${option}")
                    }
                }
            }
        }
    }

    tasks.named('check').configure {
        dependsOn verifySbkJavaHomeStartScripts
    }
    tasks.matching { it.name in ['installDist', 'distZip', 'distTar'] }.configureEach {
        dependsOn verifySbkJavaHomeStartScripts
    }

    application {
        applicationDistribution.from(pathingJar) {
            into "lib"
        }
        applicationDistribution.from(rootProject.files(
                rootProject.file('gradle/sbk-java-bootstrap.sh'),
                rootProject.file('gradle/sbk-java-bootstrap.bat'),
                rootProject.file('gradle/sbk-java-bootstrap.ps1'),
                rootProject.file('gradle/sbk-java-bootstrap.properties'))) {
            into "bin"
        }
    }


}
