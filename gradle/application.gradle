plugins.withId('application') {
    afterEvaluate {
        configurations.archives.artifacts.removeAll {
            it.hasProperty('archiveTask') && (it.archiveTask == distZip || it.archiveTask == distTar)
        }
        application.applicationDefaultJvmArgs =
                ((application.applicationDefaultJvmArgs ?: []) + rootProject.ext.sbkRuntimeJvmArgs).unique()
    }

    tasks.register('pathingJar', Jar) {
        archiveAppendix = 'pathing'

        // Delay configuring the manifest to avoid resolving the configuration
        doFirst {
            manifest {
                attributes("Class-Path":
                        configurations.runtimeClasspath.collect { it.name }.join(' ') + " " + jar.archiveFileName.get()
                )
            }
        }
    }

    // Configure every standard and custom start script to use the same JVM
    // options and SBK_JAVA_HOME -> JAVA_HOME -> PATH selection order.
    tasks.withType(CreateStartScripts).configureEach {
        doFirst {
            defaultJvmOpts = ((defaultJvmOpts ?: []) + rootProject.ext.sbkRuntimeJvmArgs).unique()
        }
        doLast {
            // For Unix scripts - inject SBK_JAVA_HOME runtime check with fallback
            def unixJavaDetectionLogic = '''# Resolve the same JDK used by the SBK build.
# Application launchers reuse a configured, system, or previously managed JDK;
# only gradlew performs a first-run download.
SBK_JAVA_INSTALL=false
export SBK_JAVA_INSTALL
SBK_JAVA_CONFIG_FILE=$APP_HOME/bin/sbk-java-bootstrap.properties
export SBK_JAVA_CONFIG_FILE
. "$APP_HOME/bin/sbk-java-bootstrap.sh" || die "Unable to resolve JDK 25. Run gradlew once or set SBK_JAVA_HOME."
unset SBK_JAVA_INSTALL'''
            
            def startMarker = '# Determine the Java command to use to start the JVM.'
            def sectionEndMarker = '# Increase the maximum file descriptors'
            
            def startIndex = unixScript.text.indexOf(startMarker)
            def endIndex = unixScript.text.indexOf(sectionEndMarker, startIndex)
            
            if (startIndex == -1 || endIndex == -1) {
                throw new GradleException("${path} could not locate the Unix Java detection markers")
            }
            unixScript.text = unixScript.text.substring(0, startIndex) + unixJavaDetectionLogic + '\n\n' + unixScript.text.substring(endIndex)
            
            // For Windows scripts - inject SBK_JAVA_HOME runtime check with fallback
            def windowsJavaLogic = '''@rem Resolve a configured, system, or previously managed JDK 25.
call "%APP_HOME%\\bin\\sbk-java-bootstrap.bat" false
if errorlevel 1 goto fail

'''
            def winStartMarker = '@rem Find java.exe'
            def winEndMarker = ':execute'
            
            def winStartIndex = windowsScript.text.indexOf(winStartMarker)
            def winEndIndex = windowsScript.text.indexOf(winEndMarker, winStartIndex)
            
            if (winStartIndex == -1 || winEndIndex == -1) {
                throw new GradleException("${path} could not locate the Windows Java detection markers")
            }
            windowsScript.text = windowsScript.text.substring(0, winStartIndex) + windowsJavaLogic + windowsScript.text.substring(winEndIndex)
        }
    }

    def verifySbkJavaHomeStartScripts = tasks.register('verifySbkJavaHomeStartScripts') {
        dependsOn tasks.withType(CreateStartScripts)
        doLast {
            tasks.withType(CreateStartScripts).each { scriptTask ->
                if (!scriptTask.unixScript.text.contains('sbk-java-bootstrap.sh')) {
                    throw new GradleException("${scriptTask.path} Unix launcher does not use the SBK JDK resolver")
                }
                if (!scriptTask.windowsScript.text.contains('sbk-java-bootstrap.bat')) {
                    throw new GradleException("${scriptTask.path} Windows launcher does not use the SBK JDK resolver")
                }
                rootProject.ext.sbkRuntimeJvmArgs.each { option ->
                    if (!scriptTask.unixScript.text.contains(option)) {
                        throw new GradleException(
                                "${scriptTask.path} Unix launcher is missing runtime JVM option ${option}")
                    }
                    if (!scriptTask.windowsScript.text.contains(option)) {
                        throw new GradleException(
                                "${scriptTask.path} Windows launcher is missing runtime JVM option ${option}")
                    }
                }
            }
        }
    }

    tasks.named('check').configure {
        dependsOn verifySbkJavaHomeStartScripts
    }
    tasks.matching { it.name in ['installDist', 'distZip', 'distTar'] }.configureEach {
        dependsOn verifySbkJavaHomeStartScripts
    }

    application {
        applicationDistribution.from(pathingJar) {
            into "lib"
        }
        applicationDistribution.from(rootProject.files(
                rootProject.file('gradle/sbk-java-bootstrap.sh'),
                rootProject.file('gradle/sbk-java-bootstrap.bat'),
                rootProject.file('gradle/sbk-java-bootstrap.ps1'),
                rootProject.file('gradle/sbk-java-bootstrap.properties'))) {
            into "bin"
        }
    }


}
