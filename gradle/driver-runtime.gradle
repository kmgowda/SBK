// This build contract is independent of SBK-GEM. Every standard distribution remains
// complete, while worker-runtime contains a reproducible dependency closure that any
// deployment tool can consume for one enabled driver.
def sbkDriverRuntimeDirectory = layout.buildDirectory.dir('generated/sbk-driver-runtimes')
def driverRuntimeManifestFormat = '1'
def reproducibleJarTimestamp = 0L
def compactJavaRuntimeConfigFile = rootProject.file('gradle/sbk-compact-java-runtime.properties')
def compactJavaRuntimeConfig = new Properties()
compactJavaRuntimeConfigFile.withInputStream { compactJavaRuntimeConfig.load(it) }
def compactJavaRuntimeDescriptorName = 'java-runtime.properties'
def compactJavaRuntimeModules = compactJavaRuntimeConfig.getProperty('java.modules', '').split(',')
        .collect { it.trim() }.findAll { !it.isEmpty() }.sort()
def compactJavaRuntimeOptions = compactJavaRuntimeConfig.getProperty('jlink.options', '').split(',')
        .collect { it.trim() }.findAll { !it.isEmpty() }
def configuredSbkVersion = sbkVersion.toString()
def configuredJavaMajorVersion = sbkJavaMajorVersion.toString()
def aggregateRuntimeConfiguration = configurations.runtimeClasspath
def aggregateRuntimeClasspath = files(aggregateRuntimeConfiguration)
def aggregateMainJarFile = tasks.named('jar', Jar).flatMap { it.archiveFile }
def enabledDriverCoordinates = subprojects.findAll {
    it.parent != null && it.parent.name == 'drivers'
}.collect { [name: it.name, path: it.path] }.sort { it.name.toLowerCase(Locale.ROOT) }
def driverRuntimeFileNames = providers.provider {
    def resolvedArtifacts = aggregateRuntimeConfiguration.incoming.artifacts.artifacts
    def artifactsByComponent = resolvedArtifacts.groupBy { it.id.componentIdentifier }
    def components = aggregateRuntimeConfiguration.incoming.resolutionResult.allComponents
    enabledDriverCoordinates.collectEntries { driverProject ->
        def driverComponent = components.find {
            it.id instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier
                    && it.id.projectPath == driverProject.path
        }
        if (driverComponent == null) {
            throw new GradleException("Enabled driver ${driverProject.path} is absent from the aggregate runtime")
        }
        def selectedComponents = new LinkedHashSet()
        def visitComponent
        visitComponent = { component ->
            if (selectedComponents.add(component.id)) {
                component.dependencies.findAll {
                    it instanceof org.gradle.api.artifacts.result.ResolvedDependencyResult
                }.each { visitComponent(it.selected) }
            }
        }
        visitComponent(driverComponent)
        [(driverProject.name): selectedComponents.collectMany {
            (artifactsByComponent[it] ?: []).collect { artifact -> artifact.file.name }
        }.sort()]
    }
}

if (compactJavaRuntimeConfig.getProperty('format.version') != '1'
        || compactJavaRuntimeModules.isEmpty() || compactJavaRuntimeOptions.isEmpty()) {
    throw new GradleException("Invalid compact Java runtime configuration: ${compactJavaRuntimeConfigFile}")
}

def generateSbkDriverRuntimes = tasks.register('generateSbkDriverRuntimes') {
    description = 'Generates independently consumable runtime manifests and pathing JARs for every enabled driver.'
    dependsOn tasks.named('jar')
    inputs.files(aggregateRuntimeClasspath)
            .withPropertyName('aggregateRuntimeClasspath')
            .withPathSensitivity(PathSensitivity.NAME_ONLY)
    inputs.file(aggregateMainJarFile)
            .withPropertyName('aggregateMainJar')
            .withPathSensitivity(PathSensitivity.NAME_ONLY)
    inputs.file(compactJavaRuntimeConfigFile)
            .withPropertyName('compactJavaRuntimeConfig')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.property('driverRuntimeFileNames', driverRuntimeFileNames)
    outputs.dir(sbkDriverRuntimeDirectory)
    outputs.cacheIf('Driver runtime metadata is reproducible from the resolved runtime classpath') { true }

    doLast {
        def outputDirectory = sbkDriverRuntimeDirectory.get().asFile
        outputDirectory.deleteDir()
        outputDirectory.mkdirs()

        def rootMainJar = aggregateMainJarFile.get().asFile
        def aggregateFilesByName = aggregateRuntimeClasspath.files.groupBy { it.name }
        new File(outputDirectory, compactJavaRuntimeDescriptorName).setText(
                "format.version=${compactJavaRuntimeConfig.getProperty('format.version')}\n"
                        + "java.major=${configuredJavaMajorVersion}\n"
                        + "java.modules=${compactJavaRuntimeModules.join(',')}\n"
                        + "jlink.options=${compactJavaRuntimeOptions.join(',')}\n",
                'UTF-8')

        enabledDriverCoordinates.each { driverProject ->
            def runtimeFiles = driverRuntimeFileNames.get().get(driverProject.name).collectMany { fileName ->
                aggregateFilesByName.get(fileName) ?: []
            }
            runtimeFiles.add(rootMainJar)
            def duplicateNames = runtimeFiles.groupBy { it.name }.findAll { name, files -> files.size() > 1 }
            if (!duplicateNames.isEmpty()) {
                throw new GradleException("Driver ${driverProject.name} has duplicate runtime filenames: "
                        + duplicateNames.keySet())
            }
            runtimeFiles = runtimeFiles.sort { it.name }

            def pathingJar = new File(outputDirectory,
                    "${driverProject.name}-sbk-pathing-${configuredSbkVersion}.jar")
            def pathingManifest = new java.util.jar.Manifest()
            pathingManifest.mainAttributes.put(java.util.jar.Attributes.Name.MANIFEST_VERSION, '1.0')
            pathingManifest.mainAttributes.put(java.util.jar.Attributes.Name.CLASS_PATH,
                    runtimeFiles.collect { it.name }.join(' '))
            pathingJar.withOutputStream { stream ->
                new java.util.jar.JarOutputStream(stream).withCloseable { jar ->
                    def manifestDirectory = new java.util.jar.JarEntry('META-INF/')
                    manifestDirectory.setTime(reproducibleJarTimestamp)
                    jar.putNextEntry(manifestDirectory)
                    jar.closeEntry()
                    def manifestEntry = new java.util.jar.JarEntry('META-INF/MANIFEST.MF')
                    manifestEntry.setTime(reproducibleJarTimestamp)
                    jar.putNextEntry(manifestEntry)
                    pathingManifest.write(jar)
                    jar.closeEntry()
                }
            }

            def digest = java.security.MessageDigest.getInstance('SHA-256')
            (runtimeFiles + pathingJar).each { runtimeFile ->
                digest.update(runtimeFile.name.getBytes(java.nio.charset.StandardCharsets.UTF_8))
                digest.update((byte) 0)
                runtimeFile.withInputStream { input ->
                    byte[] buffer = new byte[64 * 1024]
                    int count
                    while ((count = input.read(buffer)) >= 0) {
                        digest.update(buffer, 0, count)
                    }
                }
            }
            def runtimeIdentity = java.util.HexFormat.of().formatHex(digest.digest())
            def manifestFile = new File(outputDirectory, "${driverProject.name}.properties")
            manifestFile.setText(
                    "format.version=${driverRuntimeManifestFormat}\n"
                            + "driver.name=${driverProject.name}\n"
                            + "sbk.version=${configuredSbkVersion}\n"
                            + "runtime.pathing=${pathingJar.name}\n"
                            + "runtime.files=${runtimeFiles.collect { it.name }.join(',')}\n"
                            + "runtime.sha256=${runtimeIdentity}\n",
                    'UTF-8')
        }
    }
}

def verifySbkDriverRuntimes = tasks.register('verifySbkDriverRuntimes') {
    description = 'Verifies every enabled driver has a complete packaged runtime manifest and pathing JAR.'
    dependsOn generateSbkDriverRuntimes
    inputs.dir(sbkDriverRuntimeDirectory)
    def verificationMarker = layout.buildDirectory.file(
            'verification/sbk-driver-runtimes.verified')
    outputs.file(verificationMarker)
    outputs.cacheIf('Driver runtime verification is reproducible from packaged metadata') { true }

    doLast {
        def directory = sbkDriverRuntimeDirectory.get().asFile
        def javaRuntimeDescriptor = new File(directory, compactJavaRuntimeDescriptorName)
        def javaRuntimeProperties = new Properties()
        javaRuntimeDescriptor.withInputStream { javaRuntimeProperties.load(it) }
        if (javaRuntimeProperties.getProperty('format.version') != '1'
                || javaRuntimeProperties.getProperty('java.major') != configuredJavaMajorVersion
                || javaRuntimeProperties.getProperty('java.modules') != compactJavaRuntimeModules.join(',')
                || javaRuntimeProperties.getProperty('jlink.options') != compactJavaRuntimeOptions.join(',')) {
            throw new GradleException("Invalid compact Java runtime descriptor ${javaRuntimeDescriptor}")
        }
        def expectedDrivers = enabledDriverCoordinates.collect { it.name }.sort()
        expectedDrivers.each { driverName ->
            def manifestFile = new File(directory, "${driverName}.properties")
            if (!manifestFile.isFile()) {
                throw new GradleException("Missing driver runtime manifest ${manifestFile}")
            }
            def properties = new Properties()
            manifestFile.withInputStream { properties.load(it) }
            if (properties.getProperty('format.version') != driverRuntimeManifestFormat
                    || properties.getProperty('driver.name') != driverName
                    || properties.getProperty('sbk.version') != configuredSbkVersion
                    || !(properties.getProperty('runtime.sha256') ==~ /[0-9a-f]{64}/)) {
                throw new GradleException("Invalid driver runtime manifest ${manifestFile}")
            }
            def pathingJar = new File(directory, properties.getProperty('runtime.pathing', ''))
            if (!pathingJar.isFile()) {
                throw new GradleException("Missing driver runtime pathing JAR ${pathingJar}")
            }
            def runtimeFiles = properties.getProperty('runtime.files', '').split(',').findAll { !it.isBlank() }
            if (runtimeFiles.isEmpty()
                    || !runtimeFiles.contains("sbk-${configuredSbkVersion}.jar".toString())) {
                throw new GradleException("Incomplete driver runtime classpath in ${manifestFile}")
            }
            def pathingManifest = new java.util.jar.JarFile(pathingJar).withCloseable {
                it.manifest?.mainAttributes?.getValue(java.util.jar.Attributes.Name.CLASS_PATH)
            }
            if (pathingManifest == null
                    || pathingManifest.split(/\s+/).toList().toSet() != runtimeFiles.toSet()) {
                throw new GradleException("Pathing JAR does not match driver runtime manifest ${manifestFile}")
            }
        }
        def marker = verificationMarker.get().asFile
        marker.parentFile.mkdirs()
        marker.setText("verified\n", 'UTF-8')
    }
}

def compactJavaRuntimeOutput = layout.buildDirectory.dir('generated/sbk-compact-java-runtime')
def compactJavaRuntimeWindows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
def jlinkExecutable = new File(System.getProperty('java.home'),
        compactJavaRuntimeWindows ? 'bin/jlink.exe' : 'bin/jlink')
def jlinkModulesDirectory = new File(System.getProperty('java.home'), 'jmods')
def javaExecutableName = compactJavaRuntimeWindows ? 'java.exe' : 'java'
tasks.register('generateSbkCompactJavaRuntime', Exec) {
    description = 'Generates the standalone compact Java runtime described by worker-runtime/java-runtime.properties.'
    group = 'distribution'
    dependsOn generateSbkDriverRuntimes
    inputs.file(compactJavaRuntimeConfigFile)
    inputs.file(new File(System.getProperty('java.home'), 'release'))
    inputs.dir(jlinkModulesDirectory)
            .withPropertyName('jdkModules')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.property('javaMajor', sbkJavaMajorVersion)
    inputs.property('javaModules', compactJavaRuntimeModules.join(','))
    inputs.property('jlinkOptions', compactJavaRuntimeOptions.join(','))
    outputs.dir(compactJavaRuntimeOutput)
    outputs.cacheIf('Compact runtime is reproducible from the selected JDK modules and jlink contract') { true }

    doFirst {
        if (!jlinkExecutable.isFile()) {
            throw new GradleException("The selected build JDK has no jlink executable: ${jlinkExecutable}")
        }
        compactJavaRuntimeOutput.get().asFile.deleteDir()
        commandLine([jlinkExecutable.absolutePath,
                     '--module-path', jlinkModulesDirectory.absolutePath,
                     '--add-modules', compactJavaRuntimeModules.join(',')]
                + compactJavaRuntimeOptions
                + ['--output', compactJavaRuntimeOutput.get().asFile.absolutePath])
    }
    doLast {
        def runtimeJava = new File(compactJavaRuntimeOutput.get().asFile, "bin/${javaExecutableName}")
        def runtimeJavac = new File(compactJavaRuntimeOutput.get().asFile,
                compactJavaRuntimeWindows ? 'bin/javac.exe' : 'bin/javac')
        if (!runtimeJava.isFile() || runtimeJavac.exists()) {
            throw new GradleException("Invalid compact Java runtime under ${compactJavaRuntimeOutput.get().asFile}")
        }
    }
}

application {
    applicationDistribution.from(generateSbkDriverRuntimes) {
        into 'worker-runtime'
    }
}

tasks.named('installDist') {
    dependsOn verifySbkDriverRuntimes
}
tasks.named('distTar') {
    dependsOn verifySbkDriverRuntimes
}
tasks.named('build') {
    dependsOn tasks.named('installDist'), tasks.named('distTar'), verifySbkDriverRuntimes
}
