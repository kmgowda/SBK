sbkGemArgs:
  nodes: >
        localhost
        10.20.30.40
        100.200.300.400
        kmg-host-1, kmg-host-2

  class: file
  readers: 1
  size: 10
  time: ns 
  seconds: 60 
  gemuser: kmg 
  # Passwordless SSH is preferred. SBK-GEM uses ssh-agent and local SSH key files.
  # Set gempass only when the remote account requires password authentication.
  # gempass:
  # Verify server keys by default. Use a dedicated trust file when needed.
  hostkeycheck: true
  # knownhosts: /home/kmg/.ssh/known_hosts
  sbkdir:
  # Allow copying SBK when it is missing or outdated (default: true).
  copy: true
  # Delete an outdated SBK before copying its replacement (default: true).
  delete: true
  # Keep the reconciled remote installation after the benchmark (default: false).
  deleteafter: false
  # Java provisioning defaults: copy local Java 25 only when it is unavailable remotely.
  javacopy: true
  javaversion: 25
  # javadir: /opt/sbk-java
