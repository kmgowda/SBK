sbkGemArgs:
  nodes: >
        localhost
        10.20.30.40
        100.200.300.400
        kmg-host-1, kmg-host-2

  class: file
  readers: 1
  size: 10
  time: ns 
  seconds: 60 
  gemuser: kmg 
  # Passwordless SSH is preferred. SBK-GEM uses ssh-agent and local SSH key files.
  # Set gempass only when the remote account requires password authentication.
  # gempass:
  # Enable accept-new server-key verification explicitly (default: false).
  # Use a dedicated trust file when needed.
  hostkeycheck: true
  # knownhosts: /home/kmg/.ssh/known_hosts
  # Retain the current runtime and remove inactive non-current managed identities (default: true).
  packagescleanup: true
  # Set true to copy the complete controller JDK and complete SBK distribution (default: false).
  fullcopy: false
  # Java provisioning defaults: include and use the local Java 25 runtime.
  # javadir: /opt/sbk-java
