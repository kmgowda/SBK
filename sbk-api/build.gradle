buildscript {
    repositories {
        mavenCentral()
        maven {
            url = gradlePluginRepositoryUrl
        }
    }
    dependencies {
        classpath "com.google.protobuf:protobuf-gradle-plugin:$protobufGradlePlugin"
        classpath "me.champeau.jmh:jmh-gradle-plugin:$jmhGradleVersion"
    }
}

apply plugin: 'java-library'
apply plugin: "com.google.protobuf"
apply plugin: "maven-publish"
apply plugin: "com.github.spotbugs"
apply plugin: "me.champeau.jmh"

apply from: "$rootDir/gradle/protobuf.gradle"
apply from: "$rootDir/gradle/rat.gradle"
apply from: "$rootDir/gradle/maven.gradle"
apply from: "$rootDir/gradle/spotbugs.gradle"

dependencies {
    api project(":perl")
    api project(":sbk-web-console")
    annotationProcessor "org.projectlombok:lombok:$lombokVersion"
    api "org.reflections:reflections:$reflectionsVersion"
    api "org.apache.commons:commons-configuration2:$apacheCommonsConfigVersion"
    api "org.apache.commons:commons-lang3:$apacheCommonsLang3Version" // https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
    implementation "commons-cli:commons-cli:$commonsCliVersion"
    implementation "org.eclipse.collections:eclipse-collections:$eclipseCollectionVersion"
    implementation "org.jetbrains:annotations:$jetbrainVersion"
    testImplementation "io.grpc:grpc-inprocess:$grpcVersion"
}

jmh {
    jvmArgs = ["-Djmh.blackhole.autoDetect=false"]
    includes = [
            'io.sbk.api.CoreHotPathBenchmark.*',
            'io.sbk.logger.impl.GrpcLatencyAccumulatorBenchmark.*'
    ]
}

def grpcLoggerPerformanceReport = layout.buildDirectory.file(
        "reports/jmh/grpc-logger-performance.json")

tasks.register('runGrpcLoggerPerformanceBenchmark', JavaExec) {
    group = 'verification'
    description = 'Benchmarks primitive gRPC latency batching against a boxed-map baseline.'
    dependsOn tasks.named('jmhJar')
    classpath = files(tasks.named('jmhJar').flatMap { it.archiveFile })
    mainClass = 'org.openjdk.jmh.Main'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(rootProject.ext.sbkJavaMajorVersion)
    }
    jvmArgs rootProject.ext.sbkRuntimeJvmArgs
    args 'io.sbk.logger.impl.GrpcLatencyAccumulatorBenchmark.*',
            '-prof', 'gc',
            '-jvmArgs', (rootProject.ext.sbkRuntimeJvmArgs
                    + ['-Djmh.blackhole.autoDetect=false']).join(' '),
            '-rf', 'json',
            '-rff', grpcLoggerPerformanceReport.get().asFile.absolutePath
    outputs.file(grpcLoggerPerformanceReport)
    outputs.upToDateWhen { false }
    doFirst {
        grpcLoggerPerformanceReport.get().asFile.parentFile.mkdirs()
        delete grpcLoggerPerformanceReport
    }
}

tasks.register('grpcLoggerPerformanceTest') {
    group = 'verification'
    description = 'Reports gRPC logger latency-accumulation and protobuf-encoding performance.'
    dependsOn tasks.named('runGrpcLoggerPerformanceBenchmark')
    doLast {
        def results = new groovy.json.JsonSlurper().parse(
                grpcLoggerPerformanceReport.get().asFile)
        def byName = results.collectEntries {
            [(it.benchmark.substring(it.benchmark.lastIndexOf('.') + 1)): it]
        }
        def allocation = { result ->
            result.secondaryMetrics.find { key, value ->
                key.endsWith('gc.alloc.rate.norm')
            }?.value?.score ?: 0.0d
        }
        byName.each { name, result ->
            println String.format(
                    "%-24s : %,.3f %s; %,.3f B/op",
                    name, result.primaryMetric.score, result.primaryMetric.scoreUnit,
                    allocation(result))
        }
        def primitive = byName.recordPrimitive
        def boxedMap = byName.recordBoxedMap
        def packed = byName.encodePacked
        println String.format(
                "Hot-path observed mean   : primitive accumulation is %.2f%% faster and removes %.3f B/op"
                        + " versus the boxed map",
                (boxedMap.primaryMetric.score - primitive.primaryMetric.score)
                        * 100.0d / boxedMap.primaryMetric.score,
                allocation(boxedMap) - allocation(primitive))
        println String.format(
                "SBP 4 packed encoding    : %,.3f %s; %,.3f B/op",
                packed.primaryMetric.score, packed.primaryMetric.scoreUnit, allocation(packed))
    }
}

def coreHotPathPerformanceReport = layout.buildDirectory.file(
        "reports/jmh/core-hot-path-performance.json")

tasks.register('coreHotPathPerformanceTest', JavaExec) {
    group = 'verification'
    description = 'Benchmarks native duration checks and callback-reader mode specialization.'
    mustRunAfter ':perl:periodicRecorderPerformanceTest'
    dependsOn tasks.named('jmhJar')
    classpath = files(tasks.named('jmhJar').flatMap { it.archiveFile })
    mainClass = 'org.openjdk.jmh.Main'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(rootProject.ext.sbkJavaMajorVersion)
    }
    jvmArgs rootProject.ext.sbkRuntimeJvmArgs
    args 'io.sbk.api.CoreHotPathBenchmark.*',
            '-prof', 'gc',
            '-jvmArgs', (rootProject.ext.sbkRuntimeJvmArgs
                    + ['-Djmh.blackhole.autoDetect=false']).join(' '),
            '-rf', 'json',
            '-rff', coreHotPathPerformanceReport.get().asFile.absolutePath
    outputs.file(coreHotPathPerformanceReport)
    outputs.upToDateWhen { false }
    doFirst {
        coreHotPathPerformanceReport.get().asFile.parentFile.mkdirs()
        delete coreHotPathPerformanceReport
    }
    doLast {
        def results = new groovy.json.JsonSlurper().parse(
                coreHotPathPerformanceReport.get().asFile)
        def byName = results.collectEntries {
            [(it.benchmark.tokenize('.').last()): it.primaryMetric]
        }
        def verifyLower = { String optimizedName, String referenceName ->
            def optimized = byName[optimizedName]
            def reference = byName[referenceName]
            if (optimized == null || reference == null) {
                throw new GradleException(
                        "Missing core hot-path JMH comparison: ${optimizedName}/${referenceName}")
            }
            if (optimized.scoreConfidence[1] >= reference.scoreConfidence[0]) {
                throw new GradleException(String.format(
                        '%s JMH 99.9%% CI [%f, %f] does not remain below %s [%f, %f]',
                        optimizedName, optimized.scoreConfidence[0],
                        optimized.scoreConfidence[1], referenceName,
                        reference.scoreConfidence[0], reference.scoreConfidence[1]))
            }
            logger.lifecycle(String.format(
                    '%s: %.2f%% lower mean latency than %s (%.3f vs %.3f ns/op)',
                    optimizedName,
                    (reference.score - optimized.score) * 100.0d / reference.score,
                    referenceName, optimized.score, reference.score))
        }
        verifyLower('nativeDurationCheck', 'millisecondDurationCheck')
        verifyLower('durationCallback', 'legacyDurationCallback')
    }
}

generateJavadoc {
    // follow the package path , it should not be folder path.
    // but dont use . (dot) in the path
    //exclude 'io/sbp/grpc/ServiceGrpc.java'
    //exclude 'io/sbp/grpc/LatenciesRecordOrBuilder.java'
    //exclude 'io/sbp/grpc/LatenciesRecord.java'
}


tasks.register('updateDocs') {
    dependsOn javadoc
    doLast {
        println "Update $projectDir Javadocs"
        delete "$projectDir/javadoc"
        copy {
            from "$projectDir/build/docs/javadoc"
            into "$projectDir/javadoc"
        }
    }
}
