#port
port=9717

#max latency record size in MB
maxRecordSizeMB=16

#Maximum immutable latency batches queued for the gRPC sender
maximumPendingBatches=8

#Best-effort terminal failure report deadline
failureReportTimeoutSeconds=3

#Maximum wait to drain and acknowledge the latency stream
streamCloseTimeoutSeconds=5

#Graceful and forced gRPC channel shutdown waits
channelShutdownTimeoutSeconds=5
channelForceShutdownTimeoutSeconds=1
