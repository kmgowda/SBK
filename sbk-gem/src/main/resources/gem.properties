#nodes
#should be separated by , (comma character)
nodes=localhost

#ssh user name
gemuser=user

#No password, some clusters may have access without passwords too.
# if th env variable : SBK_GEM_SSH_PASSWD is set, then its used as password
gempass=

#port
gemport=22

#Initial SBK path
sbkDir=

#Initial SBK command path
sbkCommand=

# Allow SBK-GEM to copy SBK when it is missing or has another version.
copy=true

# Copy the local Java runtime when the required Java is unavailable remotely
javacopy=true

# Required Java major version
javaversion=25

# Optional remote Java home containing bin/java; empty enables automatic discovery
javadir=

# Delete an existing mismatched SBK before copying the expected version.
delete=true

# Delete the remote SBK deployment after the benchmark completes.
deleteafter=false

#timeout Seconds
timeoutSeconds=5

#max Iterations
maxIterations=5

# Use the Fork Join Model
fork=true
