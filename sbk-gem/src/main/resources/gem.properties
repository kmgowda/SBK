#nodes
#should be separated by , (comma character)
nodes=localhost

#ssh user name
gemuser=user

# Optional SSH password. Leave empty to use public-key authentication through
# ssh-agent or the key files selected by the local OpenSSH configuration.
# If SBK_GEM_SSH_PASSWD is set, its value is used as the password.
gempass=

# Verify remote server keys against known_hosts. Disable only in an isolated,
# disposable environment where server impersonation is an accepted risk.
hostkeycheck=true

# Optional known_hosts path; empty uses the launching user's default SSH file.
knownhosts=

#port
gemport=22

#Initial SBK path
sbkDir=

# Copy the local Java runtime when the required Java is unavailable remotely
javacopy=true

# Required Java major version
javaversion=25

# Optional remote Java home containing bin/java; empty enables automatic discovery
javadir=

# Delete an existing mismatched SBK before copying the expected version.
delete=true

# Remove every inactive non-current SBK-GEM-managed runtime and local cached bundle
# after verified activation, regardless of whether its SBK version is lower or higher.
# The current verified identity is retained for reuse. Active non-current runtimes and
# archives in transfer remain only until their lease/lock is released, then become eligible.
runtimecleanup=true

#timeout Seconds
timeoutSeconds=5

# Maximum duration for one SSH control command or connection operation.
# The remote benchmark command uses its configured benchmark duration plus this grace period.
remoteTimeoutSeconds=30

# Maximum duration for runtime archive creation, transfer, verification, and activation.
deploymentTimeoutSeconds=1800

# Emit bounded progress while preparing and copying the managed runtime bundle.
runtimeProgressIntervalSeconds=5

# Local content-addressed runtime bundle cache, relative to the user's home directory by default.
runtimeCacheDirectory=.sbk/cache/sbk-gem

# Maximum wait for the per-host managed-runtime lifecycle lock.
runtimeManagementLockTimeoutSeconds=120

# Reclaim a lifecycle lock left behind by a terminated GEM process after this age.
runtimeManagementLockStaleSeconds=3600

# Reclaim a runtime reservation that never reached remote SBK launch after this age.
# This must exceed runtimeManagementLockTimeoutSeconds + remoteTimeoutSeconds.
runtimeLeaseReservationSeconds=300

# Maximum time for every launched remote SBK client to initialize and register with SBM.
sbmRegistrationTimeoutSeconds=120

#max Iterations
maxIterations=5

# Use the Fork Join Model
fork=true

#Executor threads reserved for orchestration and embedded services
executorThreadReserve=10

#Maximum stdout/stderr bytes retained per remote command
diagnosticBytes=262144

#Maximum OpenSSH agent response frame size
maximumAgentResponseBytes=16777216

#Maximum characters retained in a summarized remote diagnostic
maximumDiagnosticCharacters=512
diagnosticPrefixCharacters=320
