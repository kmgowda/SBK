def sbkRuntimeIdentityFile = layout.buildDirectory.file(
        'generated/sbk-runtime-identity/sbk-runtime-identity.properties')
def sbkBootstrapFiles = files(
        'gradle/sbk-java-bootstrap.sh',
        'gradle/sbk-java-bootstrap.bat',
        'gradle/sbk-java-bootstrap.ps1',
        'gradle/sbk-java-bootstrap.properties')
def generateSbkRuntimeIdentity = tasks.register('generateSbkRuntimeIdentity') {
    dependsOn tasks.named('jar'), tasks.named('pathingJar'), tasks.withType(CreateStartScripts),
            project(':sbk-gem').tasks.named('remoteAgentJar')
    inputs.property('runtimeIdentityFormat', 1)
    inputs.property('sbkVersion', sbkVersion.toString())
    inputs.files(configurations.runtimeClasspath)
            .withPropertyName('runtimeClasspath')
            .withPathSensitivity(PathSensitivity.NAME_ONLY)
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
            .withPropertyName('sbkJar')
            .withPathSensitivity(PathSensitivity.NAME_ONLY)
    inputs.file(tasks.named('pathingJar').flatMap { it.archiveFile })
            .withPropertyName('pathingJar')
            .withPathSensitivity(PathSensitivity.NAME_ONLY)
    inputs.file(project(':sbk-gem').tasks.named('remoteAgentJar').flatMap { it.archiveFile })
            .withPropertyName('remoteAgentJar')
            .withPathSensitivity(PathSensitivity.NAME_ONLY)
    inputs.files(tasks.withType(CreateStartScripts))
            .withPropertyName('launchers')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(sbkBootstrapFiles)
            .withPropertyName('javaBootstrap')
            .withPathSensitivity(PathSensitivity.NAME_ONLY)
    outputs.file(sbkRuntimeIdentityFile)

    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        def updateDigest = { String label, File input ->
            digest.update(label.getBytes(java.nio.charset.StandardCharsets.UTF_8))
            digest.update((byte) 0)
            input.withInputStream { stream ->
                byte[] buffer = new byte[64 * 1024]
                int count
                while ((count = stream.read(buffer)) >= 0) {
                    digest.update(buffer, 0, count)
                }
            }
        }
        configurations.runtimeClasspath.files.sort { it.name }.each {
            updateDigest("lib/${it.name}", it)
        }
        [tasks.named('jar').get().archiveFile.get().asFile,
         tasks.named('pathingJar').get().archiveFile.get().asFile,
         project(':sbk-gem').tasks.named('remoteAgentJar').get().archiveFile.get().asFile]
                .sort { it.name }
                .each { updateDigest("lib/${it.name}", it) }
        tasks.withType(CreateStartScripts).sort { it.name }.each { scriptTask ->
            fileTree(scriptTask.outputDir).files.sort { it.name }.each {
                updateDigest("bin/${it.name}", it)
            }
        }
        sbkBootstrapFiles.files.sort { it.name }.each {
            updateDigest("bin/${it.name}", it)
        }
        def identity = java.util.HexFormat.of().formatHex(digest.digest())
        def output = sbkRuntimeIdentityFile.get().asFile
        output.parentFile.mkdirs()
        output.setText("format.version=1\nsbk.version=${sbkVersion}\nbuild.sha256=${identity}\n", 'UTF-8')
    }
}

application {
    applicationDistribution.from(generateSbkRuntimeIdentity)
    applicationDistribution.from(project(':sbk-gem').tasks.named('remoteAgentJar')) {
        into 'lib'
    }
    additionalLaunchers.each { launcher ->
        applicationDistribution.into("bin") {
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
            from(launcher)
            filePermissions {
                user {
                    read = true
                    execute = true
                }
                other.execute = true
            }
        }
    }

    // Include documentation files in the distribution
    applicationDistribution.into("docs") {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        from("docs") {
            include "AGENT_RECIPES.md"
            include "DRIVER_SPECIFICATION.md"
            include "AGENT_TOOLKIT.md"
            include "AGENT_DOCUMENTATION_DISTRIBUTION.md"
            include "sbk-internals.md"
            include "README.md"
            include "ARCHITECTURE.md"
            include "REPOSITORY_MAP.md"
            include "DRIVER_GUIDE.md"
            include "DOCUMENTATION_GUIDE.md"
            include "RELEASE_QUALIFICATION.md"
            include "RELEASE_PUBLICATION.md"
            include "PROMETHEUS_LOGGER.md"
            include "WEB_LOGGER.md"
        }
    }

    // Include AGENTS.md, INSTRUCTIONS.md, and README.md at the root of the distribution
    applicationDistribution.from("AGENTS.md")
    applicationDistribution.from("INSTRUCTIONS.md")
    applicationDistribution.from("README.md")

    // Include agent-specific configurations in the distribution
    applicationDistribution.into(".devin") {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        from(".devin") {
            include "skills/**/*"
        }
    }
    applicationDistribution.from(".cursorrules")
    applicationDistribution.from(".aider.conf.yml")
    applicationDistribution.into(".cursor/rules") {
        from(".cursor/rules") {
            include "*.mdc"
        }
    }
}


tasks.register('deleteDriver') {
    doLast {
        String templateName = "sbktemplate"
        String driverName = templateName

        if (project.hasProperty("driver")) {
            driverName = driver.toLowerCase()
        } else {
            println "driver name is missing user -Pdriver "
            return
        }
        println "Delete Driver : $driverName"
        if (driverName.contains(templateName)) {
            println "Invalid driver name"
            return
        }
        delete "$rootDir/drivers/$driverName"

        def inFile1 = new File("$rootDir/settings-drivers.gradle").newInputStream()
        String outText1 = ""
        inFile1.eachLine {
            String line = it
            if (!line.contains(driverName)) {
                outText1 += line + "\n"
            }
        }
        inFile1.close()
        File outFile1 = new File("$rootDir/settings-drivers.gradle")
        outFile1.write(outText1)

        def inFile2 = new File("$rootDir/build-drivers.gradle").newInputStream()
        String outText2 = ""
        inFile2.eachLine {
            String line = it
            if (!line.contains(driverName)) {
                outText2 += line + "\n"
            }
        }
        inFile2.close()
        File outFile2 = new File("$rootDir/build-drivers.gradle")
        outFile2.write(outText2)
    }
}


tasks.register('addDriver') {
    dependsOn deleteDriver
    doLast {
        String templateName = "sbktemplate"
        String driverName = templateName
        String sbkDriverName = driverName.capitalize()

        if (project.hasProperty("driver")) {
            driverName = driver.toLowerCase()
        } else {
            println "driver name is missing user -Pdriver "
            return
        }
        sbkDriverName = driverName.capitalize()
        println "Add Driver: $sbkDriverName"
        if (driverName.contains(templateName)) {
            println "Invalid driver name"
            return
        }

        copy {
            from "drivers/$templateName"
            into "drivers/$driverName"
            exclude 'build'
            rename "SbkTemplate", "$sbkDriverName"
            filter { line -> line.replaceAll('SbkTemplate', sbkDriverName) }
        }
        copy {
            from "drivers/$driverName/src/main/java/io/sbk/driver/SbkTemplate"
            into "drivers/$driverName/src/main/java/io/sbk/driver/$sbkDriverName"
            rename "SbkTemplate", "$sbkDriverName"
            filter { line -> line.replaceAll('SbkTemplate', sbkDriverName) }
        }
        delete "drivers/$driverName/src/main/java/io/sbk/driver/SbkTemplate"

        def inFile1 = new File("$rootDir/build-drivers.gradle").newInputStream()
        String outText1 = ""
        inFile1.eachLine {
            String line = it
            if (line.contains(templateName)) {
                outText1 += "    api project(':drivers:$driverName')\n"
            }
            outText1 += line + "\n"
        }
        inFile1.close()
        File outFile1 = new File("$rootDir/build-drivers.gradle")
        outFile1.write(outText1)

        def inFile2 = new File("$rootDir/settings-drivers.gradle").newInputStream()
        String outText2 = ""
        inFile2.eachLine {
            String line = it
            if (line.contains(templateName)) {
                outText2 += "include 'drivers:$driverName'\n"
            }
            outText2 += line + "\n"
        }
        inFile2.close()
        File outFile2 = new File("$rootDir/settings-drivers.gradle")
        outFile2.write(outText2)
    }
}


