import org.gradle.internal.jvm.Jvm

import java.util.regex.Matcher

buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            url = gradlePluginRepositoryUrl
        }
    }
    dependencies {
        classpath "com.github.spotbugs.snom:spotbugs-gradle-plugin:$spotbugsPluginVersion"
        classpath "gradle.plugin.com.palantir.graal:gradle-graal:$graalvmPluginVersion"
        classpath "com.google.cloud.tools.jib:com.google.cloud.tools.jib.gradle.plugin:$jibVersion"
        // classpath group: 'org.hidetake', name:'gradle-ssh-plugin', version: sshPluginVersion
        //classpath group: 'ru.vyarus', name:'gradle-mkdocs-plugin', version: mkdocsPluginVersion
    }

    // Determine JDK source and path
    def jdkSource = System.getenv("SBK_JAVA_SOURCE") ?: "System Default"
    def jdkPath = System.getProperty("java.home")

    def sbkJavaHome = System.getenv("SBK_JAVA_HOME")
    def javaHome = System.getenv("JAVA_HOME")

    if (sbkJavaHome != null && !sbkJavaHome.isEmpty()) {
        if (jdkSource == "System Default") {
            jdkSource = "SBK_JAVA_HOME"
        }
        jdkPath = sbkJavaHome
    } else if (javaHome != null && !javaHome.isEmpty()) {
        if (jdkSource == "System Default") {
            jdkSource = "JAVA_HOME"
        }
        jdkPath = javaHome
    }

    println "Build JVM Version  	: " + Jvm.current()
    println "Build JDK Source    	: " + jdkSource
    println "Build JDK Path      	: " + jdkPath
    println "Build Gradle Version	: " + gradle.gradleVersion
    println "Build SBK Version  	: " + sbkVersion
}


plugins {
    id 'org.jreleaser' version  "${jReleaserPluginVersion}"
    id 'io.github.ben-manes.versions' version "${gradleVersionsPluginVersion}"
    id 'org.cyclonedx.bom' version "${cycloneDxPluginVersion}" apply false
}

