def launcherJvmOptions = { String applicationName, String className = null ->
    def options = ['-Dsbk.applicationName=' + applicationName]
    if (className != null) {
        options << '-Dsbk.className=' + className
    }
    options + ['-Dsbk.appHome=SBK_APP_HOME', '-Dsbk.jmxExport=false']
}

def configureSbkStartScripts = { taskProvider, Project targetProject, Object jmxPort ->
    taskProvider.configure {
        doLast {
            def pathingJarTask = targetProject.tasks.named('pathingJar').get()
            def jarTask = targetProject.tasks.named('jar').get()
            def pathingJarName = pathingJarTask.archiveFileName.get()
            def jarName = jarTask.archiveFileName.get()

            unixScript.text = unixScript.text.replace('SBK_APP_HOME', '\$APP_HOME')
            unixScript.text = unixScript.text.replace("-Dsbk.appHome=\$APP_HOME",
                    "-Dsbk.appHome='\$APP_HOME'")
            unixScript.text = unixScript.text.replaceAll('CLASSPATH=.*',
                    Matcher.quoteReplacement(
                            "CLASSPATH=\$APP_HOME/lib/${pathingJarName}:\$APP_HOME/lib/${jarName}"))

            windowsScript.text = windowsScript.text.replace('SBK_APP_HOME', '%~dp0..')
            windowsScript.text = windowsScript.text.replace("-Dsbk.appHome=\$APP_HOME",
                    "-Dsbk.appHome='\$APP_HOME'")
            windowsScript.text = windowsScript.text.replaceAll('set CLASSPATH=.*',
                    Matcher.quoteReplacement(
                            "set CLASSPATH=%APP_HOME%\\lib\\${pathingJarName};%APP_HOME%\\lib\\${jarName}"))

            if (jmxExport.toString().toBoolean()) {
                def unixAgent = "-Dsbk.jmxExport=true\" \"-javaagent:'\$APP_HOME'/lib/"
                        + "${jmxAgent}-${jmxPrometheusVersion}.jar=${jmxPort}:'\$APP_HOME'/bin/jmx-config.yml"
                def windowsAgent = "-Dsbk.jmxExport=true\" \"-javaagent:'\$APP_HOME'\\lib\\"
                        + "${jmxAgent}-${jmxPrometheusVersion}.jar=${jmxPort}:'\$APP_HOME'\\bin\\jmx-config.yml"
                unixScript.text = unixScript.text.replace('-Dsbk.jmxExport=false', unixAgent)
                windowsScript.text = windowsScript.text.replace('-Dsbk.jmxExport=false', windowsAgent)
            }
        }
    }
}

