gradle.rootProject {

    jib {
        from {
            image = runtimeContainerImage
        }

        to {
            image = "${project.name}"
            tags = ["latest", project.version]
        }

        container {
            creationTime = 'USE_CURRENT_TIMESTAMP' // Useful for GitOps deployment approach
            mainClass = SbkMainClass
            jvmFlags = rootProject.ext.sbkRuntimeJvmArgs
            ports = ["${sbkMetricsConfig.getProperty('port')}/tcp"]
        }

    }
}


dependencies {
    api project(":perl")
    api project(":sbk-web-console")
    api project(":sbk-api")
    api project(":sbk-yal")
    api project(":sbm")
    api project(":sbk-gem")
    api project(":sbk-gem-yal")
}

apply from: "build-drivers.gradle"
apply from: "gradle/driver-runtime.gradle"

apply from: "gradle/release-qualification.gradle"
apply from: "gradle/release-publication.gradle"
