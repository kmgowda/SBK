apply plugin: 'java-library'
apply plugin: "com.google.protobuf"


buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        // https://mvnrepository.com/artifact/com.google.protobuf/protobuf-gradle-plugin
        classpath "com.google.protobuf:protobuf-gradle-plugin:$protobufGradlePlugin"
    }
}

apply from: "$rootDir/gradle/protobuf.gradle"


repositories {
    mavenCentral()
}

dependencies {
    api project(":sbk-api")
    // https://mvnrepository.com/artifact/org.foundationdb/fdb-record-layer-core-pb3
    api 'org.foundationdb:fdb-record-layer-core-pb3:2.8.110.0'
}

generateJavadoc {
    // follow the package path , it should not be folder path.
    // but dont use . (dot) in the path
    exclude 'io/sbk/FdbRecord/FdbRecordLayerProto.java'
}

