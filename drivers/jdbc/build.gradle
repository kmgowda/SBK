plugins {
    id 'java'
}
apply plugin: "com.github.spotbugs"

apply from: "$rootDir/gradle/spotbugs.gradle"


repositories {
    mavenCentral()
}

dependencies {
    api project(":sbk-api")
    // JDBC implementations are loaded dynamically through java.sql and
    // Class.forName; keep them off the compile classpath while packaging them.
    // https://mvnrepository.com/artifact/org.apache.derby/derby
    runtimeOnly 'org.apache.derby:derby:10.15.2.0'

    // https://mvnrepository.com/artifact/org.apache.derby/derbyclient
    runtimeOnly 'org.apache.derby:derbyclient:10.15.2.0'
    runtimeOnly 'org.apache.derby:derbynet:10.15.2.0'
    runtimeOnly 'org.apache.derby:derbytools:10.15.2.0'


    // https://mvnrepository.com/artifact/mysql/mysql-connector-java
    runtimeOnly 'mysql:mysql-connector-java:8.0.28'

    // https://mvnrepository.com/artifact/org.postgresql/postgresql
    runtimeOnly 'org.postgresql:postgresql:42.1.4'

    // https://mvnrepository.com/artifact/com.microsoft.sqlserver/mssql-jdbc
    runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc:8.2.2.jre8'

    // https://mvnrepository.com/artifact/org.xerial/sqlite-jdbc
    runtimeOnly 'org.xerial:sqlite-jdbc:3.36.0.3'

    // https://mvnrepository.com/artifact/org.mariadb.jdbc/mariadb-java-client
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:2.7.1'

    /*
    // https://mvnrepository.com/artifact/org.apache.ignite/ignite-core
    api group: 'org.apache.ignite', name: 'ignite-core', version: '2.12.0'

    // https://mvnrepository.com/artifact/org.apache.ignite/ignite-spring
    api group: 'org.apache.ignite', name: 'ignite-spring', version: '2.12.0'
     */

    // https://mvnrepository.com/artifact/com.h2database/h2
    runtimeOnly 'com.h2database:h2:2.1.210'

}
