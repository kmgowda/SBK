buildscript {
    repositories {
        mavenCentral()
        maven {
            url = "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath "org.nosphere.apache:creadur-rat-gradle:$apacheRatVersion"
        classpath "me.champeau.jmh:jmh-gradle-plugin:$jmhGradleVersion"
    }
}

apply plugin: 'java-library'
apply plugin: "maven-publish"
apply plugin: "com.github.spotbugs"
apply plugin: "me.champeau.jmh"

//apply plugin: 'org.jreleaser'
apply from: "$rootDir/gradle/rat.gradle"
apply from: "$rootDir/gradle/maven.gradle"
apply from: "$rootDir/gradle/spotbugs.gradle"

dependencies {
    annotationProcessor "org.projectlombok:lombok:$lombokVersion"
    api "jakarta.annotation:jakarta.annotation-api:$javaxAnnotationVersion"
    api "org.projectlombok:lombok:$lombokVersion"
    api "com.github.spotbugs:spotbugs-annotations:$spotbugsVersion"
    api "commons-cli:commons-cli:$commonsCliVersion"
    api "org.apache.commons:commons-csv:$apacheCommonsCsvVersion"
    api "org.hdrhistogram:HdrHistogram:$HdrHistogramVersion"
    api "org.slf4j:slf4j-api:$slf4jVersion"
    api "org.slf4j:slf4j-simple:$slf4jVersion"
    api "tools.jackson.dataformat:jackson-dataformat-properties:$jacksonVersion"
    api "tools.jackson.dataformat:jackson-dataformat-yaml:$jacksonVersion"
    api "tools.jackson.core:jackson-databind:$jacksonVersion"
    api "com.fasterxml.jackson.core:jackson-annotations:$fasterxmlVersion"
    api "io.micrometer:micrometer-registry-jmx:$micrometerVersion"
    api "io.micrometer:micrometer-registry-prometheus:$micrometerVersion"
    api "io.prometheus.jmx:$jmxAgent:$jmxPrometheusVersion"
    api "com.google.guava:guava:$guavaVersion"
    implementation "org.eclipse.collections:eclipse-collections:$eclipseCollectionVersion"
    implementation "org.jetbrains:annotations:$jetbrainVersion"
    testImplementation "org.openjdk.jmh:jmh-core:$jmhVersion"
    annotationProcessor "org.openjdk.jmh:jmh-generator-annprocess:$jmhVersion"
    testImplementation "org.openjdk.jmh:jmh-core-benchmarks:$jmhVersion"
}

jmh {
    jvmArgs = ["-Djmh.blackhole.autoDetect=false"]
    excludes = ['org.openjdk.jmh.benchmarks',]
}

def cqueuePerformanceReport = layout.buildDirectory.file(
        "reports/jmh/cqueue-performance.json")

tasks.register('runCQueuePerformanceBenchmark', JavaExec) {
    group = 'verification'
    description = 'Runs the isolated JDK 25 CQueue versus ConcurrentLinkedQueue benchmarks.'
    dependsOn tasks.named('jmhJar')
    classpath = files(tasks.named('jmhJar').flatMap { it.archiveFile })
    mainClass = 'org.openjdk.jmh.Main'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    jvmArgs rootProject.ext.sbkRuntimeJvmArgs
    args 'io.perl.benchmark.QueueBenchmark.*',
            '-wi', '3',
            '-i', '5',
            '-f', '3',
            '-w', '1s',
            '-r', '1s',
            '-prof', 'gc',
            '-jvmArgs', (rootProject.ext.sbkRuntimeJvmArgs
                    + ['-Djmh.blackhole.autoDetect=false']).join(' '),
            '-rf', 'json',
            '-rff', cqueuePerformanceReport.get().asFile.absolutePath
    outputs.file(cqueuePerformanceReport)
    outputs.upToDateWhen { false }
    doFirst {
        cqueuePerformanceReport.get().asFile.parentFile.mkdirs()
        delete cqueuePerformanceReport
    }
}

tasks.register('cqueuePerformanceTest') {
    group = 'verification'
    description = 'Verifies lower CQueue latency and higher 4P/1C throughput on JDK 25.'
    dependsOn tasks.named('runCQueuePerformanceBenchmark')

    doLast {
        def results = new groovy.json.JsonSlurper().parse(cqueuePerformanceReport.get().asFile)
        def byBenchmark = results.collectEntries { [(it.benchmark): it] }
        def result = { String benchmark ->
            def value = byBenchmark[benchmark]
            if (value == null) {
                throw new GradleException("Missing JMH result: ${benchmark}")
            }
            if (!value.jdkVersion.toString().startsWith('25')) {
                throw new GradleException(
                        "CQueue performance verification requires JDK 25; found ${value.jdkVersion}")
            }
            value
        }

        def cqueueLatency = result(
                'io.perl.benchmark.QueueBenchmark.cqueueRoundTrip').primaryMetric
        def jdkLatency = result(
                'io.perl.benchmark.QueueBenchmark.jdkQueueRoundTrip').primaryMetric
        def cqueueMpsc = result(
                'io.perl.benchmark.QueueBenchmark.cqueueFourProducersOneConsumer')
                .secondaryMetrics.cqueueMpscProducer
        def jdkMpsc = result(
                'io.perl.benchmark.QueueBenchmark.jdkFourProducersOneConsumer')
                .secondaryMetrics.jdkMpscProducer

        if (cqueueLatency.score >= jdkLatency.score * 0.95) {
            throw new GradleException(String.format(
                    'CQueue latency %.3f ns/op is not at least 5%% lower than JDK latency %.3f ns/op',
                    cqueueLatency.score, jdkLatency.score))
        }
        if (cqueueLatency.scoreConfidence[1] >= jdkLatency.scoreConfidence[0]) {
            throw new GradleException(
                    'CQueue and JDK latency confidence intervals overlap')
        }
        if (cqueueMpsc.score <= jdkMpsc.score * 1.02) {
            throw new GradleException(String.format(
                    'CQueue throughput %.0f ops/s is not at least 2%% higher than JDK throughput %.0f ops/s',
                    cqueueMpsc.score, jdkMpsc.score))
        }
        if (cqueueMpsc.scoreConfidence[0] <= jdkMpsc.scoreConfidence[1]) {
            throw new GradleException(
                    'CQueue and JDK MPSC throughput confidence intervals overlap')
        }

        logger.lifecycle(String.format(
                'CQueue performance verified: %.3f versus %.3f ns/op; %.0f versus %.0f MPSC ops/s',
                cqueueLatency.score, jdkLatency.score, cqueueMpsc.score, jdkMpsc.score))
        logger.lifecycle("JMH report: ${cqueuePerformanceReport.get().asFile}")
    }
}

tasks.register('updateDocs') {
    dependsOn javadoc
    doLast {
        println "Update $projectDir Javadocs"
        delete "$projectDir/javadoc"
        copy {
            from "$projectDir/build/docs/javadoc"
            into "$projectDir/javadoc"
        }
    }
}
