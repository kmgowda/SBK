buildscript {
    repositories {
        mavenCentral()
        maven {
            url = "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath "org.nosphere.apache:creadur-rat-gradle:$apacheRatVersion"
        classpath "me.champeau.jmh:jmh-gradle-plugin:$jmhGradleVersion"
    }
}

apply plugin: 'java-library'
apply plugin: "maven-publish"
apply plugin: "com.github.spotbugs"
apply plugin: "me.champeau.jmh"

//apply plugin: 'org.jreleaser'
apply from: "$rootDir/gradle/rat.gradle"
apply from: "$rootDir/gradle/maven.gradle"
apply from: "$rootDir/gradle/spotbugs.gradle"

def timeStampQueueMinimumAllocationReductionBytes = providers.gradleProperty(
        'timeStampQueueMinimumAllocationReductionBytes').map {
    it.toDouble()
}

sourceSets {
    lincheck {
        java.srcDir 'src/lincheck/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    jcstress {
        java.srcDir 'src/jcstress/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    lincheckImplementation.extendsFrom testImplementation
    lincheckRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    annotationProcessor "org.projectlombok:lombok:$lombokVersion"
    api "jakarta.annotation:jakarta.annotation-api:$javaxAnnotationVersion"
    api "org.projectlombok:lombok:$lombokVersion"
    api "com.github.spotbugs:spotbugs-annotations:$spotbugsVersion"
    api "commons-cli:commons-cli:$commonsCliVersion"
    api "org.apache.commons:commons-csv:$apacheCommonsCsvVersion"
    api "org.hdrhistogram:HdrHistogram:$HdrHistogramVersion"
    api "org.slf4j:slf4j-api:$slf4jVersion"
    api "org.slf4j:slf4j-simple:$slf4jVersion"
    api "tools.jackson.dataformat:jackson-dataformat-properties:$jacksonVersion"
    api "tools.jackson.dataformat:jackson-dataformat-yaml:$jacksonVersion"
    api "tools.jackson.core:jackson-databind:$jacksonVersion"
    api "com.fasterxml.jackson.core:jackson-annotations:$fasterxmlVersion"
    api "io.micrometer:micrometer-registry-jmx:$micrometerVersion"
    api "io.micrometer:micrometer-registry-prometheus:$micrometerVersion"
    api "io.prometheus.jmx:$jmxAgent:$jmxPrometheusVersion"
    api "com.google.guava:guava:$guavaVersion"
    implementation "org.eclipse.collections:eclipse-collections:$eclipseCollectionVersion"
    implementation "org.jetbrains:annotations:$jetbrainVersion"
    testImplementation "org.openjdk.jmh:jmh-core:$jmhVersion"
    annotationProcessor "org.openjdk.jmh:jmh-generator-annprocess:$jmhVersion"
    testImplementation "org.openjdk.jmh:jmh-core-benchmarks:$jmhVersion"
    lincheckImplementation "org.jetbrains.lincheck:lincheck:$lincheckVersion"
    jcstressImplementation "org.openjdk.jcstress:jcstress-core:$jcstressVersion"
    jcstressAnnotationProcessor "org.openjdk.jcstress:jcstress-core:$jcstressVersion"
}

jmh {
    jvmArgs = ["-Djmh.blackhole.autoDetect=false"]
    excludes = ['org.openjdk.jmh.benchmarks',]
}

def cqueuePerformanceReport = layout.buildDirectory.file(
        "reports/jmh/cqueue-performance.json")
def timeStampQueuePerformanceReport = layout.buildDirectory.file(
        "reports/jmh/timestamp-queue-performance.json")
def latencyMapPerformanceReport = layout.buildDirectory.file(
        "reports/jmh/latency-map-performance.json")

tasks.register('runTimeStampQueuePerformanceBenchmark', JavaExec) {
    group = 'verification'
    description = 'Benchmarks the intrusive TimeStamp MPSC queue against the JDK 25 queue.'
    dependsOn tasks.named('jmhJar')
    classpath = files(tasks.named('jmhJar').flatMap { it.archiveFile })
    mainClass = 'org.openjdk.jmh.Main'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(rootProject.ext.sbkJavaMajorVersion)
    }
    jvmArgs rootProject.ext.sbkRuntimeJvmArgs
    args 'io.perl.benchmark.TimeStampQueueBenchmark.*',
            '-prof', 'gc',
            '-jvmArgs', (rootProject.ext.sbkRuntimeJvmArgs
                    + ['-Djmh.blackhole.autoDetect=false']).join(' '),
            '-rf', 'json',
            '-rff', timeStampQueuePerformanceReport.get().asFile.absolutePath
    outputs.file(timeStampQueuePerformanceReport)
    outputs.upToDateWhen { false }
    doFirst {
        timeStampQueuePerformanceReport.get().asFile.parentFile.mkdirs()
        delete timeStampQueuePerformanceReport
    }
}

tasks.register('timeStampQueuePerformanceTest') {
    group = 'verification'
    description = 'Verifies intrusive timestamp latency, allocation, and MPSC progress on JDK 25.'
    dependsOn tasks.named('runTimeStampQueuePerformanceBenchmark')

    doLast {
        def results = new groovy.json.JsonSlurper().parse(
                timeStampQueuePerformanceReport.get().asFile)
        def byBenchmark = results.collectEntries { [(it.benchmark): it] }
        def result = { String benchmark ->
            def value = byBenchmark[benchmark]
            if (value == null) {
                throw new GradleException("Missing JMH result: ${benchmark}")
            }
            if (!value.jdkVersion.toString().startsWith('25')) {
                throw new GradleException(
                        "Timestamp queue verification requires JDK 25; found ${value.jdkVersion}")
            }
            value
        }

        def intrusiveRoundTrip = result(
                'io.perl.benchmark.TimeStampQueueBenchmark.intrusiveRoundTrip')
        def jdkRoundTrip = result(
                'io.perl.benchmark.TimeStampQueueBenchmark.jdkRoundTrip')
        def intrusiveLatency = intrusiveRoundTrip.primaryMetric
        def jdkLatency = jdkRoundTrip.primaryMetric
        def intrusiveAllocation =
                intrusiveRoundTrip.secondaryMetrics['gc.alloc.rate.norm']
        def jdkAllocation =
                jdkRoundTrip.secondaryMetrics['gc.alloc.rate.norm']
        def intrusiveMpsc = result(
                'io.perl.benchmark.TimeStampQueueBenchmark'
                        + '.intrusiveFourProducersOneConsumer')
                .secondaryMetrics.intrusiveProducer
        def jdkMpsc = result(
                'io.perl.benchmark.TimeStampQueueBenchmark'
                        + '.jdkFourProducersOneConsumer')
                .secondaryMetrics.jdkProducer

        def latencyReduction = jdkLatency.score - intrusiveLatency.score
        def latencyReductionPercent =
                latencyReduction * 100.0 / jdkLatency.score
        def allocationReduction =
                jdkAllocation.score - intrusiveAllocation.score
        def allocationReductionPercent =
                allocationReduction * 100.0 / jdkAllocation.score
        def throughputIncrease = intrusiveMpsc.score - jdkMpsc.score
        def throughputIncreasePercent =
                throughputIncrease * 100.0 / jdkMpsc.score
        def throughputVerdict
        if (intrusiveMpsc.scoreConfidence[0]
                > jdkMpsc.scoreConfidence[1]) {
            throughputVerdict = 'MPSC_FASTER'
        } else if (jdkMpsc.scoreConfidence[0]
                > intrusiveMpsc.scoreConfidence[1]) {
            throughputVerdict = 'JDK_CLQ_FASTER'
        } else {
            throughputVerdict = 'INCONCLUSIVE'
        }

        logger.lifecycle('Timestamp queue performance comparison '
                + '(TimeStampMpscQueue vs JDK 25 ConcurrentLinkedQueue):')
        logger.lifecycle(String.format(
                '  Round-trip latency : %.3f vs %.3f ns/op'
                        + ' -- TimeStampMpscQueue is %.3f ns/op (%.2f%%) %s',
                intrusiveLatency.score, jdkLatency.score,
                Math.abs(latencyReduction), Math.abs(latencyReductionPercent),
                latencyReduction >= 0 ? 'lower (better)' : 'higher (worse)'))
        logger.lifecycle(String.format(
                '  Allocation        : %.3f vs %.3f B/op'
                        + ' -- TimeStampMpscQueue allocates %.3f B/op (%.2f%%) %s',
                intrusiveAllocation.score, jdkAllocation.score,
                Math.abs(allocationReduction),
                Math.abs(allocationReductionPercent),
                allocationReduction >= 0 ? 'less (better)' : 'more (worse)'))
        logger.lifecycle(String.format(
                '  MPSC throughput   : %.0f vs %.0f ops/s'
                        + ' -- TimeStampMpscQueue is %.0f ops/s (%.2f%%) %s',
                intrusiveMpsc.score, jdkMpsc.score,
                Math.abs(throughputIncrease),
                Math.abs(throughputIncreasePercent),
                throughputIncrease >= 0 ? 'higher (better)' : 'lower (worse)'))
        logger.lifecycle(String.format(
                '  MPSC 99.9%% CI     : [%.0f, %.0f] vs [%.0f, %.0f] ops/s'
                        + ' -- %s',
                intrusiveMpsc.scoreConfidence[0],
                intrusiveMpsc.scoreConfidence[1],
                jdkMpsc.scoreConfidence[0],
                jdkMpsc.scoreConfidence[1],
                throughputVerdict))
        logger.lifecycle(
                "JMH report: ${timeStampQueuePerformanceReport.get().asFile}")

        if (intrusiveLatency.score >= jdkLatency.score) {
            throw new GradleException(String.format(
                    'TimeStampMpscQueue latency %.3f ns/op is not below '
                            + 'ConcurrentLinkedQueue latency %.3f ns/op',
                    intrusiveLatency.score, jdkLatency.score))
        }
        if (intrusiveAllocation.score > jdkAllocation.score
                - timeStampQueueMinimumAllocationReductionBytes.get()) {
            throw new GradleException(String.format(
                    'TimeStampMpscQueue allocation %.3f B/op does not remove '
                            + 'a ConcurrentLinkedQueue node from %.3f B/op',
                    intrusiveAllocation.score, jdkAllocation.score))
        }
        logger.lifecycle('Timestamp queue latency and allocation '
                + 'verification: PASSED; throughput is classified, not gated')
    }
}

