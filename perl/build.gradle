tasks.register('percentilePerformanceTest') {
    group = 'verification'
    description = 'Reports PerL exact versus HdrHistogram recording and percentile performance.'
    dependsOn tasks.named('runPercentilePerformanceBenchmark')

    doLast {
        def results = new groovy.json.JsonSlurper().parse(
                percentilePerformanceReport.get().asFile)
        def result = { String benchmark, Map expectedParams ->
            def value = results.find { entry ->
                entry.benchmark.tokenize('.').last() == benchmark
                        && expectedParams.every { key, expectedValue ->
                            entry.params[key].toString() == expectedValue.toString()
                        }
            }
            if (value == null) {
                throw new GradleException(
                        "Missing percentile JMH result: ${benchmark} ${expectedParams}")
            }
            if (!value.jdkVersion.toString().startsWith(expectedJavaMajor)) {
                throw new GradleException(
                        "Percentile comparison requires JDK ${expectedJavaMajor}; found "
                                + value.jdkVersion)
            }
            value
        }
        def metric = { entry -> entry.primaryMetric }
        def allocation = { entry ->
            entry.secondaryMetrics['gc.alloc.rate.norm']
        }
        def printResult = { String label, entry, String unit ->
            logger.lifecycle(String.format(
                    '  %-31s %,12.3f %s; %,10.3f B/op', label,
                    metric(entry).score, unit,
                    allocation(entry).score))
        }
        def printWinner = { leftLabel, leftEntry, rightLabel,
                            rightEntry, higherIsBetter, measurement ->
                def left = metric(leftEntry)
                def right = metric(rightEntry)
                def leftWins = higherIsBetter
                        ? left.scoreConfidence[0] > right.scoreConfidence[1]
                        : left.scoreConfidence[1] < right.scoreConfidence[0]
                def rightWins = higherIsBetter
                        ? right.scoreConfidence[0] > left.scoreConfidence[1]
                        : right.scoreConfidence[1] < left.scoreConfidence[0]
                def meanWinner = higherIsBetter
                        ? (left.score >= right.score ? leftLabel : rightLabel)
                        : (left.score <= right.score ? leftLabel : rightLabel)
                def winnerScore = higherIsBetter
                        ? Math.max(left.score, right.score)
                        : Math.min(left.score, right.score)
                def loserScore = higherIsBetter
                        ? Math.min(left.score, right.score)
                        : Math.max(left.score, right.score)
                def difference = loserScore == 0.0d
                        ? 0.0d
                        : Math.abs(winnerScore - loserScore) * 100.0d / loserScore
                def direction = higherIsBetter ? 'higher' : 'lower'
                def confidence
                if (leftWins) {
                    confidence = "${leftLabel} is statistically better"
                } else if (rightWins) {
                    confidence = "${rightLabel} is statistically better"
                } else {
                    confidence = 'INCONCLUSIVE: 99.9% confidence intervals overlap'
                }
                logger.lifecycle(String.format(
                        '    - %s vs %s: %s; %s has %.2f%% %s mean %s',
                        leftLabel, rightLabel, confidence, meanWinner,
                        difference, direction, measurement))
        }

        logger.lifecycle('PerL exact versus HdrHistogram JMH comparison')
        def combinations = results.findAll {
            it.benchmark.endsWith('.arrayFrequencyUpdate')
        }.collect {
            [distribution: it.params.distribution,
             distinctLatencies: it.params.distinctLatencies]
        }.toSorted { left, right ->
            def distributionOrder = left.distribution <=> right.distribution
            distributionOrder != 0
                    ? distributionOrder
                    : left.distinctLatencies.toInteger()
                    <=> right.distinctLatencies.toInteger()
        }
        combinations.each { params ->
            def arrayUpdate = result('arrayFrequencyUpdate', params)
            def primitiveUpdate = result('primitiveFrequencyUpdate', params)
            def hdrUpdate = result('hdrFrequencyUpdate', params)
            def windowParams = params + [observations: '65536']
            def arrayWindow = result('arrayPercentileWindow', windowParams)
            def primitiveWindow = result('primitivePercentileWindow',
                    windowParams)
            def hdrWindow = result('hdrPercentileWindow', windowParams)
            def slots = params.distinctLatencies.toInteger()
            logger.lifecycle(String.format(
                    '%s distribution; %,d latency slots (%,.2f MiB array):',
                    params.distribution, slots, slots * 8.0d / (1024 * 1024)))
            logger.lifecycle(' Frequency-update throughput (higher is better):')
            printResult('ArrayLatencyRecorder', arrayUpdate, 'ops/s')
            printResult('LongHashMapLatencyRecorder', primitiveUpdate, 'ops/s')
            printResult('HdrHistogram (3 digits)', hdrUpdate, 'ops/s')
            logger.lifecycle('  Winner analysis against HdrHistogram:')
            printWinner('ArrayLatencyRecorder', arrayUpdate,
                    'HdrHistogram', hdrUpdate, true, 'throughput')
            printWinner('LongHashMapLatencyRecorder', primitiveUpdate,
                    'HdrHistogram', hdrUpdate, true, 'throughput')
            logger.lifecycle(' Complete 65,536-observation percentile window '
                    + '(lower is better):')
            printResult('ArrayLatencyRecorder', arrayWindow, 'us/window')
            printResult('LongHashMapLatencyRecorder', primitiveWindow,
                    'us/window')
            printResult('HdrHistogram (3 digits)', hdrWindow, 'us/window')
            logger.lifecycle('  Winner analysis against HdrHistogram:')
            printWinner('ArrayLatencyRecorder', arrayWindow,
                    'HdrHistogram', hdrWindow, false, 'window time')
            printWinner('LongHashMapLatencyRecorder', primitiveWindow,
                    'HdrHistogram', hdrWindow, false, 'window time')
        }
        logger.lifecycle('Performance is reported, not gated: exact retention '
                + 'and HdrHistogram quantization have different semantics.')
        logger.lifecycle("JMH report: ${percentilePerformanceReport.get().asFile}")
    }
}

tasks.register('latencyMapPerformanceTest') {
    group = 'verification'
    description = 'Compares exact latency recorders, hybrid pages, and sparse promotion thresholds.'
    dependsOn tasks.named('runLatencyMapPerformanceBenchmark')

    doLast {
        def results = new groovy.json.JsonSlurper().parse(
                latencyMapPerformanceReport.get().asFile)
        def byBenchmark = results.collectEntries { [(it.benchmark): it] }
        def result = { String benchmark ->
            def value = byBenchmark[benchmark]
            if (value == null) {
                throw new GradleException(
                        "Missing latency-map JMH result: ${benchmark}")
            }
            if (!value.jdkVersion.toString().startsWith(expectedJavaMajor)) {
                throw new GradleException(
                        "Latency-map comparison requires JDK ${expectedJavaMajor}; found "
                                + value.jdkVersion)
            }
            value
        }
        def parameterResult = { String benchmark, Map<String, String> expected ->
            def value = results.find { entry ->
                entry.benchmark == benchmark && expected.every { key, expectedValue ->
                    entry.params[key].toString() == expectedValue
                }
            }
            if (value == null) {
                throw new GradleException(
                        "Missing parameterized latency-map JMH result: ${benchmark} ${expected}")
            }
            value
        }

        def primitive = result(
                'io.perl.benchmark.LatencyMapBenchmark'
                        + '.primitiveRecordLatency')
        def boxed = result(
                'io.perl.benchmark.LatencyMapBenchmark'
                        + '.boxedRecordLatency')
        def array = result(
                'io.perl.benchmark.LatencyMapBenchmark'
                        + '.arrayRecordLatency')
        def primitiveThroughput = primitive.primaryMetric
        def boxedThroughput = boxed.primaryMetric
        def arrayThroughput = array.primaryMetric
        def primitiveAllocation =
                primitive.secondaryMetrics['gc.alloc.rate.norm']
        def boxedAllocation = boxed.secondaryMetrics['gc.alloc.rate.norm']
        def arrayAllocation =
                array.secondaryMetrics['gc.alloc.rate.norm']
        def arrayWindow = result(
                'io.perl.benchmark.LatencyMapBenchmark.arrayWindow')
        def boxedWindow = result(
                'io.perl.benchmark.LatencyMapBenchmark.boxedWindow')
        def primitiveWindow = result(
                'io.perl.benchmark.LatencyMapBenchmark.primitiveWindow')
        def hybridPagedWindow = result(
                'io.perl.benchmark.LatencyMapBenchmark.hybridPagedWindow')
        def primitiveSparseWindow = result(
                'io.perl.benchmark.LatencyMapBenchmark.primitiveSparseWindow')
        def hybridPagedSparseWindow = result(
                'io.perl.benchmark.LatencyMapBenchmark.hybridPagedSparseWindow')
        def promotion32 = parameterResult(
                'io.perl.benchmark.LatencyMapBenchmark.hybridPagedPromotionWindow',
                [distinctLatencies: '64', sparseEntryLimit: '32'])
        def promotion128 = parameterResult(
                'io.perl.benchmark.LatencyMapBenchmark.hybridPagedPromotionWindow',
                [distinctLatencies: '64', sparseEntryLimit: '128'])
        def allocatedExtraction = result(
                'io.perl.benchmark.LatencyMapBenchmark'
                        + '.allocatedSortedListExtraction')
        def reusableExtraction = result(
                'io.perl.benchmark.LatencyMapBenchmark'
                        + '.reusableArrayExtraction')
        def allocatedExtractionTime = allocatedExtraction.primaryMetric
        def reusableExtractionTime = reusableExtraction.primaryMetric
        def allocatedExtractionAllocation =
                allocatedExtraction.secondaryMetrics['gc.alloc.rate.norm']
        def reusableExtractionAllocation =
                reusableExtraction.secondaryMetrics['gc.alloc.rate.norm']
        def arrayWindowAllocation =
                arrayWindow.secondaryMetrics['gc.alloc.rate.norm']
        def primitiveWindowAllocation =
                primitiveWindow.secondaryMetrics['gc.alloc.rate.norm']
        def boxedWindowAllocation =
                boxedWindow.secondaryMetrics['gc.alloc.rate.norm']
        def recorderResults = [
                [
                        name: 'ArrayLatencyRecorder',
                        throughput: arrayThroughput,
                        updateAllocation: arrayAllocation,
                        windowTime: arrayWindow.primaryMetric,
                        windowAllocation: arrayWindowAllocation
                ],
                [
                        name: 'LongHashMapLatencyRecorder',
                        throughput: primitiveThroughput,
                        updateAllocation: primitiveAllocation,
                        windowTime: primitiveWindow.primaryMetric,
                        windowAllocation: primitiveWindowAllocation
                ],
                [
                        name: 'HashMapLatencyRecorder',
                        throughput: boxedThroughput,
                        updateAllocation: boxedAllocation,
                        windowTime: boxedWindow.primaryMetric,
                        windowAllocation: boxedWindowAllocation
                ]
        ]
        def rankHigher = { String label, String unit, String metricName ->
            logger.lifecycle("${label} (higher is better):")
            recorderResults.toSorted {
                left, right ->
                    right[metricName].score <=> left[metricName].score
                }.eachWithIndex { entry, index ->
                    logger.lifecycle(String.format(
                            '  %d. %-26s : %,.0f %s',
                            index + 1, entry['name'],
                            entry[metricName].score, unit))
                }
        }
        def rankLower = {
            String label, String unit, String format, String metricName ->
                logger.lifecycle("${label} (lower is better):")
                recorderResults.toSorted {
                    left, right ->
                        left[metricName].score <=> right[metricName].score
                }.eachWithIndex { entry, index ->
                    logger.lifecycle(String.format(
                            "  %d. %-26s : ${format} %s",
                            index + 1, entry['name'],
                            entry[metricName].score, unit))
                }
        }
        def compareHigher = { left, right, String unit ->
            def winner = left.score >= right.score ? left : right
            def loser = left.score >= right.score ? right : left
            def gain = loser.score == 0.0d
                    ? 0.0d
                    : (winner.score - loser.score) * 100.0 / loser.score
            String.format('%s is %.2f%% higher than %s (+%,.0f %s)',
                    winner['name'], gain, loser['name'],
                    winner.score - loser.score, unit)
        }
        def compareLower = { left, right, String unit ->
            def winner = left.score <= right.score ? left : right
            def loser = left.score <= right.score ? right : left
            def reduction = loser.score == 0.0d
                    ? 0.0d
                    : (loser.score - winner.score) * 100.0 / loser.score
            def reductionText = unit.startsWith('memory')
                    ? String.format('%.6f', reduction)
                    : String.format('%.2f', reduction)
            String.format('%s requires %s%% less %s than %s '
                    + '(%,.3f vs %,.3f)',
                    winner['name'], reductionText, unit, loser['name'],
                    winner.score, loser.score)
        }
        def compareConfidence = { left, right, boolean higherIsBetter ->
            def leftWins = higherIsBetter
                    ? left.metric.scoreConfidence[0]
                    > right.metric.scoreConfidence[1]
                    : left.metric.scoreConfidence[1]
                    < right.metric.scoreConfidence[0]
            def rightWins = higherIsBetter
                    ? right.metric.scoreConfidence[0]
                    > left.metric.scoreConfidence[1]
                    : right.metric.scoreConfidence[1]
                    < left.metric.scoreConfidence[0]
            if (leftWins) {
                return String.format(
                        '%s is statistically better than %s '
                                + '(non-overlapping 99.9%% CIs)',
                        left['name'], right['name'])
            }
            if (rightWins) {
                return String.format(
                        '%s is statistically better than %s '
                                + '(non-overlapping 99.9%% CIs)',
                        right['name'], left['name'])
            }
            String.format(
                    '%s versus %s is INCONCLUSIVE '
                            + '(overlapping 99.9%% CIs)',
                    left['name'], right['name'])
        }
        def namedMetric = { entry, String metricName ->
            [name: entry['name'], score: entry[metricName].score,
             metric: entry[metricName]]
        }
        def arrayResult = recorderResults[0]
        def primitiveResult = recorderResults[1]
        def boxedResult = recorderResults[2]
        def pairs = [
                [arrayResult, primitiveResult],
                [arrayResult, boxedResult],
                [primitiveResult, boxedResult]
        ]

        logger.lifecycle(
                'Latency-recorder JMH comparison (4,096 exact values)')
        rankHigher('Hot-path throughput ranking', 'ops/s', 'throughput')
        logger.lifecycle('  Pairwise mean-throughput comparison:')
        pairs.each { pair ->
            logger.lifecycle('    - ' + compareHigher(
                    namedMetric(pair[0], 'throughput'),
                    namedMetric(pair[1], 'throughput'), 'ops/s'))
        }
        logger.lifecycle('  99.9% confidence-interval comparison:')
        pairs.each { pair ->
            logger.lifecycle('    - ' + compareConfidence(
                    namedMetric(pair[0], 'throughput'),
                    namedMetric(pair[1], 'throughput'), true))
        }
        rankLower('Hot-path allocation ranking', 'B/op', '%,.3f',
                'updateAllocation')
        logger.lifecycle(
                '  Interpretation: ArrayLatencyRecorder and '
                        + 'LongHashMapLatencyRecorder are effectively '
                        + 'zero-allocation at JMH resolution.')
        logger.lifecycle('  Material allocation comparisons:')
        logger.lifecycle('    - ' + compareLower(
                namedMetric(arrayResult, 'updateAllocation'),
                namedMetric(boxedResult, 'updateAllocation'), 'memory/op'))
        logger.lifecycle('    - ' + compareLower(
                namedMetric(primitiveResult, 'updateAllocation'),
                namedMetric(boxedResult, 'updateAllocation'), 'memory/op'))

        logger.lifecycle(
                'Complete 4,096-value window: record + percentile extraction')
        rankLower('Window-time ranking', 'us/window', '%,.3f',
                'windowTime')
        logger.lifecycle('  Pairwise mean window-time comparison:')
        pairs.each { pair ->
            logger.lifecycle('    - ' + compareLower(
                    namedMetric(pair[0], 'windowTime'),
                    namedMetric(pair[1], 'windowTime'), 'time/window'))
        }
        logger.lifecycle('  99.9% confidence-interval comparison:')
        pairs.each { pair ->
            logger.lifecycle('    - ' + compareConfidence(
                    namedMetric(pair[0], 'windowTime'),
                    namedMetric(pair[1], 'windowTime'), false))
        }
        rankLower('Window-allocation ranking', 'B/window', '%,.3f',
                'windowAllocation')
        logger.lifecycle('  Pairwise mean window-allocation comparison:')
        pairs.each { pair ->
            logger.lifecycle('    - ' + compareLower(
                    namedMetric(pair[0], 'windowAllocation'),
                    namedMetric(pair[1], 'windowAllocation'),
                    'memory/window'))
        }
        logger.lifecycle(
                'Percentile key-extraction JMH comparison (65,536 keys):')
        logger.lifecycle(String.format(
                '  Allocating sorted list : %,.3f us/op, %,.3f B/op',
                allocatedExtractionTime.score,
                allocatedExtractionAllocation.score))
        logger.lifecycle(String.format(
                '  Reusable primitive array: %,.3f us/op, %,.3f B/op',
                reusableExtractionTime.score,
                reusableExtractionAllocation.score))
        logger.lifecycle(String.format(
                '  Extraction allocation reduction: %,.3f B/op (%.2f%%)',
                allocatedExtractionAllocation.score
                        - reusableExtractionAllocation.score,
                allocatedExtractionAllocation.score == 0.0d
                        ? 0.0d
                        : (allocatedExtractionAllocation.score
                                - reusableExtractionAllocation.score) * 100.0
                                / allocatedExtractionAllocation.score))
        logger.lifecycle(
                'SBM exact nanosecond hybrid-page comparison (4,096 values):')
        logger.lifecycle(String.format(
                '  Clustered primitive/hybrid: %,.3f / %,.3f us/window; %,.3f / %,.3f B/window',
                primitiveWindow.primaryMetric.score,
                hybridPagedWindow.primaryMetric.score,
                primitiveWindowAllocation.score,
                hybridPagedWindow.secondaryMetrics['gc.alloc.rate.norm'].score))
        logger.lifecycle(String.format(
                '  Sparse primitive/hybrid   : %,.3f / %,.3f us/window; %,.3f / %,.3f B/window',
                primitiveSparseWindow.primaryMetric.score,
                hybridPagedSparseWindow.primaryMetric.score,
                primitiveSparseWindow.secondaryMetrics['gc.alloc.rate.norm'].score,
                hybridPagedSparseWindow.secondaryMetrics['gc.alloc.rate.norm'].score))
        logger.lifecycle(String.format(
                '  64 retained pages, threshold 32/128: %,.3f / %,.3f us; %,.3f / %,.3f B',
                promotion32.primaryMetric.score,
                promotion128.primaryMetric.score,
                promotion32.secondaryMetrics['gc.alloc.rate.norm'].score,
                promotion128.secondaryMetrics['gc.alloc.rate.norm'].score))
        logger.lifecycle(
                "JMH report: ${latencyMapPerformanceReport.get().asFile}")

        if (primitiveAllocation.score >= boxedAllocation.score) {
            throw new GradleException(String.format(
                    'Primitive latency map allocation %.3f B/op is not below '
                            + 'boxed map allocation %.3f B/op',
                    primitiveAllocation.score, boxedAllocation.score))
        }
        if (reusableExtractionAllocation.score
                >= allocatedExtractionAllocation.score) {
            throw new GradleException(String.format(
                    'Reusable extraction allocation %.3f B/op is not below '
                            + 'sorted-list extraction allocation %.3f B/op',
                    reusableExtractionAllocation.score,
                    allocatedExtractionAllocation.score))
        }
        if (hybridPagedWindow.primaryMetric.score
                >= primitiveWindow.primaryMetric.score
                || hybridPagedSparseWindow.primaryMetric.score
                >= primitiveSparseWindow.primaryMetric.score) {
            throw new GradleException(
                    'Hybrid pages did not reduce complete-window time for both exact controls')
        }
        if (hybridPagedWindow.secondaryMetrics['gc.alloc.rate.norm'].score
                >= primitiveWindowAllocation.score
                || hybridPagedSparseWindow.secondaryMetrics['gc.alloc.rate.norm'].score
                >= primitiveSparseWindow.secondaryMetrics['gc.alloc.rate.norm'].score) {
            throw new GradleException(
                    'Hybrid pages did not reduce allocation for both exact controls')
        }
        if (promotion32.primaryMetric.score
                > promotion128.primaryMetric.score * 1.10d) {
            throw new GradleException(
                    'The default 32-entry sparse threshold regressed retained-page performance')
        }
    }
}

tasks.register('runCQueuePerformanceBenchmark', JavaExec) {
    group = 'verification'
    description = "Runs the isolated JDK ${expectedJavaMajor} CQueue versus ConcurrentLinkedQueue benchmarks."
    dependsOn tasks.named('jmhJar')
    classpath = files(tasks.named('jmhJar').flatMap { it.archiveFile })
    mainClass = 'org.openjdk.jmh.Main'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(rootProject.ext.sbkJavaMajorVersion)
    }
    jvmArgs rootProject.ext.sbkRuntimeJvmArgs
    args 'io.perl.(benchmark.QueueBenchmark|api.impl.CQueueRetentionBenchmark).*',
            '-wi', '3',
            '-i', '5',
            '-f', '3',
            '-w', '1s',
            '-r', '1s',
            '-prof', 'gc',
            '-jvmArgs', (rootProject.ext.sbkRuntimeJvmArgs
                    + ['-Djmh.blackhole.autoDetect=false']).join(' '),
            '-rf', 'json',
            '-rff', cqueuePerformanceReport.get().asFile.absolutePath
    outputs.file(cqueuePerformanceReport)
    outputs.upToDateWhen { false }
    doFirst {
        cqueuePerformanceReport.get().asFile.parentFile.mkdirs()
        delete cqueuePerformanceReport
    }
}

tasks.register('cqueuePerformanceTest') {
    group = 'verification'
    description = "Verifies lower CQueue latency and higher 4P/1C throughput on JDK ${expectedJavaMajor}."
    dependsOn tasks.named('runCQueuePerformanceBenchmark')

    doLast {
        def results = new groovy.json.JsonSlurper().parse(cqueuePerformanceReport.get().asFile)
        def byBenchmark = results.collectEntries { [(it.benchmark): it] }
        def result = { String benchmark ->
            def value = byBenchmark[benchmark]
            if (value == null) {
                throw new GradleException("Missing JMH result: ${benchmark}")
            }
            if (!value.jdkVersion.toString().startsWith(expectedJavaMajor)) {
                throw new GradleException(
                        "CQueue performance verification requires JDK ${expectedJavaMajor}; found ${value.jdkVersion}")
            }
            value
        }

        def cqueueLatency = result(
                'io.perl.benchmark.QueueBenchmark.cqueueRoundTrip').primaryMetric
        def jdkLatency = result(
                'io.perl.benchmark.QueueBenchmark.jdkQueueRoundTrip').primaryMetric
        def cqueueMpsc = result(
                'io.perl.benchmark.QueueBenchmark.cqueueFourProducersOneConsumer')
                .secondaryMetrics.cqueueMpscProducer
        def jdkMpsc = result(
                'io.perl.benchmark.QueueBenchmark.jdkFourProducersOneConsumer')
                .secondaryMetrics.jdkMpscProducer
        def cqueueAllocation = result(
                'io.perl.benchmark.QueueBenchmark.cqueueRoundTrip')
                .secondaryMetrics['gc.alloc.rate.norm']
        def jdkAllocation = result(
                'io.perl.benchmark.QueueBenchmark.jdkQueueRoundTrip')
                .secondaryMetrics['gc.alloc.rate.norm']
        def retention = result(
                'io.perl.api.impl.CQueueRetentionBenchmark.boundedRetiredHeap')

        if (cqueueLatency.score >= jdkLatency.score * 0.95) {
            throw new GradleException(String.format(
                    'CQueue latency %.3f ns/op is not at least 5%% lower than JDK latency %.3f ns/op',
                    cqueueLatency.score, jdkLatency.score))
        }
        if (cqueueLatency.scoreConfidence[1] >= jdkLatency.scoreConfidence[0]) {
            throw new GradleException(
                    'CQueue and JDK latency confidence intervals overlap')
        }
        if (cqueueMpsc.score <= jdkMpsc.score * 1.02) {
            throw new GradleException(String.format(
                    'CQueue throughput %.0f ops/s is not at least 2%% higher than JDK throughput %.0f ops/s',
                    cqueueMpsc.score, jdkMpsc.score))
        }
        if (cqueueMpsc.scoreConfidence[0] <= jdkMpsc.scoreConfidence[1]) {
            throw new GradleException(
                    'CQueue and JDK MPSC throughput confidence intervals overlap')
        }
        if (cqueueAllocation.score > jdkAllocation.score + 1.0) {
            throw new GradleException(String.format(
                    'CQueue allocates %.3f B/op versus JDK %.3f B/op',
                    cqueueAllocation.score, jdkAllocation.score))
        }
        if (retention.primaryMetric.score <= 0) {
            throw new GradleException(
                    'CQueue stalled-producer retained-heap benchmark did not make progress')
        }

        logger.lifecycle(String.format(
                'CQueue verified: %.3f versus %.3f ns/op; %.0f versus %.0f MPSC ops/s; '
                        + '%.3f versus %.3f B/op; stalled-producer heap remained bounded',
                cqueueLatency.score, jdkLatency.score, cqueueMpsc.score, jdkMpsc.score,
                cqueueAllocation.score, jdkAllocation.score))
        logger.lifecycle("JMH report: ${cqueuePerformanceReport.get().asFile}")
    }
}

def gcSoakJavaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(rootProject.ext.sbkJavaMajorVersion)
}
def gcSoakJavaRuntimeInputs = [
        javaRuntimeVersion: gcSoakJavaLauncher.map { it.metadata.javaRuntimeVersion },
        javaVmVersion     : gcSoakJavaLauncher.map { it.metadata.jvmVersion },
        javaVendor        : gcSoakJavaLauncher.map { it.metadata.vendor.toString() },
        operatingSystem   : providers.systemProperty('os.name'),
        osArchitecture    : providers.systemProperty('os.arch')
]
def configureGcSoakCaching = { JavaExec task, String markerName ->
    def verificationMarker = layout.buildDirectory.file("verification/${markerName}.verified")
    def verificationMarkerPath = verificationMarker.get().asFile.absolutePath
    def verifiedMainClass = task.mainClass.get()
    gcSoakJavaRuntimeInputs.each { propertyName, propertyValue ->
        task.inputs.property(propertyName, propertyValue)
    }
    task.outputs.file(verificationMarker)
    task.outputs.cacheIf(
            'GC reclamation is reproducible from the test runtime classpath and Java environment') {
        true
    }
    task.doLast {
        def markerFile = new File(verificationMarkerPath)
        markerFile.parentFile.mkdirs()
        markerFile.text = "${verifiedMainClass} verified${System.lineSeparator()}"
    }
}

tasks.register('cqueueGcTest', JavaExec) {
    group = 'verification'
    description = 'Verifies CQueue reclamation and payload release in a constrained 32 MB JVM.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.perl.api.impl.CQueueGcSoak'
    javaLauncher = gcSoakJavaLauncher
    jvmArgs rootProject.ext.sbkRuntimeJvmArgs
    jvmArgs '-Xms32m', '-Xmx32m', '-XX:+ExitOnOutOfMemoryError'
    configureGcSoakCaching(delegate, 'cqueue-gc-soak')
}

tasks.register('timeStampMpscQueueGcTest', JavaExec) {
    group = 'verification'
    description = 'Verifies intrusive TimeStamp MPSC reclamation in a constrained 32 MB JVM.'
    dependsOn tasks.named('testClasses')
