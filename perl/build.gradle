buildscript {
    repositories {
        mavenCentral()
        maven {
            url = gradlePluginRepositoryUrl
        }
    }
    dependencies {
        classpath "me.champeau.jmh:jmh-gradle-plugin:$jmhGradleVersion"
    }
}

apply plugin: 'java-library'
apply plugin: "maven-publish"
apply plugin: "com.github.spotbugs"
apply plugin: "me.champeau.jmh"

//apply plugin: 'org.jreleaser'
apply from: "$rootDir/gradle/rat.gradle"
apply from: "$rootDir/gradle/maven.gradle"
apply from: "$rootDir/gradle/spotbugs.gradle"

def timeStampQueueMinimumAllocationReductionBytes = providers.gradleProperty(
        'timeStampQueueMinimumAllocationReductionBytes').map {
    it.toDouble()
}
def expectedJavaMajor = rootProject.ext.sbkJavaMajorVersion.toString()

sourceSets {
    lincheck {
        java.srcDir 'src/lincheck/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    jcstress {
        java.srcDir 'src/jcstress/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    lincheckImplementation.extendsFrom testImplementation
    lincheckRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    annotationProcessor "org.projectlombok:lombok:$lombokVersion"
    api "jakarta.annotation:jakarta.annotation-api:$javaxAnnotationVersion"
    api "commons-cli:commons-cli:$commonsCliVersion"
    api "org.apache.commons:commons-csv:$apacheCommonsCsvVersion"
    api "org.hdrhistogram:HdrHistogram:$HdrHistogramVersion"
    api "org.slf4j:slf4j-api:$slf4jVersion"
    api "org.slf4j:slf4j-simple:$slf4jVersion"
    api "tools.jackson.dataformat:jackson-dataformat-properties:$jacksonVersion"
    api "tools.jackson.dataformat:jackson-dataformat-yaml:$jacksonVersion"
    api "tools.jackson.core:jackson-databind:$jacksonVersion"
    api "com.fasterxml.jackson.core:jackson-annotations:$fasterxmlVersion"
    api "io.micrometer:micrometer-registry-jmx:$micrometerVersion"
    api "io.micrometer:micrometer-registry-prometheus:$micrometerVersion"
    api "io.prometheus.jmx:$jmxAgent:$jmxPrometheusVersion"
    api "com.google.guava:guava:$guavaVersion"
    implementation "org.eclipse.collections:eclipse-collections:$eclipseCollectionVersion"
    implementation "org.jetbrains:annotations:$jetbrainVersion"
    testImplementation "org.openjdk.jmh:jmh-core:$jmhVersion"
    annotationProcessor "org.openjdk.jmh:jmh-generator-annprocess:$jmhVersion"
    testImplementation "org.openjdk.jmh:jmh-core-benchmarks:$jmhVersion"
    lincheckImplementation "org.jetbrains.lincheck:lincheck:$lincheckVersion"
    jcstressImplementation "org.openjdk.jcstress:jcstress-core:$jcstressVersion"
    jcstressAnnotationProcessor "org.openjdk.jcstress:jcstress-core:$jcstressVersion"
}

jmh {
    excludes = ['org.openjdk.jmh.benchmarks',]
}

def cqueuePerformanceReport = layout.buildDirectory.file(
        "reports/jmh/cqueue-performance.json")
def timeStampQueuePerformanceReport = layout.buildDirectory.file(
        "reports/jmh/timestamp-queue-performance.json")
def latencyMapPerformanceReport = layout.buildDirectory.file(
        "reports/jmh/latency-map-performance.json")
def percentilePerformanceReport = layout.buildDirectory.file(
        "reports/jmh/percentile-performance.json")
def periodicRecorderPerformanceReport = layout.buildDirectory.file(
        "reports/jmh/periodic-recorder-performance.json")

tasks.register('periodicRecorderPerformanceTest', JavaExec) {
    group = 'verification'
    description = 'Verifies array-specialized PerL periodic recording latency with JMH.'
    dependsOn tasks.named('jmhJar')
    classpath = files(tasks.named('jmhJar').flatMap { it.archiveFile })
    mainClass = 'org.openjdk.jmh.Main'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(rootProject.ext.sbkJavaMajorVersion)
    }
    jvmArgs rootProject.ext.sbkRuntimeJvmArgs
    args 'io.perl.benchmark.PeriodicRecorderCallbackBenchmark.*',
            '-prof', 'gc',
            '-jvmArgs', (rootProject.ext.sbkRuntimeJvmArgs
                    + ['-Djmh.blackhole.autoDetect=false']).join(' '),
            '-rf', 'json',
            '-rff', periodicRecorderPerformanceReport.get().asFile.absolutePath
    outputs.file(periodicRecorderPerformanceReport)
    outputs.upToDateWhen { false }
    doFirst {
        periodicRecorderPerformanceReport.get().asFile.parentFile.mkdirs()
        delete periodicRecorderPerformanceReport
    }
    doLast {
        def results = new groovy.json.JsonSlurper().parse(
                periodicRecorderPerformanceReport.get().asFile)
        def byName = results.collectEntries {
            [(it.benchmark.tokenize('.').last()): it.primaryMetric]
        }
        def requireResult = { String name ->
            def result = byName[name]
            if (result == null) {
                throw new GradleException("Missing PerL recorder JMH result: ${name}")
            }
            result
        }
        def verifyLower = { String optimizedName, String referenceName ->
            def optimized = requireResult(optimizedName)
            def reference = requireResult(referenceName)
            if (optimized.scoreConfidence[1] >= reference.scoreConfidence[0]) {
                throw new GradleException(String.format(
                        '%s JMH 99.9%% CI [%f, %f] does not remain below %s [%f, %f]',
                        optimizedName, optimized.scoreConfidence[0],
                        optimized.scoreConfidence[1], referenceName,
                        reference.scoreConfidence[0], reference.scoreConfidence[1]))
            }
            logger.lifecycle(String.format(
                    '%s: %.2f%% lower mean latency than %s (%.3f vs %.3f ns/op)',
                    optimizedName,
                    (reference.score - optimized.score) * 100.0d / reference.score,
                    referenceName, optimized.score, reference.score))
        }
        verifyLower('arrayWithNoOpCallback', 'withNoOpCallback')
        verifyLower('arrayWithoutCallback', 'withoutCallback')
    }
}

