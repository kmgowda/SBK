def jcstressWorkDirectory = layout.buildDirectory.dir('jcstress')
def jcstressReportDirectory = layout.buildDirectory.dir(
        'reports/jcstress')

tasks.register('jcstressJar', Jar) {
    group = 'build'
    description = 'Builds the self-contained JCStress test harness.'
    dependsOn tasks.named('jcstressClasses')
    archiveClassifier = 'jcstress'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'org.openjdk.jcstress.Main'
    }
    from sourceSets.main.output
    from sourceSets.jcstress.output
    from {
        configurations.jcstressRuntimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    exclude 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/*.SF'
}

tasks.register('jcstress', JavaExec) {
    group = 'verification'
    description = 'Checks TimeStampMpscQueue Java Memory Model outcomes with JCStress.'
    dependsOn tasks.named('jcstressJar')
    classpath = files(tasks.named('jcstressJar').flatMap {
        it.archiveFile
    })
    mainClass = 'org.openjdk.jcstress.Main'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(rootProject.ext.sbkJavaMajorVersion)
    }
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args '-m', 'quick',
            '-t', 'io.perl.api.impl.TimeStampMpscQueue.*Stress',
            '-r', jcstressReportDirectory.get().asFile.absolutePath
    workingDir jcstressWorkDirectory
    outputs.dir(jcstressReportDirectory)
    outputs.upToDateWhen { false }
    doFirst {
        jcstressWorkDirectory.get().asFile.mkdirs()
        delete jcstressReportDirectory
    }
    shouldRunAfter tasks.named('lincheckTest')
    shouldRunAfter tasks.named('test')
    shouldRunAfter tasks.named('timeStampMpscQueueGcTest')
}

tasks.register('concurrencyCheck') {
    group = 'verification'
    description = 'Runs unit, reclamation, Lincheck, and JCStress queue verification.'
    dependsOn tasks.named('test')
    dependsOn tasks.named('timeStampMpscQueueGcTest')
    dependsOn tasks.named('lincheckTest')
    dependsOn tasks.named('jcstress')
    dependsOn tasks.named('checkstyleLincheck')
    dependsOn tasks.named('checkstyleJcstress')
}

