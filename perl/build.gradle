tasks.register('timeStampQueuePerformanceTest') {
    group = 'verification'
    description = "Verifies intrusive timestamp latency, allocation, and MPSC progress on JDK ${expectedJavaMajor}."
    dependsOn tasks.named('runTimeStampQueuePerformanceBenchmark')

    doLast {
        def results = new groovy.json.JsonSlurper().parse(
                timeStampQueuePerformanceReport.get().asFile)
        def byBenchmark = results.collectEntries { [(it.benchmark): it] }
        def result = { String benchmark ->
            def value = byBenchmark[benchmark]
            if (value == null) {
                throw new GradleException("Missing JMH result: ${benchmark}")
            }
            if (!value.jdkVersion.toString().startsWith(expectedJavaMajor)) {
                throw new GradleException(
                        "Timestamp queue verification requires JDK ${expectedJavaMajor}; found ${value.jdkVersion}")
            }
            value
        }

        def intrusiveRoundTrip = result(
                'io.perl.benchmark.TimeStampQueueBenchmark.intrusiveRoundTrip')
        def jdkRoundTrip = result(
                'io.perl.benchmark.TimeStampQueueBenchmark.jdkRoundTrip')
        def intrusiveLatency = intrusiveRoundTrip.primaryMetric
        def jdkLatency = jdkRoundTrip.primaryMetric
        def intrusiveAllocation =
                intrusiveRoundTrip.secondaryMetrics['gc.alloc.rate.norm']
        def jdkAllocation =
                jdkRoundTrip.secondaryMetrics['gc.alloc.rate.norm']
        def intrusiveMpsc = result(
                'io.perl.benchmark.TimeStampQueueBenchmark'
                        + '.intrusiveFourProducersOneConsumer')
                .secondaryMetrics.intrusiveProducer
        def jdkMpsc = result(
                'io.perl.benchmark.TimeStampQueueBenchmark'
                        + '.jdkFourProducersOneConsumer')
                .secondaryMetrics.jdkProducer

        def latencyReduction = jdkLatency.score - intrusiveLatency.score
        def latencyReductionPercent =
                latencyReduction * 100.0 / jdkLatency.score
        def allocationReduction =
                jdkAllocation.score - intrusiveAllocation.score
        def allocationReductionPercent =
                allocationReduction * 100.0 / jdkAllocation.score
        def throughputIncrease = intrusiveMpsc.score - jdkMpsc.score
        def throughputIncreasePercent =
                throughputIncrease * 100.0 / jdkMpsc.score
        def throughputVerdict
        if (intrusiveMpsc.scoreConfidence[0]
                > jdkMpsc.scoreConfidence[1]) {
            throughputVerdict = 'MPSC_FASTER'
        } else if (jdkMpsc.scoreConfidence[0]
                > intrusiveMpsc.scoreConfidence[1]) {
            throughputVerdict = 'JDK_CLQ_FASTER'
        } else {
            throughputVerdict = 'INCONCLUSIVE'
        }

        logger.lifecycle('Timestamp queue performance comparison '
                + "(TimeStampMpscQueue vs JDK ${expectedJavaMajor} ConcurrentLinkedQueue):")
        logger.lifecycle(String.format(
                '  Round-trip latency : %.3f vs %.3f ns/op'
                        + ' -- TimeStampMpscQueue is %.3f ns/op (%.2f%%) %s',
                intrusiveLatency.score, jdkLatency.score,
                Math.abs(latencyReduction), Math.abs(latencyReductionPercent),
                latencyReduction >= 0 ? 'lower (better)' : 'higher (worse)'))
        logger.lifecycle(String.format(
                '  Allocation        : %.3f vs %.3f B/op'
                        + ' -- TimeStampMpscQueue allocates %.3f B/op (%.2f%%) %s',
                intrusiveAllocation.score, jdkAllocation.score,
                Math.abs(allocationReduction),
                Math.abs(allocationReductionPercent),
                allocationReduction >= 0 ? 'less (better)' : 'more (worse)'))
        logger.lifecycle(String.format(
                '  MPSC throughput   : %.0f vs %.0f ops/s'
                        + ' -- TimeStampMpscQueue is %.0f ops/s (%.2f%%) %s',
                intrusiveMpsc.score, jdkMpsc.score,
                Math.abs(throughputIncrease),
                Math.abs(throughputIncreasePercent),
                throughputIncrease >= 0 ? 'higher (better)' : 'lower (worse)'))
        logger.lifecycle(String.format(
                '  MPSC 99.9%% CI     : [%.0f, %.0f] vs [%.0f, %.0f] ops/s'
                        + ' -- %s',
                intrusiveMpsc.scoreConfidence[0],
                intrusiveMpsc.scoreConfidence[1],
                jdkMpsc.scoreConfidence[0],
                jdkMpsc.scoreConfidence[1],
                throughputVerdict))
        logger.lifecycle(
                "JMH report: ${timeStampQueuePerformanceReport.get().asFile}")

        if (intrusiveLatency.score >= jdkLatency.score) {
            throw new GradleException(String.format(
                    'TimeStampMpscQueue latency %.3f ns/op is not below '
                            + 'ConcurrentLinkedQueue latency %.3f ns/op',
                    intrusiveLatency.score, jdkLatency.score))
        }
        if (intrusiveAllocation.score > jdkAllocation.score
                - timeStampQueueMinimumAllocationReductionBytes.get()) {
            throw new GradleException(String.format(
                    'TimeStampMpscQueue allocation %.3f B/op does not remove '
                            + 'a ConcurrentLinkedQueue node from %.3f B/op',
                    intrusiveAllocation.score, jdkAllocation.score))
        }
        logger.lifecycle('Timestamp queue latency and allocation '
                + 'verification: PASSED; throughput is classified, not gated')
    }
}

